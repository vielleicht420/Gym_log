<title>GYM LOG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(160deg,#08070f 0%,#0e0b18 50%,#130d1e 100%);background-attachment:fixed;min-height:100vh}
input,textarea,select{font-size:max(16px,1rem)!important}
/* Hide scrollbar everywhere */
*::-webkit-scrollbar{display:none}
*{-ms-overflow-style:none;scrollbar-width:none}
#root{height:100%;height:100dvh}
#splash{position:fixed;inset:0;background:#08070f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999}
.sp-logo{font-family:'Arial Black',Impact,sans-serif;font-size:2.4rem;font-weight:900;letter-spacing:6px;color:#fff;animation:gp 2s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:1}50%{opacity:.6}}
.sp-ring{width:44px;height:44px;border:3px solid #1a1f2a;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sp-msg{font-size:.6rem;color:#5a6480;letter-spacing:2px;text-transform:uppercase;font-family:Arial,sans-serif}
body.theme-blue{--acc:#60a5fa;--acc2:#3b82f6;--acc3:#93c5fd;--acc-txt:#080a0f}
body.theme-green{--acc:#34d399;--acc2:#10b981;--acc3:#6ee7b7;--acc-txt:#080a0f}
body.theme-purple{--acc:#a78bfa;--acc2:#8b5cf6;--acc3:#c4b5fd;--acc-txt:#ffffff}
body.theme-orange{--acc:#fb923c;--acc2:#f97316;--acc3:#fdba74;--acc-txt:#080a0f}
body.theme-pink{--acc:#f472b6;--acc2:#ec4899;--acc3:#f9a8d4;--acc-txt:#080a0f}
body.theme-yellow{--acc:#fbbf24;--acc2:#f59e0b;--acc3:#fcd34d;--acc-txt:#080a0f}
body.theme-red{--acc:#f87171;--acc2:#ef4444;--acc3:#fca5a5;--acc-txt:#ffffff}

@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
input,textarea,select{font-size:max(16px,1rem)!important;}
:root{
  --bg:transparent;
  --sur:rgba(14,12,22,.85);
  --card:rgba(18,14,28,.8);
  --card2:rgba(22,18,34,.8);
  --bdr:rgba(255,255,255,.06);
  --bdr2:rgba(255,255,255,.04);
  --acc:#ffffff;
  --acc2:#e0e6f0;
  --acc3:#a8b4cc;
  --txt:#f0f2f8;
  --mut:#5a6480;
  --mut2:#3d4560;
  --ga:#7dd3fc;--ga-bg:#0c2a3d;
  --gb:#86efac;--gb-bg:#0c2a1a;
  --red:#f87171;--red-bg:#2d1010;
  --grn:#86efac;--grn-bg:#0c2a1a;
  --gold:#fbbf24;
  --blue:#7dd3fc;
}
body{color:var(--txt);font-family:'Nunito',sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y;}

/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse 100% 60% at 50% 0%,#0d1424 0%,var(--bg) 70%)}
.lc{background:rgba(14,12,22,.97);border:1px solid rgba(255,255,255,.08);border-radius:28px;
  padding:40px 28px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:20px;
  box-shadow:0 32px 80px rgba(0,0,0,.6)}
.logo{font-family:'Montserrat',sans-serif;font-size:2.4rem;font-weight:900;letter-spacing:6px;
  color:var(--acc);text-align:center;line-height:1}
.logo-sub{font-size:.62rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--mut);text-align:center;margin-top:-12px;font-weight:600}
.ltabs{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.ltab{flex:1;padding:9px;text-align:center;font-size:.7rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;
  background:none;color:var(--mut);border-radius:10px;transition:all .2s;font-family:'Nunito',sans-serif}
.ltab.on{background:var(--acc);color:var(--acc-txt,#080a0f)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.fld input{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;font-size:max(16px,.92rem)!important;
  color:var(--txt);font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:600;
  padding:12px 15px;transition:border-color .15s;width:100%}
.fld input:focus{outline:none;border-color:var(--acc)}
.pbtn{background:var(--acc);color:#080a0f;border:none;border-radius:14px;
  font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:800;letter-spacing:2px;
  padding:14px;cursor:pointer;width:100%;transition:opacity .2s;text-transform:uppercase}
.pbtn:hover{opacity:.88}.pbtn:disabled{opacity:.3;cursor:not-allowed}
.merr{background:var(--red-bg);border:1px solid #5a1a1a;border-radius:12px;
  padding:10px 14px;font-size:.78rem;color:var(--red);text-align:center;font-weight:600}
.mok{background:var(--grn-bg);border:1px solid #1a5a38;border-radius:12px;
  padding:10px 14px;font-size:.78rem;color:var(--grn);text-align:center;font-weight:600}
.info-box{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 14px;font-size:.72rem;color:var(--mut);line-height:1.6;text-align:center;font-weight:600}
.info-box strong{color:var(--acc)}

/* SHELL */
.app{min-height:100vh;display:flex;flex-direction:column;background:transparent}
header{background:rgba(8,10,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);padding:14px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:200}
.hlogo{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:900;letter-spacing:4px;color:var(--acc)}
.dot{width:6px;height:6px;background:var(--grn);border-radius:50%;animation:pulse 2.5s infinite;box-shadow:0 0 8px var(--grn)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.upill{margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--bdr);border-radius:24px;padding:5px 14px 5px 6px}
.uav{width:26px;height:26px;border-radius:50%;background:var(--acc);
  display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-size:.8rem;font-weight:900;color:#080a0f}
.uname{font-size:.74rem;font-weight:700;letter-spacing:.3px}
.logoutbtn{background:none;border:none;color:var(--mut);cursor:pointer;
  font-size:.6rem;letter-spacing:1px;text-transform:uppercase;
  font-family:'Nunito',sans-serif;font-weight:700;padding:2px 5px}
.logoutbtn:hover{color:var(--red)}

/* BOTTOM NAV */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  z-index:200;
  background:rgba(8,10,15,.85);
  backdrop-filter:blur(32px) saturate(1.8);
  -webkit-backdrop-filter:blur(32px) saturate(1.8);
  border-top:1px solid rgba(255,255,255,.07);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
  box-shadow:0 -4px 32px rgba(0,0,0,.5);
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
}
.bnav-inner{
  display:flex;align-items:center;
  position:relative;
  touch-action:pan-x;
}
.bnav-glass-pill{
  position:absolute;
  top:0;bottom:0;
  border-radius:20px;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  background:rgba(255,255,255,.07);
  box-shadow:none;
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:left .28s ease-out, width .28s ease-out;
  pointer-events:none;
}
.bnav-glass-pill::after{
  content:'';position:absolute;inset:-2px;border-radius:22px;
  box-shadow:0 0 0 1px rgba(140,200,255,.3),0 0 0 2.5px rgba(255,120,200,.15),0 0 24px rgba(255,255,255,.08);
  pointer-events:none;
}
.bnav-btn{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;
  color:var(--mut);font-family:'Nunito',sans-serif;font-size:.48rem;
  letter-spacing:.5px;text-transform:uppercase;font-weight:800;
  padding:10px 4px;border-radius:20px;
  transition:color .3s ease;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.bnav-btn svg{width:21px;height:21px;stroke-width:1.8;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.bnav-btn span{position:relative}
.bnav-btn.on{color:var(--acc)}
.bnav-btn.on svg{transform:scale(1.15)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);z-index:300;display:flex;align-items:flex-end;
  justify-content:center;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--sur);border-radius:24px 24px 0 0;border:1px solid var(--bdr);
  border-bottom:none;padding:24px 20px 44px;width:100%;max-width:480px;
  animation:slideUp .25s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--bdr2);border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:800;letter-spacing:1px;
  color:var(--txt);margin-bottom:4px;text-transform:uppercase}
.modal-sub{font-size:.62rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;font-weight:600}
.modal-opts{display:flex;flex-direction:column;gap:10px}
.modal-opt{display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:var(--card);border:1.5px solid var(--bdr);border-radius:16px;cursor:pointer;transition:all .15s}
.modal-opt:hover{border-color:var(--bdr2);background:var(--card2)}
.modal-opt.active{border-color:var(--acc);background:rgba(255,255,255,.04)}
.modal-opt-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-family:'Montserrat',sans-serif;font-size:.95rem;font-weight:800;flex-shrink:0}
.modal-opt-icon.A{background:var(--ga-bg);color:var(--ga)}
.modal-opt-icon.B{background:var(--gb-bg);color:var(--gb)}
.modal-opt-icon.R{background:var(--card2);color:var(--mut)}
.modal-opt-text{flex:1}
.modal-opt-name{font-size:.88rem;font-weight:700}
.modal-opt-desc{font-size:.68rem;color:var(--mut);margin-top:2px;font-weight:600}
.modal-opt.active .modal-opt-name{color:var(--acc)}
.modal-cancel{margin-top:14px;width:100%;background:none;border:1.5px solid var(--bdr);
  border-radius:14px;color:var(--mut);font-family:'Nunito',sans-serif;font-weight:700;
  font-size:.78rem;padding:11px;cursor:pointer;transition:all .15s;letter-spacing:1px;text-transform:uppercase}
.modal-cancel:hover{border-color:var(--mut2);color:var(--acc3)}

/* CALENDAR */
.cal-wrap{padding:18px 16px 110px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-month{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:1px;color:var(--txt)}
.cal-nav{background:var(--card);border:1px solid var(--bdr);color:var(--txt);border-radius:10px;
  padding:6px 14px;cursor:pointer;font-size:1.1rem;font-weight:700;transition:all .15s}
.cal-nav:hover{background:var(--card2);border-color:var(--bdr2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day-lbl{text-align:center;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut);padding:5px 0;font-weight:800}
.cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;border:1.5px solid transparent;
  transition:all .15s;gap:3px}
.cal-day:hover{background:var(--card)}
.cal-day.empty{cursor:default;pointer-events:none}
.cal-day.today{border-color:var(--acc)!important}
.cal-day.selected{background:var(--acc);border-color:var(--acc)}
.cal-day.selected .cal-dn{color:#080a0f}
.cal-dn{font-size:.82rem;font-weight:800;color:var(--txt);line-height:1}
.cal-dots{display:flex;gap:2px;justify-content:center}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-dot.A{background:var(--ga)}.cal-dot.B{background:var(--gb)}.cal-dot.rest{background:var(--mut)}
.cal-day.selected .cal-dot.A,.cal-day.selected .cal-dot.B,.cal-day.selected .cal-dot.rest{background:rgba(0,0,0,.3)}

/* TRAINING PAGE */
.page{padding:16px 16px 90px}
.day-banner{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;
  padding:16px 22px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex:1}
.day-banner-date{font-family:'Montserrat',sans-serif;font-size:1.5rem;font-weight:900;color:var(--acc);line-height:1}
.day-banner-info{display:flex;flex-direction:column;gap:2px;flex:1}
.day-banner-tag{font-size:.88rem;font-weight:800}
.day-banner-sub{font-size:.62rem;color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.day-banner-change{background:var(--card2);border:1px solid var(--bdr2);color:var(--acc3);border-radius:14px;
  padding:10px 16px;cursor:pointer;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;
  font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s;flex-shrink:0}
.day-banner-change:hover{border-color:var(--acc);color:var(--acc)}

.statsbar{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:14px 16px;margin-bottom:12px;display:flex;gap:18px;align-items:center}
.stat{display:flex;flex-direction:column;gap:2px}
.sv{font-family:'Montserrat',sans-serif;font-size:1.6rem;font-weight:900;color:var(--acc);line-height:1}
.sl{font-size:.52rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-weight:800}
.savebar{display:flex;justify-content:flex-end;margin-bottom:6px}
.savetxt{font-size:.58rem;letter-spacing:1px;font-weight:700}
.savetxt.ok{color:var(--grn)}.savetxt.ing{color:var(--mut)}
.pbar{height:3px;background:var(--bdr);border-radius:2px;margin-bottom:16px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc3));
  border-radius:2px;transition:width .4s cubic-bezier(.34,1.56,.64,1)}
.dayhdr{font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:900;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:2px;color:var(--txt)}
.daysub{font-size:.58rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:14px;font-weight:700}
.seclbl{font-size:.54rem;letter-spacing:2.5px;color:var(--mut);font-weight:800;
  text-transform:uppercase;margin:18px 0 9px;display:flex;align-items:center;justify-content:space-between}
.add-ex-btn{background:var(--card2);border:1px solid var(--bdr2);color:var(--acc3);border-radius:8px;
  padding:4px 10px;cursor:pointer;font-size:.58rem;letter-spacing:1px;text-transform:uppercase;
  font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s}
.add-ex-btn:hover{border-color:var(--acc);color:var(--acc)}

/* EXERCISE CARD */
.excard{background:rgba(18,14,28,.75);border:1.5px solid rgba(255,255,255,.06);border-radius:18px;
  margin-bottom:10px;overflow:visible;transition:all .3s;animation:flowIn .4s ease both}
.excard.all-done{border-color:rgba(134,239,172,.3);background:rgba(12,42,26,.5)}
.excard.all-done .exname{color:var(--grn)}
.exhdr{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px 7px;gap:8px}
.exname{font-size:.86rem;font-weight:800;letter-spacing:.2px;flex:1;min-width:0}
.exname{font-size:.88rem;font-weight:800;letter-spacing:.2px}
.exhdr-right{display:flex;align-items:center;gap:6px}
.badge{font-size:.58rem;letter-spacing:.5px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.ba{background:rgba(125,211,252,.12);color:var(--ga);border:1px solid rgba(125,211,252,.2)}
.bb{background:rgba(134,239,172,.12);color:var(--gb);border:1px solid rgba(134,239,172,.2)}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--mut);
  transition:color .15s;display:flex;align-items:center;border-radius:6px}
.icon-btn:hover{color:var(--acc)}.icon-btn.del:hover{color:var(--red)}
.sgrid{display:flex;gap:7px;padding:0 14px 12px;flex-wrap:wrap}

/* SET BLOCK */
.sb{background:rgba(16,12,24,.7);border:1.5px solid rgba(255,255,255,.06);border-radius:12px;
  padding:8px 6px;display:flex;flex-direction:column;gap:3px;min-width:62px;flex:1;max-width:90px;transition:all .3s}
.sb.done{border-color:rgba(134,239,172,.4);background:rgba(12,42,26,.6)}
.sb.done .slbl{color:var(--grn)}
.sb.done .si{background:rgba(12,42,26,.4);border-color:rgba(134,239,172,.3);color:var(--grn)}
.sb.done .ulbl{color:rgba(134,239,172,.5)}
.slbl{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);
  text-align:center;font-weight:800;transition:color .3s}
.si{background:var(--bg);border:1.5px solid var(--bdr);border-radius:8px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:max(16px,.78rem);font-weight:800;padding:5px 3px;
  text-align:center;width:100%;-moz-appearance:textfield;transition:all .25s}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none}
.si:focus{outline:none;border-color:rgba(255,255,255,.4)}
.si::placeholder{color:var(--mut2)}
.ulbl{font-size:.47rem;color:var(--mut);text-align:center;font-weight:700}
.sb-check{width:18px;height:18px;border-radius:50%;background:var(--grn);
  display:flex;align-items:center;justify-content:center;margin:2px auto 0;
  animation:popIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shimmerPulse{0%,100%{box-shadow:0 0 30px rgba(255,255,255,.1),0 0 60px rgba(255,255,255,.05)}50%{box-shadow:0 0 50px rgba(255,255,255,.2),0 0 100px rgba(255,255,255,.1)}}
.pr-badge{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:var(--gold);
  border-radius:8px;font-size:.52rem;font-weight:800;padding:2px 6px;text-align:center;margin-top:3px}

/* TIMER */
.timer-bar{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.timer-ring{position:relative;width:52px;height:52px;flex-shrink:0}
.timer-ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer-ring-track{fill:none;stroke:var(--bdr);stroke-width:3}
.timer-ring-fill{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:900;color:var(--acc)}
.timer-info{flex:1}.timer-title{font-size:.82rem;font-weight:800;margin-bottom:2px}
.timer-sub{font-size:.65rem;color:var(--mut);font-weight:600}

    return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchmove",tm);el.removeEventListener("touchend",te);};
  },[prevExData]);
  const [swipeDx,setSwipeDx]=useState(0);

  const [showEdit,setShowEdit]=useState(false);
  const progression = React.useMemo(()=>calcProgression(allDays, ex.id, overrides, si, ei),[allDays, ex.id, si, ei]);
  const [showProg,setShowProg] = useState(true);
  const [localBW,setLocalBW]=useState(!!overrides.bodyweight);

  React.useEffect(()=>{ setLocalBW(!!overrides.bodyweight); },[overrides.bodyweight]);
  const isBW = localBW;
  const effSets=overrides.sets??ex.sets, effReps=overrides.reps??ex.reps;
  const isUserAdded=ex.id?.startsWith("cx_");
  const allDone=Array.from({length:effSets},(_,i)=>{const s=exData[i]??{};return isBW?!!(s.r&&parseFloat(s.r)>0):!!(s.r&&parseFloat(s.r)>0);}).every(Boolean);


  function handleChange(i,f,v) {
    const updated={...exData,[i]:{...exData[i],[f]:v}};
    onUpdate(updated);
    const s=updated[i];
    const bw=isBW;
    const done=bw?!!(s.r&&parseFloat(s.r)>0):!!(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0);
    if(done) onSetComplete(ex.id,parseFloat(s.w)||parseFloat(s.r)||0);
    // Check if ALL sets are now done
    const allNowDone=Array.from({length:effSets},(_,j)=>{
      const sd=updated[j]??{};
      return bw?!!(sd.r&&parseFloat(sd.r)>0):!!(sd.r&&parseFloat(sd.r)>0);
    }).every(Boolean);
    if(allNowDone) onSetComplete(ex.id, parseFloat(s.w)||parseFloat(s.r)||0);
  }

  return (
    <>

      {showFillConfirm&&(
        <div style={{position:"fixed",inset:0,zIndex:900,
          background:"rgba(0,0,0,.75)",backdropFilter:"blur(20px)",
          WebkitBackdropFilter:"blur(20px)",
          display:"flex",alignItems:"center",justifyContent:"center",
          animation:"bgFadeIn .2s ease both"}}>
          <div style={{background:"rgba(14,11,22,.97)",borderRadius:28,
            padding:"28px 24px",width:"calc(100% - 48px)",maxWidth:320,
            animation:"popIn .35s cubic-bezier(.34,1.3,.64,1) both",
            boxShadow:"0 20px 60px rgba(0,0,0,.8)"}}>
            <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
              fontSize:".95rem",marginBottom:6}}>{ex.name}</div>
            <div style={{fontSize:".7rem",color:"var(--mut)",fontWeight:600,marginBottom:20}}>
              Letzte Werte einfügen?
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <button onClick={()=>{
                setShowFillConfirm(false);
                const prevSets=Object.values(prevExData||{});
                const effSets=overrides.sets||ex.sets||3;
                const newData={...exData};
                for(let i=0;i<effSets;i++){
                  const s=exData[i]??{};
                  if(!s.done){
                    const prevSet=prevSets[i]||prevSets[0];
                    if(prevSet?.w||prevSet?.r){
                      newData[i]={...s};
                      if(prevSet.w) newData[i].w=String(prevSet.w);
                      if(prevSet.r) newData[i].r=String(prevSet.r);
                    }
                  }
                }
                onUpdate(newData);
              }} style={{padding:"14px",borderRadius:14,cursor:"pointer",border:"none",
                background:"var(--acc)",fontFamily:"'Montserrat',sans-serif",
                fontSize:".82rem",fontWeight:900,color:"var(--acc-txt,#080a0f)"}}>

              <button onClick={()=>setShowFillConfirm(false)}
                style={{padding:"12px",borderRadius:14,cursor:"pointer",
                  background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",
                  fontFamily:"'Nunito',sans-serif",fontSize:".78rem",
                  fontWeight:700,color:"var(--mut)"}}>
                Abbrechen
              </button>
            </div>
          </div>
        </div>
      )}
      {showHistory&&<ExerciseHistory exName={ex.name} exId={ex.id} si={si} ei={ei} allDays={allDays} onClose={()=>setShowHistory(false)}/>}
      {showProg&&progression&&!allDone&&(
        <div style={{marginBottom:6,borderRadius:14,overflow:"hidden",
          border:"1px solid rgba(255,255,255,.1)",
          animation:"flowIn .3s ease both"}}>
          <div style={{padding:"10px 14px",
            background:"rgba(255,255,255,.04)",
            display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                <div style={{fontSize:".52rem",color:"var(--mut)",fontWeight:800,
                  letterSpacing:"1.5px"}}>VORSCHLAG</div>
                <div style={{fontSize:".52rem",color:"rgba(255,255,255,.3)",fontWeight:700}}>·</div>
                <div style={{fontSize:".6rem",color:"rgba(255,255,255,.5)",fontWeight:700,
                  fontFamily:"'Nunito',sans-serif",
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:140}}>
                  {ex.name}
                </div>
              </div>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".8rem",
                fontWeight:900,color:"var(--acc)"}}>
                {progression.weight>0?`${progression.weight}kg · `:""}
                {progression.reps} Wdh
              </div>
              <div style={{fontSize:".55rem",color:"var(--mut)",fontWeight:600,marginTop:2}}>
                {progression.reason}
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
              <button onClick={()=>{
                const effSets=overrides.sets||ex.sets||3;
                const newData={};
                for(let i=0;i<effSets;i++){
                  newData[i]={...exData[i],w:String(progression.weight),r:String(progression.reps)};
                }
                onUpdate(newData);
                setShowProg(false);
              }} style={{background:"var(--acc)",border:"none",borderRadius:10,
                padding:"7px 14px",cursor:"pointer",
                fontFamily:"'Montserrat',sans-serif",fontSize:".62rem",
                fontWeight:900,color:"var(--acc-txt,#080a0f)",letterSpacing:".5px",
                whiteSpace:"nowrap"}}>
                Übernehmen
              </button>
              <button onClick={()=>setShowProg(false)}
                style={{background:"none",border:"none",color:"var(--mut)",
                  cursor:"pointer",fontSize:".8rem",padding:"4px",lineHeight:1}}>
                ✕
              </button>
            </div>
          </div>
        </div>
      )}
      <div style={{position:"relative",overflow:"visible"}}>
        <div ref={hintRef} style={{display:"none",position:"absolute",inset:0,
          borderRadius:16,background:"rgba(125,211,252,.08)",
          alignItems:"center",justifyContent:"flex-end",
          paddingRight:20,pointerEvents:"none"}}>
          <span style={{fontFamily:"'Montserrat',sans-serif",fontSize:".62rem",
            fontWeight:900,letterSpacing:"1px",color:"var(--acc)"}}>
            EINFÜGEN
          </span>
        </div>
      <div ref={cardRef} className={`excard${allDone?" all-done":""}`}
        onTouchStart={e=>{swipeStartX.current=e.touches[0].clientX;setSwipeDx(0);}}
        onTouchMove={e=>{
          if(!swipeStartX.current) return;
          const dx=e.touches[0].clientX-swipeStartX.current;
          if(dx<0) setSwipeDx(Math.max(dx,-120));
        }}
        onTouchEnd={e=>{
          if(!swipeStartX.current) return;
          const dx=e.changedTouches[0].clientX-swipeStartX.current;
          swipeStartX.current=null;
          setSwipeDx(0);
          if(dx<-55){
            const prevSets=Object.values(prevExData||{});
            if(prevSets.length>0) setShowFillConfirm(true);
          }
        }}
        style={focusMode?{
          position:"relative",
          border:"1px solid rgba(125,211,252,.35)",
          boxShadow:"0 0 0 1px rgba(125,211,252,.1), 0 0 16px rgba(125,211,252,.12), inset 0 0 20px rgba(125,211,252,.04)",
          background:"linear-gradient(120deg,rgba(99,179,237,.08),rgba(147,220,255,.12),rgba(99,179,237,.08))",
          backgroundSize:"300% 300%",
          animation:"focusLavaFlow 8s ease-in-out infinite",
          transform:`translateX(${swipeDx}px)`,
          transition:swipeDx===0?"transform .35s cubic-bezier(.34,1.2,.64,1)":"none"
        }:{position:"relative",transform:`translateX(${swipeDx}px)`,transition:swipeDx===0?"transform .35s cubic-bezier(.34,1.2,.64,1)":"none"}}>

        <div className="exhdr">
          <div className="exname" style={{cursor:"pointer",position:"relative"}}
          onClick={()=>setShowHistory(true)}>{ex.name}
        </div>
          <div className="exhdr-right">
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:1}}>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".75rem",
                fontWeight:900,color:"var(--acc)"}}>
                {effSets} <span style={{fontWeight:600,opacity:.6,fontSize:".65rem"}}>Sätze</span>
              </div>
              <div style={{fontSize:".62rem",fontWeight:700,color:"var(--mut)"}}>
                {effReps} <span style={{opacity:.7}}>Wdh</span>
                {(overrides.sets||overrides.reps)&&<span style={{marginLeft:3,fontSize:".55rem",opacity:.5}}>●</span>}
              </div>
            </div>

            <button className="icon-btn" onClick={()=>setShowEdit(true)}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            {isUserAdded&&<button className="icon-btn del" onClick={onDelete}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4h6v2"/></svg></button>}
          </div>
        </div>
        {/* Bodyweight toggle */}
        <div style={{padding:"0 14px 8px",display:"flex",alignItems:"center",gap:"8px"}}>
          <button onClick={()=>{ const newBW=!isBW; setLocalBW(newBW); onEditSave({...overrides,bodyweight:newBW});
              // Re-trigger completion check for all sets that have reps
              if(newBW) {
                Object.entries(exData).forEach(([i,s])=>{
                  if(s?.r&&parseFloat(s.r)>0) onSetComplete(ex.id, parseFloat(s.w)||parseFloat(s.r)||0);
                });
              } }}
            style={{display:"flex",alignItems:"center",gap:"6px",
              background:isBW?"rgba(var(--acc-rgb,255,255,255),.12)":"rgba(255,255,255,.04)",
              border:isBW?"1.5px solid var(--acc)":"1.5px solid rgba(255,255,255,.1)",
              borderRadius:20,padding:"5px 12px 5px 8px",cursor:"pointer",transition:"all .2s",
              fontFamily:"'Nunito',sans-serif",fontSize:".62rem",fontWeight:800,
              color:isBW?"var(--acc)":"var(--mut)",letterSpacing:".3px"}}>
            <div style={{width:16,height:16,borderRadius:"50%",
              background:isBW?"var(--acc)":"rgba(255,255,255,.1)",
              display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s",flexShrink:0}}>
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
                stroke={isBW?"#080a0f":"rgba(255,255,255,.4)"}
                strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="5" r="3"/>
                <path d="M6.5 8a6 6 0 0 0-1 3.5C5.5 15 8 18 12 20c4-2 6.5-5 6.5-8.5A6 6 0 0 0 17.5 8"/>
              </svg>
            </div>
            Körpergewicht
          </button>
          {isBW&&<span style={{fontSize:".58rem",color:"var(--mut)",fontWeight:600}}>Nur Wdh. nötig · Zusatzgewicht optional</span>}
        </div>

        {/* Last session button */}
        {(()=>{
          const prevSets = Object.entries(prevExData||{}).filter(([,s])=>s?.r&&parseFloat(s.r)>0);
          if(prevSets.length===0) return null;
          return <PrevSessionBtn prevSets={prevSets} exName={ex.name||ex.label||"Übung"} onFillSet={(setIdx,w,r)=>{
            // Build one update to avoid stale state overwrites
            const current = {...(exData[setIdx]||{})};
            if(w!==null&&w>0) current.w=String(w);
            if(r!==null&&r>0) current.r=String(r);
            onUpdate({...exData,[setIdx]:current});
          }}
          onFillAll={(sets,wOnly)=>{
            let updated={...exData};
            sets.forEach(([i,s])=>{
              const si=parseInt(i);
              const w=parseFloat(s.w)||0;
              const r=parseFloat(s.r)||0;
              updated[si]={...(updated[si]||{})};
              if(!wOnly&&r>0) updated[si].r=String(r);
              if(w>0) updated[si].w=String(w);
            });
            onUpdate(updated);
          }}/>;
        })()}
        <div className="sgrid">
          {Array.from({length:effSets},(_,i)=>{
            const s=exData[i]??{};
            const w=parseFloat(s.w)||0;
            const isPR=w>0&&prs[ex.id]===w;
            const prevSets=Object.values(prevExData||{});
            const prevSet=prevSets[i]||prevSets[0];
            const pw=prevSet?.w?parseFloat(prevSet.w):null;
            const pr=prevSet?.r?parseFloat(prevSet.r):null;
            return <SetBlock key={i} idx={i} data={s} isPR={isPR} bodyweight={isBW}
              prevWeight={pw} prevReps={pr}
              onChange={(f,v)=>handleChange(i,f,v)}
              onComplete={()=>onSetComplete(ex.id,parseFloat(s.w)||0)}/>;
          })}
        </div>
      </div>
      </div>
      {showEdit&&<EditModal ex={ex} overrides={overrides} onSave={v=>{onEditSave(v);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </>
  );
}

function TrainingPage({planIdx, dayData={}, customExercises={}, onUpdate, onUpdateCustom, onChangeType, prs, onNewPR, timerDuration=90, allDays={}, currentDk=''}) {
  const [activeSec,setActiveSec]=useState(0);
  const [showTimer,setShowTimer]=useState(false);
  const [paused,setPaused]=useState(false);
  const [showPauseMenu,setShowPauseMenu]=useState(false);
  const pausedAt=React.useRef(null);
  const [wSecs, setWSecs] = React.useState(()=>{
    try{
      const saved=localStorage.getItem('workout_start');
      if(saved) return Math.floor((Date.now()-parseInt(saved))/1000);
    }catch(e){}
    return 0;
  });
  const [timerRunning, setTimerRunning] = React.useState(true);
  React.useEffect(()=>{
    if(!timerRunning) return;
    const iv=setInterval(()=>{
      const saved=localStorage.getItem('workout_start');
      if(saved) setWSecs(Math.floor((Date.now()-parseInt(saved))/1000));
    },500);
    return()=>clearInterval(iv);
  },[timerRunning]);

  const [addingToSection,setAddingToSection]=useState(null);
  const [showConfetti,setShowConfetti]=useState(false);
  const prevDoneRef=useRef(0);
  const confettiShownRef=useRef(false); // only show once per session
  const tab=DEFAULT_PLAN[planIdx];
  const planType=planIdx===0?"A":"B";
  // Find most recent previous session with same plan type
  const prevSessionData = Object.entries(allDays)
    .filter(([dk,di])=>dk<currentDk&&di?.type===planType)
    .sort(([a],[b])=>b.localeCompare(a))[0]?.[1] ?? null;
  const overrides=dayData?.overrides??{};
  let total=0,done=0;
  tab.sections.forEach((s,si)=>{const allEx=[...s.exercises,...(customExercises[`${planIdx}_${si}`]??[])];allEx.forEach((ex,ei)=>{const ov=overrides[`${si}_${ei}`]??{},effSets=ov.sets??ex.sets;total+=effSets;const ed=dayData?.sections?.[si]?.[ei]??{};const isBWov=!!ov?.bodyweight;for(let i=0;i<effSets;i++){const sd=ed[i]??{};const setOk=isBWov?!!(sd.r&&parseFloat(sd.r)>0):!!(sd.r&&parseFloat(sd.r)>0);if(setOk) done++;}});});


  useEffect(()=>{
    if(total>0&&done===total&&prevDoneRef.current<total&&!confettiShownRef.current){
      confettiShownRef.current=true;
      setShowConfetti(true);
      setTimerRunning(false);
      localStorage.removeItem('workout_start');
      onUpdate({...dayData, duration: wSecs});
    }
    prevDoneRef.current=done;
  },[done,total]);
  function upEx(si,ei,val){onUpdate({...dayData,sections:{...dayData?.sections,[si]:{...dayData?.sections?.[si],[ei]:val}}});}
  function saveOverride(si,ei,val){const k=`${si}_${ei}`,newOv={...overrides};if(!val.sets&&!val.reps&&!val.bodyweight) delete newOv[k]; else newOv[k]=val;onUpdate({...dayData,overrides:newOv});}
  function handleSetComplete(exId,weight){
    setShowTimer(true);
    if(weight>0) onNewPR(exId,weight);
    try{if(!localStorage.getItem('workout_start'))localStorage.setItem('workout_start',String(Date.now()));}catch(e){}
  }
  function handlePause(){
    setPaused(true);
    setShowPauseMenu(true);
    try{pausedAt.current=Date.now();}catch(e){}
  }
  function handleResume(){
    if(pausedAt.current){
      try{
        const saved=localStorage.getItem('workout_start');
        if(saved){
          const elapsed=Date.now()-pausedAt.current;
          localStorage.setItem('workout_start',String(parseInt(saved)+elapsed));
        }
      }catch(e){}
    }
    setPaused(false);
    setShowPauseMenu(false);
    pausedAt.current=null;
  }
  function handleAbort(){
    try{localStorage.removeItem('workout_start');}catch(e){}
    setShowPauseMenu(false);
    setPaused(false);
    onChangeType();
  }
  function addCustomEx(si,ex){const key=`${planIdx}_${si}`,prev=customExercises[key]??[];onUpdateCustom({...customExercises,[key]:[...prev,ex]});setAddingToSection(null);}
  function deleteCustomEx(si,idx){const key=`${planIdx}_${si}`,prev=[...(customExercises[key]??[])];onUpdateCustom({...customExercises,[key]:prev.filter((_,i)=>i!==idx)});}

  return (
    <div className="page">
      {showConfetti&&<Confetti onDone={()=>setShowConfetti(false)}/>}
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",
          gap:6,padding:"6px 14px",marginBottom:8,
          background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.06)",
          borderRadius:20,width:"fit-content",margin:"0 auto 8px"}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--acc)"
            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/>
          </svg>
          <span style={{fontFamily:"'Montserrat',sans-serif",fontSize:".8rem",
            fontWeight:900,color:"var(--acc)",letterSpacing:"1px"}}>
            {formatTime(wSecs)}
          </span>
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:4}}>
        <button onClick={handlePause}
          style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",
            borderRadius:20,padding:"5px 14px",cursor:"pointer",
            display:"flex",alignItems:"center",gap:6,
            fontFamily:"'Montserrat',sans-serif",fontSize:".55rem",fontWeight:900,
            color:"var(--mut)",letterSpacing:"1px"}}>
          <svg width="8" height="10" viewBox="0 0 8 10" fill="currentColor">
            <rect x="0" y="0" width="2.5" height="10" rx="1"/>
            <rect x="5" y="0" width="2.5" height="10" rx="1"/>
          </svg>
          PAUSE
        </button>
      </div>

      {/* Pause Menu */}
      {showPauseMenu&&(
        <div style={{position:"fixed",inset:0,zIndex:900,
          background:"rgba(0,0,0,.75)",backdropFilter:"blur(20px)",
          WebkitBackdropFilter:"blur(20px)",animation:"bgFadeIn .2s ease both",
          display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"rgba(14,11,22,.97)",borderRadius:28,
            padding:"32px 24px",width:"calc(100% - 48px)",maxWidth:320,
            animation:"popIn .35s cubic-bezier(.34,1.3,.64,1) both",
            boxShadow:"0 20px 60px rgba(0,0,0,.8)"}}>
            <div style={{textAlign:"center",marginBottom:28}}>
              <div style={{fontSize:"2.5rem",marginBottom:8}}>⏸</div>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.2rem",
                fontWeight:900,marginBottom:4}}>Pause</div>
              <div style={{fontSize:".7rem",color:"var(--mut)",fontWeight:600}}>
                {formatTime(wSecs)} trainiert
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button onClick={handleResume}
                style={{padding:"16px",borderRadius:16,cursor:"pointer",border:"none",
                  background:"var(--acc)",fontFamily:"'Montserrat',sans-serif",
                  fontSize:".85rem",fontWeight:900,letterSpacing:"1px",
                  color:"var(--acc-txt,#080a0f)"}}>
                Weitermachen
              </button>
              <button onClick={handleAbort}
                style={{padding:"14px",borderRadius:16,cursor:"pointer",
                  background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",
                  fontFamily:"'Montserrat',sans-serif",fontSize:".8rem",
                  fontWeight:900,color:"#ef4444",letterSpacing:".5px"}}>
                Training abbrechen
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="statsbar" style={{animation:"flowIn .4s ease both"}}>
        <div className="stat">
          <div className="sv" style={{fontFamily:"'Montserrat',sans-serif",color:"var(--grn)",fontSize:".95rem"}}>
            {String(Math.floor(wSecs/60)).padStart(2,'0')}:{String(wSecs%60).padStart(2,'0')}
          </div>
          <div className="sl">Zeit</div>
        </div>
        <div className="stat"><div className="sv"><CountUp value={done}/></div><div className="sl">Erledigt</div></div>
        <div className="stat"><div className="sv"><CountUp value={total}/></div><div className="sl">Gesamt</div></div>
        {done===total&&total>0&&(
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:"6px",
            background:"rgba(63,212,160,.1)",border:"1px solid rgba(63,212,160,.25)",
            borderRadius:"10px",padding:"5px 10px"}}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#3fd4a0" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="2,6.5 5,9.5 11,3.5"/>
            </svg>
            <span style={{fontSize:".6rem",fontWeight:800,color:"#3fd4a0",letterSpacing:"1px",textTransform:"uppercase"}}>Abgeschlossen</span>
          </div>

          const cl2=customExercises[`${planIdx}_${i}`]??[];
          const ae2=[...s.exercises,...cl2];
          let d2=0,t2=0;
          ae2.forEach((ex,ei)=>{const ov2=overrides[`${i}_${ei}`]??{};const es2=ov2.sets??ex.sets;const ed2=dayData?.sections?.[i]?.[ei]??{};t2+=es2;for(let j=0;j<es2;j++){const s2=ed2[j]??{};if(s2.r&&parseFloat(s2.r)>0)d2++;}});
          const ok2=t2>0&&d2===t2;
          return <button key={i} onClick={()=>setActiveSec(i)} style={{padding:"7px 16px",borderRadius:20,border:"none",cursor:"pointer",background:activeSec===i?"var(--acc)":ok2?"rgba(63,212,160,.15)":"rgba(255,255,255,.06)",color:activeSec===i?"var(--acc-txt,#080a0f)":ok2?"#3fd4a0":"var(--mut)",fontSize:".62rem",fontWeight:800,letterSpacing:".5px",textTransform:"uppercase",fontFamily:"'Nunito',sans-serif",transition:"all .2s"}}>{ok2?"✓ ":""}{s.label}</button>;
        })}
      </div>
      {tab.sections.map((sec,si)=>{
        if(si!==activeSec) return null;
        const customList=customExercises[`${planIdx}_${si}`]??[];
        const allEx=[...sec.exercises,...customList];
        return (
          <div key={si} style={{animation:"fadeSlideUp .25s ease both"}}>
            <div className="seclbl">{sec.label}<button className="add-ex-btn" onClick={()=>setAddingToSection(si)}>+ Ubung</button></div>
            {allEx.map((ex,ei)=><ExCard key={ex.id||ei} ex={ex} exData={dayData?.sections?.[si]?.[ei]??{}} overrides={overrides[`${si}_${ei}`]??{}} prs={prs} prevExData={prevSessionData?.sections?.[si]?.[ei]??{}} focusMode={focusMode} onUpdate={v=>upEx(si,ei,v)} onEditSave={v=>saveOverride(si,ei,v)} onDelete={()=>deleteCustomEx(si,ei-sec.exercises.length)} onSetComplete={handleSetComplete} onNewPR={onNewPR}/>)}
            {activeSec<tab.sections.length-1&&<button onClick={()=>setActiveSec(activeSec+1)} style={{width:"100%",background:"rgba(255,255,255,.04)",border:"1.5px solid rgba(255,255,255,.08)",borderRadius:16,padding:"13px",cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",fontSize:".78rem",fontWeight:800,marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>Weiter: {tab.sections[activeSec+1].label} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><polyline points="12,5 19,12 12,19"/></svg></button>}
          </div>
        );
      })}
      <textarea className="notes" placeholder="Notizen zum Training..." value={dayData?.notes??""} onChange={e=>onUpdate({...dayData,notes:e.target.value})}/>
      </div>
  );
}

function CalendarView({allDays, selectedDate, onSelectDate, customPlans=[], onDeleteDay}) {
  const [viewDate,setViewDate]=useState(new Date(selectedDate));
  const [popup,setPopup]=useState(null);
  const [popupDetail,setPopupDetail]=useState(null);
  const [confirmDay,setConfirmDay]=useState(null);

  const year=viewDate.getFullYear(),month=viewDate.getMonth();
  let startOffset=new Date(year,month,1).getDay()-1;
  if(startOffset<0) startOffset=6;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayKey=dateKey(today()),selKey=dateKey(selectedDate);
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(year,month,d));

  function getPlanColor(type) {
    if(!type||type==="rest") return null;
    if(type==="A") return "#7dd3fc";
    if(type==="B") return "#86efac";
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.color||"#a78bfa";
    return "#e8ff47";
  }
  function getPlanName(type) {
    if(type==="rest") return "💤 Ruhetag";
    if(type==="A") return "Tag A – Brust & Rücken";
    if(type==="B") return "Tag B – Schulter & Arme";
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.name||"Eigener Plan";
    return type;
  }
  function getSessionStats(di, planType) {
    let done=0, total=0, vol=0;
    // Get plan definition to know exact sets per exercise
    let planSections = null;
    if(planType==="A") planSections = DEFAULT_PLAN[0].sections;
    else if(planType==="B") planSections = DEFAULT_PLAN[1].sections;
    else if(planType?.startsWith("custom_")) {
      const cp = customPlans.find(p=>"custom_"+p.id===planType);
      planSections = cp?.sections || null;
    }

    if(planSections && di?.sections) {
      planSections.forEach((sec, si) => {
        sec.exercises.forEach((ex, ei) => {
          const ov = di.overrides?.[`${si}_${ei}`];
          const effSets = ov?.sets ?? ex.sets;
          const exData = di.sections?.[si]?.[ei] ?? {};
          total += effSets;
          for(let i=0; i<effSets; i++) {
            const s = exData[i] ?? {};
            const isBW = !!ov?.bodyweight;
            const setDone = isBW?!!(s.r&&parseFloat(s.r)>0):!!(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0);
            if(setDone) {
              done++;
              vol += (parseFloat(s.w)||0) * (parseFloat(s.r)||0);
            }
          }
        });
      });
    } else if(di?.sections) {
      // Fallback: count from data
      Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>{
        Object.values(ex).forEach(s=>{
          if(typeof s==="object"&&s.w!==undefined){
            total++;
            if(s.r&&parseFloat(s.r)>0){const sw=parseFloat(s.w)||0;const sr=parseFloat(s.r)||0;done++;vol+=sw*sr;}
          }
        });
      }));
    }
    return {done, total, vol:Math.round(vol)};
  }

  const pressTimer = React.useRef(null);
  function onTouchStart(dk,di,e) { pressTimer.current=setTimeout(()=>{if(di?.type) setPopup({dk,di});},450); }
  function onTouchEnd() { clearTimeout(pressTimer.current); }

  function handleDayTap(date, dk, di) {
    if(di?.type) {
      // Day has a plan — go directly
      onSelectDate(date);
    } else {
      // Empty day — ask if they want to plan it
      setConfirmDay({date, dk});
    }
  }

  return (
    <div className="cal-wrap" onClick={()=>{setPopup(null);setConfirmDay(null);}}>
      {popupDetail&&(
        <div style={{position:"fixed",inset:0,zIndex:450,background:"var(--bg)",overflowY:"auto",padding:"16px 16px 100px"}} onClick={e=>e.stopPropagation()}>
          <TrainingDetailView dk={popupDetail.dk} di={popupDetail.di} customPlans={customPlans} onBack={()=>setPopupDetail(null)} backLabel="Zum Kalender"/>
        </div>
      )}
      <div className="cal-header">
        <button className="cal-nav" onClick={e=>{e.stopPropagation();setViewDate(new Date(year,month-1,1));}}>{'<'}</button>
        <div className="cal-month">{MONTHS_DE[month]} {year}</div>
        <button className="cal-nav" onClick={e=>{e.stopPropagation();setViewDate(new Date(year,month+1,1));}}>{'>'}</button>
      </div>
      <div className="cal-grid">
        {DAYS_DE.map(d=><div key={d} className="cal-day-lbl">{d}</div>)}
        {cells.map((date,i)=>{
          if(!date) return <div key={"e"+i} className="cal-day empty"/>;
          const dk=dateKey(date),di=allDays[dk];
          const planColor=getPlanColor(di?.type);
          const isToday=dk===todayKey,isSel=dk===selKey;
          const isRest=di?.type==="rest";
          const stats=di?getSessionStats(di,di?.type):null;
          const progress=stats?.total>0?stats.done/stats.total:0;
          return (
            <div key={dk}
              className={`cal-day${isToday?" today":""}${isSel?" selected":""}`}
              style={planColor&&!isSel?{border:`2px solid ${planColor}66`,background:`${planColor}12`}
                :isRest&&!isSel?{border:"1.5px solid rgba(255,255,255,.08)",background:"rgba(255,255,255,.03)"}:{}}
              onClick={e=>{e.stopPropagation();setPopup(null);handleDayTap(date,dk,di);}}
              onTouchStart={e=>onTouchStart(dk,di,e)}
              onTouchEnd={onTouchEnd}
              onTouchMove={onTouchEnd}
              onContextMenu={e=>{e.preventDefault();if(di?.type) setPopup({dk,di});}}>
              <div className="cal-dn" style={planColor&&!isSel?{color:planColor}:isRest&&!isSel?{color:"var(--mut)"}:{}}>{date.getDate()}</div>
              {planColor&&stats?.done>0&&(
                <div style={{width:"60%",height:3,borderRadius:2,background:`${planColor}44`,overflow:"hidden",marginTop:1}}>
                  <div style={{height:"100%",width:(progress*100)+"%",background:isSel?"rgba(0,0,0,.4)":planColor,borderRadius:2}}/>
                </div>
              )}
              {isRest&&<div style={{fontSize:".42rem",opacity:.45,marginTop:1}}>💤</div>}
            </div>
          );
        })}
      </div>

      {/* Confirm plan modal — shown when tapping empty day */}
      {confirmDay&&(
        <div style={{position:"fixed",inset:0,zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:"rgba(0,0,0,.6)",backdropFilter:"blur(6px)"}}
          onClick={e=>{e.stopPropagation();setConfirmDay(null);}}>
          <div style={{background:"var(--sur)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"22px",
            padding:"24px 22px",width:"100%",maxWidth:"320px",
            boxShadow:"0 24px 64px rgba(0,0,0,.7)",animation:"scaleIn .2s cubic-bezier(.34,1.56,.64,1)"}}
            onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:"center",marginBottom:"18px"}}>
              <div style={{fontSize:"2rem",marginBottom:"8px"}}>📅</div>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,letterSpacing:"1px",marginBottom:"6px"}}>
                Training planen?
              </div>
              <div style={{fontSize:".72rem",color:"var(--mut)",fontWeight:600,lineHeight:1.5}}>
                {new Date(confirmDay.dk+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
              </div>
            </div>
            <button onClick={()=>{setConfirmDay(null);onSelectDate(confirmDay.date);}}
              className="cal-confirm-btn"
              style={{width:"100%",background:"var(--acc)",color:"#080a0f",border:"none",borderRadius:"14px",
                padding:"14px",fontFamily:"'Montserrat',sans-serif",fontSize:".9rem",fontWeight:900,
                cursor:"pointer",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"10px",
                boxShadow:"0 4px 20px rgba(255,255,255,.1)"}}>
              Ja, Training planen
            </button>
            <button onClick={()=>setConfirmDay(null)}
              style={{width:"100%",background:"none",border:"1px solid rgba(255,255,255,.08)",borderRadius:"14px",
                padding:"12px",cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",

              boxShadow:`0 24px 64px rgba(0,0,0,.7),0 0 0 1px ${planColor||"#fff"}11`,
              animation:"scaleIn .2s cubic-bezier(.34,1.56,.64,1)"}}
              onClick={e=>e.stopPropagation()}>

              {/* Color banner */}
              <div style={{background:planColor?`linear-gradient(135deg,${planColor}22,${planColor}08)`:"rgba(255,255,255,.04)",
                borderBottom:`1px solid ${planColor||"#fff"}22`,padding:"22px 22px 18px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"14px"}}>
                  <div style={{width:52,height:52,borderRadius:"16px",
                    background:planColor?planColor+"28":"rgba(255,255,255,.08)",
                    border:`1.5px solid ${planColor||"rgba(255,255,255,.15)"}44`,
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.6rem",flexShrink:0}}>
                    {di?.type==="rest"?"💤":plan?.icon||"🏋️"}
                  </div>
                  <div>
                    <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.05rem",fontWeight:900,
                      color:planColor||"var(--txt)",letterSpacing:".5px"}}>
                      {getPlanName(di?.type)}
                    </div>
                    <div style={{fontSize:".7rem",color:"var(--mut)",fontWeight:600,marginTop:"3px"}}>
                      {date.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
                    </div>
                  </div>
                </div>
              </div>

              <div style={{padding:"18px 22px 22px"}}>
                              {/* Quick stats only — details via button */}
                {di?.type!=="rest"&&stats.total>0&&(
                  <div style={{display:"flex",gap:"8px",marginBottom:"16px"}}>
                    <div style={{flex:1,background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"10px 6px",textAlign:"center",border:"1px solid rgba(255,255,255,.06)"}}>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,color:planColor||"var(--acc)",lineHeight:1}}>{stats.done}/{stats.total}</div>
                      <div style={{fontSize:".52rem",color:"var(--mut)",fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",marginTop:"3px"}}>Sätze</div>
                    </div>
                    <div style={{flex:1,background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"10px 6px",textAlign:"center",border:"1px solid rgba(255,255,255,.06)"}}>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,color:planColor||"var(--acc)",lineHeight:1}}>{progress}%</div>
                      <div style={{fontSize:".52rem",color:"var(--mut)",fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",marginTop:"3px"}}>Erledigt</div>
                    </div>
                    {stats.vol>0&&<div style={{flex:1,background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"10px 6px",textAlign:"center",border:"1px solid rgba(255,255,255,.06)"}}>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,color:planColor||"var(--acc)",lineHeight:1}}>{stats.vol}kg</div>
                      <div style={{fontSize:".52rem",color:"var(--mut)",fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",marginTop:"3px"}}>Volumen</div>
                    </div>}
                  </div>
                )}
                {di?.notes&&(
                  <div style={{background:"rgba(255,255,255,.03)",borderRadius:"10px",padding:"9px 12px",
                    marginBottom:"14px",fontSize:".72rem",color:"var(--mut)",fontStyle:"italic",lineHeight:1.5,
                    border:"1px solid rgba(255,255,255,.05)"}}>
                    📝 {di.notes}
                  </div>
                )}
                {/* Actions */}
                <div style={{display:"flex",gap:"8px",marginBottom:"8px"}}>
                  <button onClick={()=>{setPopup(null);onSelectDate(date);}}
                    style={{flex:1,background:planColor||"var(--acc)",color:"#080a0f",border:"none",
                      borderRadius:"12px",padding:"13px",fontFamily:"'Montserrat',sans-serif",
                      fontSize:".85rem",fontWeight:900,cursor:"pointer",letterSpacing:"1px",textTransform:"uppercase"}}>
                    Öffnen

                  <button onClick={()=>{setPopupDetail({dk,di});setPopup(null);}}
                    style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",
                      borderRadius:"12px",padding:"13px 14px",cursor:"pointer",color:"var(--acc3)",
                      fontFamily:"'Nunito',sans-serif",fontSize:".72rem",fontWeight:800}}>
                    Details
                  </button>
                  <button onClick={()=>setPopup(null)}
                    style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",
                      borderRadius:"12px",padding:"13px 16px",cursor:"pointer",color:"var(--mut)",
                      fontFamily:"'Nunito',sans-serif",fontSize:".8rem",fontWeight:700}}>

                </div>
                {/* Delete */}

                  <div style={{background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.2)",
                    borderRadius:"12px",padding:"12px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <div style={{flex:1,fontSize:".72rem",color:"var(--red)",fontWeight:700}}>Training wirklich löschen?</div>
                    <button onClick={()=>{onDeleteDay(dk);setPopup(null);setConfirmDeleteDay(null);}}
                      style={{background:"var(--red)",color:"#fff",border:"none",borderRadius:"8px",
                        padding:"7px 12px",cursor:"pointer",fontFamily:"'Montserrat',sans-serif",
                        fontSize:".72rem",fontWeight:800,letterSpacing:".5px"}}>JA</button>
                    <button onClick={()=>setConfirmDeleteDay(null)}
                      style={{background:"none",border:"1px solid rgba(255,255,255,.1)",borderRadius:"8px",
                        padding:"7px 10px",cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",
                        fontSize:".72rem",fontWeight:700}}>Nein</button>
                  </div>
                ):(
