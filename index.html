function MuscleMapPage({allDays, customPlans=[]}) {
  const weekStart = (()=>{
    const d=new Date(); const day=d.getDay();
    d.setDate(d.getDate()-(day===0?6:day-1)); d.setHours(0,0,0,0); return d;
  })();
  const weekKey = weekStart.toISOString().slice(0,10);

  const muscleSets = {};
  const muscleExercises = {};
  Object.entries(MUSCLE_GROUPS).forEach(([k])=>{ muscleSets[k]=0; muscleExercises[k]=new Set(); });

  Object.entries(allDays).filter(([dk])=>dk>=weekKey).forEach(([,di])=>{
    if(!di?.sections) return;
    if(di.type?.startsWith("custom_")) {
      const plan=customPlans.find(p=>"custom_"+p.id===di.type);
      plan?.sections?.forEach((sec,si)=>sec.exercises?.forEach((ex,ei)=>{
        const sets=Object.values(di.sections?.[si]?.[ei]||{}).filter(s=>s?.r&&parseFloat(s.r)>0);
        if(sets.length>0) getMuscleGroups(ex.name).forEach(mg=>{
          muscleSets[mg]+=sets.length; muscleExercises[mg].add(ex.name);
        });
      }));
    } else {
      DEFAULT_PLAN.forEach((tab,ti)=>tab.sections.forEach((sec,si)=>sec.exercises.forEach((ex,ei)=>{
        const sets=Object.values(di.sections?.[si]?.[ei]||{}).filter(s=>s?.r&&parseFloat(s.r)>0);
        if(sets.length>0) getMuscleGroups(ex.name).forEach(mg=>{
          muscleSets[mg]+=sets.length; muscleExercises[mg].add(ex.name);
        });
      })));
    }
  });

  const maxSets=Math.max(...Object.values(muscleSets),1);
  const trained=Object.entries(muscleSets).filter(([,v])=>v>0);

  return (
    <div style={{paddingTop:8}}>
      {trained.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:"2.5rem",marginBottom:12}}>💪</div>
          <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".9rem",
            fontWeight:900,color:"var(--mut)",letterSpacing:"1px"}}>
            DIESE WOCHE NOCH NICHTS
          </div>
          <div style={{fontSize:".7rem",color:"var(--mut)",marginTop:6,fontWeight:600}}>
            Starte ein Training um deine Muskeln zu tracken
          </div>
        </div>
      ):(
        <>
          {/* Top trained - big cards */}
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            {trained.sort((a,b)=>b[1]-a[1]).slice(0,3).map(([key,sets],i)=>(
              <div key={key} style={{flex:1,padding:"14px 10px",borderRadius:18,
                textAlign:"center",
                background:`linear-gradient(135deg,${MUSCLE_GROUPS[key].color}22,${MUSCLE_GROUPS[key].color}08)`,
                border:`1.5px solid ${MUSCLE_GROUPS[key].color}33`,
                animation:`flowIn .4s ${i*.08}s ease both`}}>
                <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.6rem",
                  fontWeight:900,color:MUSCLE_GROUPS[key].color,lineHeight:1}}>{sets}</div>
                <div style={{fontSize:".5rem",color:"var(--mut)",fontWeight:800,
                  letterSpacing:"1px",textTransform:"uppercase",marginTop:4}}>
                  {MUSCLE_GROUPS[key].label}
                </div>
                <div style={{fontSize:".52rem",color:MUSCLE_GROUPS[key].color,
                  fontWeight:600,marginTop:2,opacity:.7}}>Sätze</div>
              </div>
            ))}
          </div>

          {/* All groups as bars */}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {Object.entries(MUSCLE_GROUPS).map(([key,{label,color}],i)=>{
              const sets=muscleSets[key]||0;
              const exNames=[...(muscleExercises[key]||new Set())];
              const pct=sets/maxSets;
              return (
                <div key={key} style={{

                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:sets>0?8:0}}>

function Login({onLogin}) {
  const [mode,setMode]=useState("login");
  const [username,setUsername]=useState("");
  const [pin,setPin]=useState("");
  const [pin2,setPin2]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  async function submit() {
    const u=username.trim().toLowerCase();
    if(!u||!pin){setErr("Bitte alle Felder ausfullen.");return;}
    setBusy(true);setErr("");setOk("");
    if(mode==="register"){
      if(pin.length<4){setErr("PIN mind. 4 Zeichen.");setBusy(false);return;}
      if(pin!==pin2){setErr("PINs stimmen nicht uberein.");setBusy(false);return;}
      const exists=await dbLoad("auth_"+u);
      if(exists){setErr("Benutzername vergeben.");setBusy(false);return;}
      const hash=await hashPin(pin);
      await dbSave("auth_"+u,{hash});
      await dbSave("days_"+u,{});
      setOk("Konto erstellt!");
      setTimeout(()=>onLogin(u,{},{},{},3,[],90),700);
    } else {
      const rec=await dbLoad("auth_"+u);
      if(!rec){setErr("Benutzer nicht gefunden.");setBusy(false);return;}
      const hash=await hashPin(pin);
      if(hash!==rec.hash){setErr("Falscher PIN.");setBusy(false);return;}
      const [days,prs,cex,wg,bw,td]=await Promise.all([
        dbLoad("days_"+u).then(v=>v??{}),
        dbLoad("prs_"+u).then(v=>v??{}),
        dbLoad("cex_"+u).then(v=>v??{}),
        dbLoad("wgoal_"+u).then(v=>v??3),
        dbLoad("bw_"+u).then(v=>v??[]),
        dbLoad("timer_"+u).then(v=>v??90),
      ]);
      onLogin(u,days,prs,cex,wg,bw,td);
    }
    setBusy(false);
  }

  return (
    <div className="lw">
      <div className="lc">
        <div className="logo" onTouchStart={()=>{if(window._eggTimer)clearTimeout(window._eggTimer);window._eggTimer=setTimeout(()=>{window._eggFire&&window._eggFire();},2000);}} onTouchEnd={()=>clearTimeout(window._eggTimer)}>GYM LOG</div>
        <div className="logo-sub">Dein Trainingsplan</div>
        <div className="ltabs">
          <button className={`ltab${mode==="login"?" on":""}`} onClick={()=>{setMode("login");setErr("");}}>Login</button>
          <button className={`ltab${mode==="register"?" on":""}`} onClick={()=>{setMode("register");setErr("");}}>Registrieren</button>
        </div>
        <div className="fld"><label>Benutzername</label><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="z.B. max123" autoComplete="username" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        <div className="fld"><label>PIN</label><input value={pin} onChange={e=>setPin(e.target.value)} type="password" placeholder="Mind. 4 Zeichen" autoComplete={mode==="login"?"current-password":"new-password"} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {mode==="register"&&<div className="fld"><label>PIN bestaetigen</label><input value={pin2} onChange={e=>setPin2(e.target.value)} type="password" placeholder="PIN wiederholen" autoComplete="new-password" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>}
        {err&&<div className="merr">{err}</div>}
        {ok&&<div className="mok">{ok}</div>}
        <button className="pbtn" disabled={busy} onClick={submit}>{busy?"...":mode==="login"?"EINLOGGEN":"REGISTRIEREN"}</button>
        {mode==="login"&&<div style={{textAlign:"center"}}><span onClick={async()=>{
          const u=username.trim().toLowerCase();
          if(!u){setErr("Bitte zuerst Benutzernamen eingeben.");return;}
          const rec=await dbLoad("auth_"+u);
          if(!rec){setErr("Benutzer nicht gefunden.");return;}
          setErr("");
          const newPin=Math.floor(1000+Math.random()*9000).toString();
          const hash=await hashPin(newPin);
          await dbSave("auth_"+u,{hash});
          setOk("Neuer PIN: "+newPin+" — bitte merken!");
        }} style={{background:"none",border:"none",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",
          fontSize:".75rem",fontWeight:700,cursor:"pointer",marginTop:"4px",textDecoration:"underline"}}>
          PIN vergessen?
        </span></div>}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {error:null}; }
  componentDidCatch(error, info) {
    console.error("REACT ERROR:", error.message, error.stack);
    console.error("COMPONENT:", info.componentStack);
    this.setState({error: error.message + "\n" + (info.componentStack||"").slice(0,300)});
  }
  static getDerivedStateFromError(error) { return {error: error.message}; }
  render() {
    if(this.state.error) return React.createElement("div", {style:{color:"red",padding:"20px",fontFamily:"monospace",fontSize:"12px",whiteSpace:"pre-wrap"}}, "ERROR: "+this.state.error);
    return this.props.children;
  }
}


function PressToStart({color="var(--acc)", onStart}) {
  const [pressing, setPressing] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const animRef = React.useRef(null);
  const startTimeRef = React.useRef(null);
  const DURATION = 600;
  const SIZE = 88;
  const R = 33;
  const circumference = 2 * Math.PI * R;

  function startPress() {
    setPressing(true);
    startTimeRef.current = Date.now();
    function animate() {
      const elapsed = Date.now() - startTimeRef.current;
      const p = Math.min(elapsed / DURATION, 1);
      setProgress(p);
      if(p < 1) { animRef.current = requestAnimationFrame(animate); }
      else { onStart(); }
    }
    animRef.current = requestAnimationFrame(animate);
  }

  function stopPress() {
    setPressing(false);
    setProgress(0);
    if(animRef.current) cancelAnimationFrame(animRef.current);
  }

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12,
      userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none"}}>
      <div
        onTouchStart={startPress} onTouchEnd={stopPress}
        onMouseDown={startPress} onMouseUp={stopPress} onMouseLeave={stopPress}
        style={{position:"relative",width:SIZE,height:SIZE,cursor:"pointer",
          userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none"}}>

        {/* Progress ring */}
        <svg width={SIZE} height={SIZE} viewBox={`0 0 ${SIZE} ${SIZE}`}
          style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}>
          <circle cx={SIZE/2} cy={SIZE/2} r={R} fill="none"
            stroke="rgba(255,255,255,.08)" strokeWidth="3"/>
          <circle cx={SIZE/2} cy={SIZE/2} r={R} fill="none"
            stroke={color} strokeWidth="3"
            strokeDasharray={circumference}
            strokeDashoffset={circumference*(1-progress)}
            strokeLinecap="round"
            style={{transition:pressing?"none":"stroke-dashoffset .3s ease",
              filter:`drop-shadow(0 0 6px ${color})`}}/>
        </svg>

        {/* Center button */}
        <div style={{position:"absolute",inset:0,display:"flex",
          alignItems:"center",justifyContent:"center",
          background:pressing?`${color}22`:"rgba(255,255,255,.05)",
          borderRadius:"50%",
          border:`1px solid ${pressing?color:"rgba(255,255,255,.1)"}`,
          transition:"background .2s,border .2s",
          boxShadow:pressing?`0 0 20px ${color}40`:"none"}}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke={pressing?color:"rgba(255,255,255,.5)"}
            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
            style={{transition:"stroke .2s"}}>
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </div>
      </div>

      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".65rem",
        fontWeight:800,letterSpacing:"1.5px",textTransform:"uppercase",
        color:pressing?"rgba(255,255,255,.7)":"rgba(255,255,255,.3)",
        transition:"color .2s",textAlign:"center",
        userSelect:"none",WebkitUserSelect:"none",
        WebkitTouchCallout:"none",pointerEvents:"none"}}>
        {pressing?"Loslassen zum Abbrechen":"Gedrückt halten zum Starten"}
      </div>
    </div>
  );
}

}


function WeekOverview({allDays, customPlans, onClose, onSelectDay}) {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow===0?6:dow-1));

  const days = Array.from({length:7},(_,i)=>{
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const dk = d.toISOString().slice(0,10);
    const di = allDays[dk];
    const isToday = dk===today.toISOString().slice(0,10);
    const isPast = d < new Date(today.toDateString());
    const dayShort = d.toLocaleDateString("de-DE",{weekday:"short"}).toUpperCase();
    const dayNum = d.getDate();
    const monthShort = d.toLocaleDateString("de-DE",{month:"short"});
    let label="", color="rgba(255,255,255,.15)", planName="", bg="transparent", icon=null;
    if(di?.type==="rest"){label="R";color="rgba(100,110,150,.7)";planName="Ruhetag";bg="rgba(100,110,150,.1)";}
    else if(di?.type==="A"){label="A";color="var(--ga)";planName="Tag A";bg="rgba(125,211,252,.1)";}
    else if(di?.type==="B"){label="B";color="var(--gb)";planName="Tag B";bg="rgba(167,139,250,.1)";}
    else if(di?.type?.startsWith("custom_")){
      const plan=customPlans.find(p=>"custom_"+p.id===di.type);
      icon=null; label=plan?.name?.[0]||"✓"; color=plan?.color||"var(--acc)";
      planName=plan?.name||""; bg=(plan?.color||"#ffffff")+"18";
    }
    const hasplan = !!di?.type;
    const canPlan = !isPast || isToday;
    return {dk,d,isToday,isPast,dayShort,dayNum,monthShort,label,color,planName,bg,icon,hasplan,canPlan};
  });

  const planned = days.filter(d=>d.hasplan).length;

  return (
    <div style={{position:"fixed",inset:0,zIndex:800,
      background:"rgba(0,0,0,.65)",backdropFilter:"blur(20px)",
      WebkitBackdropFilter:"blur(20px)",animation:"bgFadeIn .25s ease both"}}
      onClick={onClose}>
      <div style={{position:"absolute",bottom:0,left:0,right:0,
        background:"linear-gradient(0deg,rgba(12,9,20,.99),rgba(18,12,28,.98))",
        borderRadius:"28px 28px 0 0",
        boxShadow:"0 -8px 60px rgba(0,0,0,.8), 0 -1px 0 rgba(255,255,255,.06) inset",
        animation:"sheetUp .45s cubic-bezier(.34,1.2,.64,1) both"}}
        onClick={e=>e.stopPropagation()}
        onTouchStart={e=>{e.currentTarget._sy=e.touches[0].clientY;}}
        onTouchEnd={e=>{if(e.changedTouches[0].clientY-(e.currentTarget._sy||0)>60)onClose();}}>

        {/* Handle */}
        <div style={{display:"flex",justifyContent:"center",padding:"14px 0 0"}}>
          <div style={{width:40,height:4,background:"rgba(255,255,255,.12)",borderRadius:2}}/>
        </div>

        {/* Header */}
        <div style={{padding:"16px 20px 16px"}}>
          <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.5rem",
            fontWeight:900,color:"rgba(255,255,255,.9)",letterSpacing:"-0.5px",
            marginBottom:4}}>
            Diese Woche
          </div>
          <div style={{fontSize:".72rem",color:"var(--mut)",fontWeight:700,
            letterSpacing:"1.5px",marginBottom:12}}>
            {planned === 0 ? "NOCH NICHTS GEPLANT" :
             planned === 7 ? "VOLLE WOCHE" :
             `${planned} VON 7 TAGEN GEPLANT`}
          </div>
          {/* Dot indicators */}
          <div style={{display:"flex",gap:7,alignItems:"center"}}>
            {days.map((day,i)=>(
              <div key={i} style={{
                width:day.isToday?13:10,
                height:day.isToday?13:10,
                borderRadius:"50%",flexShrink:0,
                background:day.hasplan?day.color:"rgba(255,255,255,.1)",
                boxShadow:day.hasplan?`0 0 8px ${day.color}99`:"none",
                border:day.isToday?"2px solid var(--acc)":"none",
                transition:"all .3s"}}/>
            ))}
          </div>
        </div>

        <div style={{height:1,background:"rgba(255,255,255,.05)",margin:"0 20px 14px"}}/>

        {/* Day cards 5+2 (weekdays + weekend) */}
        {[days.slice(0,5), days.slice(5)].map((row,ri)=>(
          <div key={ri} style={{display:"grid",
            gridTemplateColumns:ri===0?"repeat(5,1fr)":"repeat(2,1fr)",
            gap:10,padding:`0 16px ${ri===0?"10px":"24px"}`}}>
            {row.map(({dk,d,isToday,isPast,dayShort,dayNum,monthShort,label,color,planName,bg,icon,hasplan,canPlan},i)=>(
              <div key={dk}
                onClick={canPlan?()=>{onClose();onSelectDay(d,dk);}:undefined}
                style={{
                  borderRadius:20,overflow:"hidden",
                  cursor:canPlan?"pointer":"default",
                  background:hasplan?bg:isToday?"rgba(255,255,255,.04)":"rgba(255,255,255,.02)",
                  border:`1.5px solid ${hasplan?color:isToday?"rgba(255,255,255,.2)":"rgba(255,255,255,.07)"}`,
                  boxShadow:isToday&&hasplan?`0 0 0 2px var(--acc),0 0 20px ${color}30`:
                    isToday?"0 0 0 2px var(--acc)":
                    hasplan?`0 0 14px ${color}30`:"none",
                  opacity:isPast&&!hasplan?0.25:1,
                  animation:`flowIn .4s ${(ri*4+i)*.06}s ease both`,
                  animationFillMode:"forwards",opacity:0}}>

                {/* Date header */}
                <div style={{padding:"10px 12px 8px",
                  borderBottom:`1px solid ${hasplan?color+"25":"rgba(255,255,255,.05)"}`}}>
                  <div style={{fontSize:".5rem",fontWeight:900,letterSpacing:"1px",
                    fontFamily:"'Montserrat',sans-serif",marginBottom:2,
                    color:isToday?"var(--acc)":"rgba(255,255,255,.35)"}}>
                    {dayShort}
                  </div>
                  <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
                    fontSize:"1.4rem",lineHeight:.95,
                    color:isToday?"var(--acc)":"rgba(255,255,255,.85)"}}>
                    {dayNum}
                  </div>
                  <div style={{fontSize:".44rem",color:"rgba(255,255,255,.2)",
                    fontWeight:700,marginTop:2,letterSpacing:".5px"}}>
                    {monthShort.toUpperCase()}
                  </div>
                </div>

                {/* Plan content */}
                <div style={{padding:"10px 12px 12px",minHeight:52}}>
                  {hasplan?(
                    <div>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
                        fontSize:icon?"1.1rem":".95rem",color:color,lineHeight:1,
                        marginBottom:4}}>
                        {label}
                      </div>
                      <div style={{fontSize:".58rem",fontWeight:700,
                        color:"rgba(255,255,255,.65)",fontFamily:"'Nunito',sans-serif",
                        overflow:"hidden",textOverflow:"ellipsis",
                        display:"-webkit-box",WebkitLineClamp:2,
                        WebkitBoxOrient:"vertical",lineHeight:1.3}}>
                        {planName}
                      </div>
                    </div>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",
                      alignItems:"center",justifyContent:"center",
                      height:"100%",gap:3}}>
                      {canPlan?(
                        <>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="rgba(255,255,255,.2)" strokeWidth="2" strokeLinecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                          </svg>
                          <div style={{fontSize:".48rem",color:"rgba(255,255,255,.2)",
                            fontWeight:700,letterSpacing:".5px"}}>PLANEN</div>
                        </>
                      ):(
                        <div style={{fontSize:".55rem",color:"rgba(255,255,255,.1)",
                          fontWeight:600}}>—</div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}


function App() {

  const [selectedDate,setSelectedDate]=useState(today());

    const saved=localStorage.getItem("gymlog_dark_guest");

  const [profilePic,setProfilePic]=useState(null);

  const egg = useEasterEgg();

  const [showWelcomeBanner,setShowWelcomeBanner]=useState(false);
  const [darkMode,setDarkMode]=useState(()=>{

  });
  const [view,setView]=useState("log");
  const [showPicker,setShowPicker]=useState(false);
  const [saveStatus,setSaveStatus]=useState("ok");
  const saveTimer=useRef(null);
  const swipeRef=useRef({});

  useEffect(()=>{
    const mq=window.matchMedia("(prefers-color-scheme: light)");
    function handleChange(e){
      const saved=user?localStorage.getItem("gymlog_dark_"+user):localStorage.getItem("gymlog_dark_guest");
      if(saved===null||saved===undefined) setDarkMode(!e.matches);
    }
    mq.addEventListener("change",handleChange);
    return()=>mq.removeEventListener("change",handleChange);
  },[user]);

  useEffect(()=>{
    try{
      const session=JSON.parse(localStorage.getItem("gymlog_session")||"null");
      if(session?.username){
        const u=session.username;

          setUser(u);
          setAllDays(JSON.parse(localStorage.getItem("gymlog_days_"+u)||"{}"));
          setPrs(JSON.parse(localStorage.getItem("gymlog_prs_"+u)||"{}"));
          setCustomEx(JSON.parse(localStorage.getItem("gymlog_cex_"+u)||"{}"));
          setWeekGoal(JSON.parse(localStorage.getItem("gymlog_wgoal_"+u)||"3"));
          setBodyWeights(JSON.parse(localStorage.getItem("gymlog_bw_"+u)||"[]"));

          setCustomPlans(JSON.parse(localStorage.getItem("gymlog_cplans_"+u)||"[]"));
          setHiddenDefaults(JSON.parse(localStorage.getItem("gymlog_hdef_"+u)||"[]"));
          setGymName(localStorage.getItem("gymlog_gym_"+u)||"");
          setTheme(localStorage.getItem("gymlog_theme_"+u)||"default");

          const guestDark=localStorage.getItem("gymlog_dark_guest");
          if(savedDark!==null){setDarkMode(JSON.parse(savedDark));}
          else if(guestDark!==null){setDarkMode(JSON.parse(guestDark));localStorage.setItem("gymlog_dark_"+u,guestDark);localStorage.removeItem("gymlog_dark_guest");}
          else{setDarkMode(!window.matchMedia("(prefers-color-scheme: light)").matches);}
          setStatus("app");return;
        }
      }
    }catch(e){}
    setStatus("login");
  },[]);

  function handleLogin(u,days,prData,cex,wg,bw,td){

    setUser(u);setAllDays(days);setPrs(prData);setCustomEx(cex);

  function toggleDarkMode(){const next=!darkMode;setDarkMode(next);const key=user?"gymlog_dark_"+user:"gymlog_dark_guest";localStorage.setItem(key,JSON.stringify(next));}

            <div style={{position:"absolute",width:"80vw",height:"80vw",borderRadius:"50%",

                  Später
                </button>

            </div>
          </div>

function getMuscleGroups(exName) {
  const lower = (exName||"").toLowerCase();
  return Object.entries(MUSCLE_GROUPS)
    .filter(([,{exercises}])=>exercises.some(kw=>lower.includes(kw)))
    .map(([key])=>key);
}

  chest:    {label:"Brust",      color:"#f87171", exercises:["bench","incline","chest","pec","fly","dip"]},
  back:     {label:"Rücken",     color:"#60a5fa", exercises:["row","pull","lat","deadlift","rdl","back"]},
  shoulders:{label:"Schultern",  color:"#a78bfa", exercises:["press","shoulder","lateral","front","delt","ohp"]},

  core:     {label:"Core",       color:"#e879f9", exercises:["crunch","plank","ab","core","oblique","situp"]},

function MuscleMapPage({allDays, customPlans=[]}) {
  const weekStart = (()=>{
    const d=new Date(); const day=d.getDay();
    d.setDate(d.getDate()-(day===0?6:day-1)); d.setHours(0,0,0,0); return d;
  })();
  const weekKey = weekStart.toISOString().slice(0,10);

  const muscleSets = {};
  const muscleExercises = {};
  Object.entries(MUSCLE_GROUPS).forEach(([k])=>{ muscleSets[k]=0; muscleExercises[k]=new Set(); });

  Object.entries(allDays).filter(([dk])=>dk>=weekKey).forEach(([,di])=>{
    if(!di?.sections) return;
    if(di.type?.startsWith("custom_")) {
      const plan=customPlans.find(p=>"custom_"+p.id===di.type);
      plan?.sections?.forEach((sec,si)=>sec.exercises?.forEach((ex,ei)=>{
        const sets=Object.values(di.sections?.[si]?.[ei]||{}).filter(s=>s?.r&&parseFloat(s.r)>0);
        if(sets.length>0) getMuscleGroups(ex.name).forEach(mg=>{
          muscleSets[mg]+=sets.length; muscleExercises[mg].add(ex.name);
        });
      }));
    } else {
      DEFAULT_PLAN.forEach((tab,ti)=>tab.sections.forEach((sec,si)=>sec.exercises.forEach((ex,ei)=>{
        const sets=Object.values(di.sections?.[si]?.[ei]||{}).filter(s=>s?.r&&parseFloat(s.r)>0);
        if(sets.length>0) getMuscleGroups(ex.name).forEach(mg=>{
          muscleSets[mg]+=sets.length; muscleExercises[mg].add(ex.name);
        });
      })));
    }
  });

  const maxSets=Math.max(...Object.values(muscleSets),1);
  const trained=Object.entries(muscleSets).filter(([,v])=>v>0);

  return (
    <div style={{paddingTop:8}}>
      {trained.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:"2.5rem",marginBottom:12}}>💪</div>
          <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".9rem",
            fontWeight:900,color:"var(--mut)",letterSpacing:"1px"}}>
            DIESE WOCHE NOCH NICHTS
          </div>
          <div style={{fontSize:".7rem",color:"var(--mut)",marginTop:6,fontWeight:600}}>
            Starte ein Training um deine Muskeln zu tracken
          </div>
        </div>
      ):(
        <>
          {/* Top trained - big cards */}
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            {trained.sort((a,b)=>b[1]-a[1]).slice(0,3).map(([key,sets],i)=>(

function Login({onLogin}) {
  const [mode,setMode]=useState("login");
  const [username,setUsername]=useState("");
  const [pin,setPin]=useState("");
  const [pin2,setPin2]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  async function submit() {
    const u=username.trim().toLowerCase();
    if(!u||!pin){setErr("Bitte alle Felder ausfullen.");return;}
    setBusy(true);setErr("");setOk("");
    if(mode==="register"){
      if(pin.length<4){setErr("PIN mind. 4 Zeichen.");setBusy(false);return;}
      if(pin!==pin2){setErr("PINs stimmen nicht uberein.");setBusy(false);return;}
      const exists=await dbLoad("auth_"+u);
      if(exists){setErr("Benutzername vergeben.");setBusy(false);return;}
      const hash=await hashPin(pin);
      await dbSave("auth_"+u,{hash});
      await dbSave("days_"+u,{});
      setOk("Konto erstellt!");
      setTimeout(()=>onLogin(u,{},{},{},3,[],90),700);
    } else {
      const rec=await dbLoad("auth_"+u);
      if(!rec){setErr("Benutzer nicht gefunden.");setBusy(false);return;}
      const hash=await hashPin(pin);
      if(hash!==rec.hash){setErr("Falscher PIN.");setBusy(false);return;}
      const [days,prs,cex,wg,bw,td]=await Promise.all([
        dbLoad("days_"+u).then(v=>v??{}),
        dbLoad("prs_"+u).then(v=>v??{}),
        dbLoad("cex_"+u).then(v=>v??{}),
        dbLoad("wgoal_"+u).then(v=>v??3),
        dbLoad("bw_"+u).then(v=>v??[]),
        dbLoad("timer_"+u).then(v=>v??90),
      ]);
      onLogin(u,days,prs,cex,wg,bw,td);
    }
    setBusy(false);
  }

  return (
    <div className="lw">
      <div className="lc">
        <div className="logo" onTouchStart={()=>{if(window._eggTimer)clearTimeout(window._eggTimer);window._eggTimer=setTimeout(()=>{window._eggFire&&window._eggFire();},2000);}} onTouchEnd={()=>clearTimeout(window._eggTimer)}>GYM LOG</div>
        <div className="logo-sub">Dein Trainingsplan</div>
        <div className="ltabs">
          <button className={`ltab${mode==="login"?" on":""}`} onClick={()=>{setMode("login");setErr("");}}>Login</button>
          <button className={`ltab${mode==="register"?" on":""}`} onClick={()=>{setMode("register");setErr("");}}>Registrieren</button>
        </div>
        <div className="fld"><label>Benutzername</label><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="z.B. max123" autoComplete="username" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        <div className="fld"><label>PIN</label><input value={pin} onChange={e=>setPin(e.target.value)} type="password" placeholder="Mind. 4 Zeichen" autoComplete={mode==="login"?"current-password":"new-password"} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {mode==="register"&&<div className="fld"><label>PIN bestaetigen</label><input value={pin2} onChange={e=>setPin2(e.target.value)} type="password" placeholder="PIN wiederholen" autoComplete="new-password" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>}
        {err&&<div className="merr">{err}</div>}
        {ok&&<div className="mok">{ok}</div>}
        <button className="pbtn" disabled={busy} onClick={submit}>{busy?"...":mode==="login"?"EINLOGGEN":"REGISTRIEREN"}</button>
        {mode==="login"&&<div style={{textAlign:"center"}}><span onClick={async()=>{
          const u=username.trim().toLowerCase();
          if(!u){setErr("Bitte zuerst Benutzernamen eingeben.");return;}
          const rec=await dbLoad("auth_"+u);
          if(!rec){setErr("Benutzer nicht gefunden.");return;}
          setErr("");
          const newPin=Math.floor(1000+Math.random()*9000).toString();
          const hash=await hashPin(newPin);
          await dbSave("auth_"+u,{hash});
          setOk("Neuer PIN: "+newPin+" — bitte merken!");
        }} style={{background:"none",border:"none",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",
          fontSize:".75rem",fontWeight:700,cursor:"pointer",marginTop:"4px",textDecoration:"underline"}}>
          PIN vergessen?
        </span></div>}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {error:null}; }
  componentDidCatch(error, info) {
    console.error("REACT ERROR:", error.message, error.stack);
    console.error("COMPONENT:", info.componentStack);
    this.setState({error: error.message + "\n" + (info.componentStack||"").slice(0,300)});
  }
  static getDerivedStateFromError(error) { return {error: error.message}; }
  render() {
    if(this.state.error) return React.createElement("div", {style:{color:"red",padding:"20px",fontFamily:"monospace",fontSize:"12px",whiteSpace:"pre-wrap"}}, "ERROR: "+this.state.error);
    return this.props.children;
  }
}


function PressToStart({color="var(--acc)", onStart}) {
  const [pressing, setPressing] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const animRef = React.useRef(null);
  const startTimeRef = React.useRef(null);
  const DURATION = 600;
  const SIZE = 88;
  const R = 33;
  const circumference = 2 * Math.PI * R;

  function startPress() {
    setPressing(true);
    startTimeRef.current = Date.now();
    function animate() {
      const elapsed = Date.now() - startTimeRef.current;
      const p = Math.min(elapsed / DURATION, 1);
      setProgress(p);
      if(p < 1) { animRef.current = requestAnimationFrame(animate); }
      else { onStart(); }
    }
    animRef.current = requestAnimationFrame(animate);
  }

  function stopPress() {
    setPressing(false);
    setProgress(0);
    if(animRef.current) cancelAnimationFrame(animRef.current);
  }

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12,
      userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none"}}>
      <div
        onTouchStart={startPress} onTouchEnd={stopPress}
        onMouseDown={startPress} onMouseUp={stopPress} onMouseLeave={stopPress}
        style={{position:"relative",width:SIZE,height:SIZE,cursor:"pointer",
          userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none"}}>

        {/* Progress ring */}
        <svg width={SIZE} height={SIZE} viewBox={`0 0 ${SIZE} ${SIZE}`}
          style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}>
          <circle cx={SIZE/2} cy={SIZE/2} r={R} fill="none"
            stroke="rgba(255,255,255,.08)" strokeWidth="3"/>
          <circle cx={SIZE/2} cy={SIZE/2} r={R} fill="none"
            stroke={color} strokeWidth="3"
            strokeDasharray={circumference}
            strokeDashoffset={circumference*(1-progress)}
            strokeLinecap="round"
            style={{transition:pressing?"none":"stroke-dashoffset .3s ease",
              filter:`drop-shadow(0 0 6px ${color})`}}/>
        </svg>

        {/* Center button */}
        <div style={{position:"absolute",inset:0,display:"flex",
          alignItems:"center",justifyContent:"center",
          background:pressing?`${color}22`:"rgba(255,255,255,.05)",
          borderRadius:"50%",
          border:`1px solid ${pressing?color:"rgba(255,255,255,.1)"}`,
          transition:"background .2s,border .2s",
          boxShadow:pressing?`0 0 20px ${color}40`:"none"}}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke={pressing?color:"rgba(255,255,255,.5)"}
            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
            style={{transition:"stroke .2s"}}>
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </div>
      </div>

      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".65rem",
        fontWeight:800,letterSpacing:"1.5px",textTransform:"uppercase",
        color:pressing?"rgba(255,255,255,.7)":"rgba(255,255,255,.3)",
        transition:"color .2s",textAlign:"center",
        userSelect:"none",WebkitUserSelect:"none",
        WebkitTouchCallout:"none",pointerEvents:"none"}}>
        {pressing?"Loslassen zum Abbrechen":"Gedrückt halten zum Starten"}
      </div>
    </div>
  );
}

function WeekOverview({allDays, customPlans, onClose, onSelectDay}) {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow===0?6:dow-1));

  const days = Array.from({length:7},(_,i)=>{
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const dk = d.toISOString().slice(0,10);
    const di = allDays[dk];
    const isToday = dk===today.toISOString().slice(0,10);
    const isPast = d < new Date(today.toDateString());
    const dayShort = d.toLocaleDateString("de-DE",{weekday:"short"}).toUpperCase();
    const dayNum = d.getDate();
    const monthShort = d.toLocaleDateString("de-DE",{month:"short"});
    let label="", color="rgba(255,255,255,.15)", planName="", bg="transparent", icon=null;
    if(di?.type==="rest"){label="R";color="rgba(100,110,150,.7)";planName="Ruhetag";bg="rgba(100,110,150,.1)";}
    else if(di?.type==="A"){label="A";color="var(--ga)";planName="Tag A";bg="rgba(125,211,252,.1)";}
    else if(di?.type==="B"){label="B";color="var(--gb)";planName="Tag B";bg="rgba(167,139,250,.1)";}
    else if(di?.type?.startsWith("custom_")){
      const plan=customPlans.find(p=>"custom_"+p.id===di.type);
      icon=null; label=plan?.name?.[0]||"✓"; color=plan?.color||"var(--acc)";
      planName=plan?.name||""; bg=(plan?.color||"#ffffff")+"18";
    }
    const hasplan = !!di?.type;
    const canPlan = !isPast || isToday;
    return {dk,d,isToday,isPast,dayShort,dayNum,monthShort,label,color,planName,bg,icon,hasplan,canPlan};
  });

  const planned = days.filter(d=>d.hasplan).length;

  return (
    <div style={{position:"fixed",inset:0,zIndex:800,
      background:"rgba(0,0,0,.65)",backdropFilter:"blur(20px)",
      WebkitBackdropFilter:"blur(20px)",animation:"bgFadeIn .25s ease both"}}

        background:"linear-gradient(0deg,rgba(12,9,20,.99),rgba(18,12,28,.98))",
        borderRadius:"28px 28px 0 0",
        boxShadow:"0 -8px 60px rgba(0,0,0,.8), 0 -1px 0 rgba(255,255,255,.06) inset",
        animation:"sheetUp .45s cubic-bezier(.34,1.2,.64,1) both"}}
        onClick={e=>e.stopPropagation()}
        onTouchStart={e=>{e.currentTarget._sy=e.touches[0].clientY;}}
        onTouchEnd={e=>{if(e.changedTouches[0].clientY-(e.currentTarget._sy||0)>60)onClose();}}>

        {/* Handle */}
        <div style={{display:"flex",justifyContent:"center",padding:"14px 0 0"}}>
          <div style={{width:40,height:4,background:"rgba(255,255,255,.12)",borderRadius:2}}/>
        </div>

        {/* Header */}
        <div style={{padding:"16px 20px 16px"}}>
          <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.5rem",
            fontWeight:900,color:"rgba(255,255,255,.9)",letterSpacing:"-0.5px",
            marginBottom:4}}>
            Diese Woche
          </div>
          <div style={{fontSize:".72rem",color:"var(--mut)",fontWeight:700,
            letterSpacing:"1.5px",marginBottom:12}}>

             planned === 7 ? "VOLLE WOCHE" :
             `${planned} VON 7 TAGEN GEPLANT`}

          {/* Dot indicators */}
          <div style={{display:"flex",gap:7,alignItems:"center"}}>
            {days.map((day,i)=>(
              <div key={i} style={{
                width:day.isToday?13:10,
                height:day.isToday?13:10,
                borderRadius:"50%",flexShrink:0,
                background:day.hasplan?day.color:"rgba(255,255,255,.1)",

            ))}
          </div>
        </div>

        <div style={{height:1,background:"rgba(255,255,255,.05)",margin:"0 20px 14px"}}/>

        {/* Day cards 5+2 (weekdays + weekend) */}

          <div key={ri} style={{display:"grid",
            gridTemplateColumns:ri===0?"repeat(5,1fr)":"repeat(2,1fr)",
            gap:10,padding:`0 16px ${ri===0?"10px":"24px"}`}}>
            {row.map(({dk,d,isToday,isPast,dayShort,dayNum,monthShort,label,color,planName,bg,icon,hasplan,canPlan},i)=>(
              <div key={dk}
                onClick={canPlan?()=>{onClose();onSelectDay(d,dk);}:undefined}
                style={{
                  borderRadius:20,overflow:"hidden",
                  cursor:canPlan?"pointer":"default",
                  background:hasplan?bg:isToday?"rgba(255,255,255,.04)":"rgba(255,255,255,.02)",
                  border:`1.5px solid ${hasplan?color:isToday?"rgba(255,255,255,.2)":"rgba(255,255,255,.07)"}`,
                  boxShadow:isToday&&hasplan?`0 0 0 2px var(--acc),0 0 20px ${color}30`:
                    isToday?"0 0 0 2px var(--acc)":
                    hasplan?`0 0 14px ${color}30`:"none",
                  opacity:isPast&&!hasplan?0.25:1,
                  animation:`flowIn .4s ${(ri*4+i)*.06}s ease both`,
                  animationFillMode:"forwards",opacity:0}}>

                {/* Date header */}
                <div style={{padding:"10px 12px 8px",
                  borderBottom:`1px solid ${hasplan?color+"25":"rgba(255,255,255,.05)"}`}}>
                  <div style={{fontSize:".5rem",fontWeight:900,letterSpacing:"1px",
                    fontFamily:"'Montserrat',sans-serif",marginBottom:2,
                    color:isToday?"var(--acc)":"rgba(255,255,255,.35)"}}>
                    {dayShort}
                  </div>
                  <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
                    fontSize:"1.4rem",lineHeight:.95,
                    color:isToday?"var(--acc)":"rgba(255,255,255,.85)"}}>
                    {dayNum}
                  </div>
                  <div style={{fontSize:".44rem",color:"rgba(255,255,255,.2)",
                    fontWeight:700,marginTop:2,letterSpacing:".5px"}}>
                    {monthShort.toUpperCase()}
                  </div>
                </div>

                {/* Plan content */}
                <div style={{padding:"10px 12px 12px",minHeight:52}}>
                  {hasplan?(
                    <div>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
                        fontSize:icon?"1.1rem":".95rem",color:color,lineHeight:1,
                        marginBottom:4}}>
                        {label}
                      </div>
                      <div style={{fontSize:".58rem",fontWeight:700,
                        color:"rgba(255,255,255,.65)",fontFamily:"'Nunito',sans-serif",
                        overflow:"hidden",textOverflow:"ellipsis",
                        display:"-webkit-box",WebkitLineClamp:2,
                        WebkitBoxOrient:"vertical",lineHeight:1.3}}>
                        {planName}
                      </div>
                    </div>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",
                      alignItems:"center",justifyContent:"center",
                      height:"100%",gap:3}}>
                      {canPlan?(
                        <>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="rgba(255,255,255,.2)" strokeWidth="2" strokeLinecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                          </svg>
                          <div style={{fontSize:".48rem",color:"rgba(255,255,255,.2)",
                            fontWeight:700,letterSpacing:".5px"}}>PLANEN</div>
                        </>
                      ):(
                        <div style={{fontSize:".55rem",color:"rgba(255,255,255,.1)",
                          fontWeight:600}}>—</div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}


function App() {
  const [status,setStatus]=useState("boot");
  const [user,setUser]=useState(null);
  const [allDays,setAllDays]=useState({});
  const [prs,setPrs]=useState({});
  const [customEx,setCustomEx]=useState({});
  const [weekGoal,setWeekGoal]=useState(3);
  const [bodyWeights,setBodyWeights]=useState([]);
  const [navKey,setNavKey]=React.useState(0);
  const [trainingStarted,setTrainingStarted]=React.useState(()=>{
    try{return !!localStorage.getItem('workout_start');}catch(e){return false;}
  });
  const [showRestConfirm,setShowRestConfirm]=React.useState(false);
  const [showNewPlanModal,setShowNewPlanModal]=React.useState(false);
  const [showWeekOverview,setShowWeekOverview]=React.useState(false);
  const pickerFromWeek=React.useRef(false);

  function saveFavs(next){setFavoritePlans(next);try{localStorage.setItem('gymlog_favs',JSON.stringify(next));}catch(e){}}
  const [timerDuration,setTimerDuration]=useState(90);
  const [customPlans,setCustomPlans]=useState([]);

  function toDisplay(kg){if(!kg&&kg!==0)return kg;return unit==='lbs'?Math.round(parseFloat(kg)*2.2046*10)/10:kg;}
  function toKg(v){if(!v&&v!==0)return v;return unit==='lbs'?Math.round(parseFloat(v)/2.2046*10)/10:v;}
  const [selectedDate,setSelectedDate]=useState(today());
  const [showOnboarding,setShowOnboarding]=useState(false);
  const [gymName,setGymName]=useState("");
  const [theme,setTheme]=useState(()=>{
    const saved=localStorage.getItem("gymlog_dark_guest");
    return "default";
  });
  const [profilePic,setProfilePic]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const egg = useEasterEgg();
  React.useEffect(()=>{
    window._eggFire = ()=>egg.setShow(true);
    return ()=>{ window._eggFire=null; };
  },[egg.setShow]);
  const [showWelcomeBanner,setShowWelcomeBanner]=useState(false);
  const [darkMode,setDarkMode]=useState(()=>{
    const saved=localStorage.getItem("gymlog_dark_guest");
    if(saved!==null) return JSON.parse(saved);
    return !window.matchMedia("(prefers-color-scheme: light)").matches;
  });
  const [view,setView]=useState("log");
  const [showPicker,setShowPicker]=useState(false);
  const [saveStatus,setSaveStatus]=useState("ok");
  const saveTimer=useRef(null);
  const swipeRef=useRef({});

  useEffect(()=>{
    const mq=window.matchMedia("(prefers-color-scheme: light)");
    function handleChange(e){
      const saved=user?localStorage.getItem("gymlog_dark_"+user):localStorage.getItem("gymlog_dark_guest");
      if(saved===null||saved===undefined) setDarkMode(!e.matches);
    }
    mq.addEventListener("change",handleChange);
    return()=>mq.removeEventListener("change",handleChange);
  },[user]);

  useEffect(()=>{
    try{
      const session=JSON.parse(localStorage.getItem("gymlog_session")||"null");
      if(session?.username){
        const u=session.username;
        const auth=JSON.parse(localStorage.getItem("gymlog_auth_"+u)||"null");
        if(auth){
          setUser(u);
          setAllDays(JSON.parse(localStorage.getItem("gymlog_days_"+u)||"{}"));
          setPrs(JSON.parse(localStorage.getItem("gymlog_prs_"+u)||"{}"));
          setCustomEx(JSON.parse(localStorage.getItem("gymlog_cex_"+u)||"{}"));
          setWeekGoal(JSON.parse(localStorage.getItem("gymlog_wgoal_"+u)||"3"));
          setBodyWeights(JSON.parse(localStorage.getItem("gymlog_bw_"+u)||"[]"));
          setTimerDuration(JSON.parse(localStorage.getItem("gymlog_timer_"+u)||"90"));
          setCustomPlans(JSON.parse(localStorage.getItem("gymlog_cplans_"+u)||"[]"));
          setHiddenDefaults(JSON.parse(localStorage.getItem("gymlog_hdef_"+u)||"[]"));
          setGymName(localStorage.getItem("gymlog_gym_"+u)||"");
          setTheme(localStorage.getItem("gymlog_theme_"+u)||"default");
          setProfilePic(localStorage.getItem("gymlog_pic_"+u)||null);
          const savedDark=localStorage.getItem("gymlog_dark_"+u);
          const guestDark=localStorage.getItem("gymlog_dark_guest");
          if(savedDark!==null){setDarkMode(JSON.parse(savedDark));}
          else if(guestDark!==null){setDarkMode(JSON.parse(guestDark));localStorage.setItem("gymlog_dark_"+u,guestDark);localStorage.removeItem("gymlog_dark_guest");}
          else{setDarkMode(!window.matchMedia("(prefers-color-scheme: light)").matches);}
          setStatus("app");return;
        }
      }
    }catch(e){}
    setStatus("login");
  },[]);

  function handleLogin(u,days,prData,cex,wg,bw,td){
    localStorage.setItem("gymlog_session",JSON.stringify({username:u}));
    setUser(u);setAllDays(days);setPrs(prData);setCustomEx(cex);
    setWeekGoal(wg);setBodyWeights(bw);setTimerDuration(td);
    setStatus("app");
    const isNew=Object.keys(days||{}).length===0&&Object.keys(cex||{}).length===0;
    if(isNew) setShowWelcomeBanner(true);
  }
  function handleLogout(){
    localStorage.removeItem("gymlog_session");
    setUser(null);setAllDays({});setPrs({});setCustomEx({});
    setWeekGoal(3);setBodyWeights([]);setTimerDuration(90);setCustomPlans([]);setHiddenDefaults([]);setDarkMode(true);setTheme("default");setProfilePic(null);setStatus("login");
  }
  function save(key,val){localStorage.setItem("gymlog_"+key,JSON.stringify(val));}
  function debounce(fn){setSaveStatus("ing");if(saveTimer.current) clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>{fn();setSaveStatus("ok");},600);}
  function saveDays(next){setAllDays(next);debounce(()=>save("days_"+user,next));}
  function savePrs(next){setPrs(next);save("prs_"+user,next);}
  function saveCustomEx(next){setCustomEx(next);save("cex_"+user,next);}
  function saveWeekGoal(v){setWeekGoal(v);save("wgoal_"+user,v);}
  function saveBW(next){setBodyWeights(next);save("bw_"+user,next);}
  function saveTimerDuration(v){setTimerDuration(v);save("timer_"+user,v);}
  function saveCustomPlans(next){setCustomPlans(next);localStorage.setItem("gymlog_cplans_"+user,JSON.stringify(next));save("cplans_"+user,next);}
  function saveCustomEx(next){setCustomEx(next);save("cex_"+user,next);}
  function saveWeekGoal(v){setWeekGoal(v);save("wgoal_"+user,v);}
  function saveBW(next){setBodyWeights(next);save("bw_"+user,next);}
  function saveTimerDuration(v){setTimerDuration(v);save("timer_"+user,v);}
  function saveGymName(v){setGymName(v);localStorage.setItem("gymlog_gym_"+user,v);}
  function saveTheme(t){setTheme(t);localStorage.setItem("gymlog_theme_"+user,t);}
  function saveProfilePic(pic){setProfilePic(pic);if(pic)localStorage.setItem("gymlog_pic_"+user,pic);else localStorage.removeItem("gymlog_pic_"+user);}
  function toggleDarkMode(){const next=!darkMode;setDarkMode(next);const key=user?"gymlog_dark_"+user:"gymlog_dark_guest";localStorage.setItem(key,JSON.stringify(next));}
  function handleNewPR(exId,weight){if(!prs[exId]||weight>prs[exId])savePrs({...prs,[exId]:weight});}
  function saveHiddenDefaults(next){setHiddenDefaults(next);localStorage.setItem("gymlog_hdef_"+user,JSON.stringify(next));}
  function saveGymName(v){setGymName(v);localStorage.setItem("gymlog_gym_"+user,v);}
  function saveTheme(t){setTheme(t);localStorage.setItem("gymlog_theme_"+user,t);}
  function saveProfilePic(pic){setProfilePic(pic);if(pic) localStorage.setItem("gymlog_pic_"+user,pic); else localStorage.removeItem("gymlog_pic_"+user);}
  function toggleDarkMode(){
    const next=!darkMode;setDarkMode(next);
    const key=user?"gymlog_dark_"+user:"gymlog_dark_guest";
    localStorage.setItem(key,JSON.stringify(next));
  }
  function handleOnboardTemplate(tmpl){
    const newPlans=tmpl.plans.map(p=>({...p,id:"tmpl_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)}));
    saveCustomPlans([...customPlans,...newPlans]);setShowOnboarding(false);
    setTimeout(()=>setShowPicker(true),200);
  }
  function handleOnboardCreateOwn(){setShowOnboarding(false);setView("plans");}
  function handleNewPR(exId,weight){if(!prs[exId]||weight>prs[exId]) savePrs({...prs,[exId]:weight});}

  const dk=dateKey(selectedDate);
  const dayInfo=allDays[dk];
  // Reset training state when date changes
  const prevDk=React.useRef(dk);
  if(prevDk.current!==dk){prevDk.current=dk;if(trainingStarted)setTrainingStarted(false);}
  const planIdx=dayInfo?.type==="A"?0:dayInfo?.type==="B"?1:null;
  const customPlanData=dayInfo?.type?.startsWith("custom_")?customPlans.find(p=>"custom_"+p.id===dayInfo.type):null;
  const isToday=dk===dateKey(today());

  function setDayType(type){saveDays({...allDays,[dk]:{...(allDays[dk]??{}),type}});setShowPicker(false);if(type!=="rest")setTrainingStarted(false);}
  function updateDayData(data){saveDays({...allDays,[dk]:{...(allDays[dk]??{}),...data}});}

  if(status==="boot") return <div className="loading"><div className="loading-logo">GYM LOG</div><div className="loading-bars"><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/></div><div className="loading-sub">Laden...</div></div>;
  if(status==="login") return <Login onLogin={handleLogin}/>;

  return (
    <>
      <div className="app" onTouchStart={e=>{swipeRef.current={x:e.touches[0].clientX,y:e.touches[0].clientY};}} onTouchEnd={e=>{const dx=e.changedTouches[0].clientX-swipeRef.current.x;const dy=Math.abs(e.changedTouches[0].clientY-swipeRef.current.y);if(trainingStarted===true)return;if(Math.abs(dx)>60&&dy<60){const keys=NAV_ITEMS.map(n=>n.key);const cur=keys.indexOf(view);if(dx<0&&cur<keys.length-1){setView(keys[cur+1]);setNavKey(k=>k+1);}else if(dx>0&&cur>0){setView(keys[cur-1]);setNavKey(k=>k+1);}}}} ref={el=>{
        if(el){
          document.body.classList.toggle("light",!darkMode);
          THEMES.forEach(t=>document.body.classList.remove("theme-"+t.id));
          if(theme!=="default") document.body.classList.add("theme-"+theme);
          let m1=document.querySelector("meta[name=\"apple-mobile-web-app-capable\"]");
          if(!m1){m1=document.createElement("meta");m1.name="apple-mobile-web-app-capable";document.head.appendChild(m1);}
          m1.content="yes";
        }
      }}>
        {/* Ambient orbs - shown on empty screens */}
        {((view==="log"&&!dayInfo?.type)||(view==="plans"&&customPlans.length===0))&&(
          <div className="orb-layer">
            <div className="orb orb-1"/>
            <div className="orb orb-2"/>
            <div className="orb orb-3"/>
            <div className="orb orb-4"/>
          </div>
        )}
        {egg.show&&<EasterEggModal onClose={()=>egg.setShow(false)}/>}
        <EasterEgg/>
        {showOnboarding&&<OnboardingModal onSelectTemplate={handleOnboardTemplate} onCreateOwn={handleOnboardCreateOwn} onCancel={()=>setShowOnboarding(false)}/>}
        {showWelcomeBanner&&(
          <div style={{position:"fixed",inset:0,zIndex:800,background:"linear-gradient(160deg,#08070f 0%,#0e0b18 50%,#130d1e 100%)",
            display:"flex",flexDirection:"column",alignItems:"center",
            justifyContent:"center",padding:"40px 32px",animation:"fadeIn .4s ease both"}}>
            <div style={{position:"absolute",width:"80vw",height:"80vw",borderRadius:"50%",
              background:"radial-gradient(circle,rgba(99,102,241,.2) 0%,transparent 70%)",
              top:"-10%",left:"-20%",filter:"blur(40px)",
              animation:"orbFloat1 8s ease-in-out infinite",pointerEvents:"none"}}/>
            <div style={{position:"absolute",width:"70vw",height:"70vw",borderRadius:"50%",
              background:"radial-gradient(circle,rgba(16,185,129,.15) 0%,transparent 70%)",
              bottom:"-5%",right:"-15%",filter:"blur(36px)",
              animation:"orbFloat2 10s ease-in-out infinite",pointerEvents:"none"}}/>
            <div style={{textAlign:"center",position:"relative",zIndex:1,width:"100%",
              display:"flex",flexDirection:"column",alignItems:"center"}}>

                letterSpacing:"4px",marginBottom:8,
                background:"linear-gradient(135deg,var(--acc),rgba(255,255,255,.6))",
                WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",
                animation:"flowIn .8s .1s cubic-bezier(.25,.46,.45,.94) both"}}>GYM LOG</div>
              <div style={{fontSize:".65rem",color:"var(--mut)",fontWeight:700,letterSpacing:"4px",
                textTransform:"uppercase",marginBottom:48,
                animation:"flowIn .8s .25s cubic-bezier(.25,.46,.45,.94) both"}}>
                Dein persönlicher Trainingsbegleiter
              </div>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.6rem",fontWeight:900,
                marginBottom:12,letterSpacing:".5px",
                animation:"flowIn .8s .4s cubic-bezier(.25,.46,.45,.94) both"}}>
                Willkommen! 👋
              </div>
              <div style={{fontSize:".85rem",color:"var(--mut)",lineHeight:1.7,marginBottom:40,
                fontWeight:600,maxWidth:280,
                animation:"flowIn .8s .55s cubic-bezier(.25,.46,.45,.94) both"}}>
                Starte mit einem fertigen Plan oder erstelle deinen eigenen.
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10,width:"100%",maxWidth:300,
                animation:"flowIn .8s .7s cubic-bezier(.25,.46,.45,.94) both"}}>
                <button onClick={()=>{setShowWelcomeBanner(false);if(customPlans.length===0){setShowOnboarding(true);}else{setView("plans");}}}
                  style={{width:"100%",background:"var(--acc)",color:"var(--acc-txt,#080a0f)",
                    border:"none",borderRadius:18,padding:"16px",cursor:"pointer",
                    fontFamily:"'Montserrat',sans-serif",fontSize:".95rem",fontWeight:900,
                    letterSpacing:"1.5px",textTransform:"uppercase"}}>
                  Pläne ansehen
                </button>
                <button onClick={()=>setShowWelcomeBanner(false)}
                  style={{width:"100%",background:"rgba(255,255,255,.06)",
                    border:"1px solid rgba(255,255,255,.1)",borderRadius:18,padding:"15px",
                    cursor:"pointer",fontFamily:"'Nunito',sans-serif",
                    fontSize:".88rem",fontWeight:800,color:"var(--mut)"}}>
                  Später
                </button>
              </div>
            </div>
          </div>
        )}
        <header>
          <div className="hlogo">GYM LOG</div>
          <div className="dot"/>
          <button onClick={()=>setShowSettings(true)} style={{background:"none",border:"1px solid rgba(255,255,255,.1)",borderRadius:"10px",padding:"6px 8px",cursor:"pointer",color:"var(--mut)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div className="upill">
            <div className="uav" onClick={()=>setShowSettings(true)} style={{cursor:"pointer",overflow:"hidden"}}>
              {profilePic?<img src={profilePic} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>:user[0].toUpperCase()}
            </div>
            <div className="uname">{user?user.charAt(0).toUpperCase()+user.slice(1):""}</div>
            <button className="logoutbtn" onClick={handleLogout}>Logout</button>
          </div>
        </header>

        {view==="cal"?(
          <CalendarView allDays={allDays} selectedDate={selectedDate} onSelectDate={d=>{setSelectedDate(d);setView("log");}} customPlans={customPlans} onDeleteDay={dk=>{const next={...allDays};delete next[dk];saveDays(next);}}/>
        ):view==="stats"?(
          <StatsPage allDays={allDays} prs={prs} bodyWeights={bodyWeights} onSaveBW={saveBW} weekGoal={weekGoal} onSetWeekGoal={saveWeekGoal} timerDuration={timerDuration} onSetTimerDuration={saveTimerDuration} customPlans={customPlans} onSavePlans={saveCustomPlans}/>
        ):view==="gym"?(
          <GymPage gymName={gymName} onSaveGym={saveGymName}/>
        ):view==="plans"?(
          <PlansPage customPlans={customPlans} onSavePlans={saveCustomPlans} hiddenDefaults={hiddenDefaults} onToggleDefault={saveHiddenDefaults} onSelectTemplate={handleOnboardTemplate} favoritePlans={favoritePlans} onSaveFavs={saveFavs}/>
        ):(
          <>
            <div key={navKey} style={{padding:"12px 14px 0",display:(planIdx!==null||customPlanData)&&trainingStarted===false?"none":"block"}}>
              
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:6}}>
                <button onClick={()=>setShowWeekOverview(true)}
                  style={{background:"rgba(255,255,255,.06)",
                    border:"1px solid rgba(255,255,255,.12)",borderRadius:14,
                    padding:"10px 16px",cursor:"pointer",
                    display:"flex",alignItems:"center",gap:8}}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="rgba(255,255,255,.55)" strokeWidth="2" strokeLinecap="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  <span style={{fontSize:".65rem",fontWeight:800,letterSpacing:"1px",
                    color:"rgba(255,255,255,.5)",fontFamily:"'Montserrat',sans-serif"}}>
                    WOCHE
                  </span>
                </button>
              </div>
              <div key={view} className="day-banner" style={{animation:"bannerSlideIn .7s cubic-bezier(.25,.46,.45,.94) both"}}>

                <div>
                  <div className="day-banner-date" style={{color:"var(--acc)"}}>{isToday?"Heute":selectedDate.toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</div>
                  <div style={{fontSize:".63rem",color:"var(--mut)",marginTop:"2px"}}>{selectedDate.toLocaleDateString("de-DE",{weekday:"long"})}</div>
                </div>
                <div className="day-banner-info">
                  {dayInfo?.type==="A"&&<><div className="day-banner-tag" style={{color:"var(--ga)"}}>TAG A</div><div className="day-banner-sub">Brust & Rucken</div></>}
                  {dayInfo?.type==="B"&&<><div className="day-banner-tag" style={{color:"var(--gb)"}}>TAG B</div><div className="day-banner-sub">Schulter & Arme</div></>}
                  {dayInfo?.type==="rest"&&<div className="day-banner-tag" style={{color:"var(--mut)"}}>Ruhetag</div>}
                  {dayInfo?.type?.startsWith("custom_")&&customPlanData&&<><div className="day-banner-tag" style={{color:customPlanData.color||"var(--acc)"}}>{customPlanData.name.toUpperCase()}</div><div className="day-banner-sub">Eigener Plan</div></>}
                  {!dayInfo?.type&&<div className="day-banner-sub">Kein Training geplant</div>}
                </div>
                <button className="day-banner-change" onClick={e=>{e.stopPropagation();
                  if(!dayInfo?.type&&customPlans.length===0) setShowOnboarding(true);
                  else setShowPicker(true);
                }}>{dayInfo?.type?"Andern":"+ Planen"}</button>
              </div>
              <div className="savebar">
                <span className={`savetxt ${saveStatus}`} style={{color:saveStatus==="ok"?"var(--acc)":"var(--mut)"}}>{saveStatus==="ing"?"Speichert...":"✓ Gespeichert"}</span>
              </div>
            </div>
            {planIdx!==null&&trainingStarted!=='dismissed'?(
              trainingStarted?(
                <TrainingPage planIdx={planIdx} dayData={dayInfo} customExercises={customEx} onUpdate={updateDayData} onUpdateCustom={saveCustomEx} onChangeType={()=>setShowPicker(true)} prs={prs} onNewPR={handleNewPR} timerDuration={timerDuration} allDays={allDays} currentDk={dk}/>
              ):(
                <TrainingPreview
                  name={DEFAULT_PLAN[planIdx]?.label||DEFAULT_PLAN[planIdx]?.title}
                  sections={DEFAULT_PLAN[planIdx]?.sections}
                  color={"var(--ga)"}
                  allDays={allDays} planType={dayInfo?.type}
                  onStart={()=>setTrainingStarted(true)}
                  onBack={()=>setTrainingStarted('dismissed')}
                  onChangeType={()=>setShowPicker(true)}/>
              )
            ):customPlanData&&trainingStarted!=='dismissed'?(
              trainingStarted?(
                <CustomTrainingPage plan={customPlanData} dayData={dayInfo} onUpdate={updateDayData} onChangeType={()=>setShowPicker(true)} prs={prs} onNewPR={handleNewPR} timerDuration={timerDuration} allDays={allDays} currentDk={dk}/>
              ):(
                <TrainingPreview
                  name={customPlanData?.name}
                  sections={customPlanData?.sections}
                  color={customPlanData?.color||"var(--acc)"}
                  icon={customPlanData?.icon}
                  allDays={allDays} planType={dayInfo?.type}
                  onStart={()=>setTrainingStarted(true)}
                  onBack={()=>setTrainingStarted('dismissed')}
                  onChangeType={()=>setShowPicker(true)}/>
              )
            ):dayInfo?.type==="rest"?(
              <div style={{flex:1,display:"flex",flexDirection:"column",
                alignItems:"center",justifyContent:"center",
                padding:"40px 24px",position:"relative",overflow:"hidden",
                minHeight:"60vh"}}>

                {/* Background orbs */}
                <div style={{position:"absolute",width:"60vw",height:"60vw",
                  borderRadius:"50%",top:"-10%",left:"-10%",
                  background:"radial-gradient(circle,rgba(149,18,44,.35) 0%,transparent 70%)",
                  filter:"blur(50px)",animation:"orbFloat1 10s ease-in-out infinite",
                  pointerEvents:"none"}}/>
                <div style={{position:"absolute",width:"50vw",height:"50vw",
                  borderRadius:"50%",bottom:"5%",right:"-5%",
                  background:"radial-gradient(circle,rgba(80,5,20,.4) 0%,transparent 70%)",
                  filter:"blur(45px)",animation:"orbFloat2 12s ease-in-out infinite",
                  pointerEvents:"none"}}/>

                {/* Big emoji */}
                <div style={{fontSize:"4rem",marginBottom:16,
                  animation:"flowIn .6s ease both"}}>
                  😴
                </div>

                {/* REST text */}
                <div style={{fontFamily:"'Montserrat',sans-serif",
                  fontSize:"clamp(3rem,18vw,5rem)",fontWeight:900,
                  letterSpacing:"-2px",lineHeight:.9,marginBottom:12,
                  background:"linear-gradient(160deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 100%)",
                  WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
                  backgroundClip:"text",
                  animation:"daySlideIn .7s ease both"}}>
                  RUHETAG
                </div>

                {/* Date */}
                <div style={{fontSize:".65rem",color:"var(--mut)",fontWeight:700,
                  letterSpacing:"3px",textTransform:"uppercase",marginBottom:24,
                  animation:"flowIn .6s .2s ease both"}}>
                  {selectedDate.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})}
                </div>

                {/* Divider */}
                <div style={{width:32,height:2,borderRadius:1,
                  background:"rgba(255,255,255,.1)",marginBottom:24}}/>

                {/* Motivational text */}
                <div style={{fontSize:".85rem",color:"var(--mut)",fontWeight:600,
                  textAlign:"center",lineHeight:1.7,maxWidth:240,marginBottom:32,
                  animation:"flowIn .6s .35s ease both"}}>
                  Erholung ist Training.<br/>
                  Dein Körper wächst jetzt.
                </div>

                {/* Recovery tips */}
                <div style={{display:"flex",gap:10,marginBottom:32,
                  animation:"flowIn .6s .5s ease both"}}>
                  {[["💧","Hydrieren"],["🥗","Gut essen"],["😴","Schlafen"]].map(([e,l])=>(
                    <div key={l} style={{display:"flex",flexDirection:"column",
                      alignItems:"center",gap:4,padding:"12px 10px",
                      background:"rgba(255,255,255,.04)",
                      border:"1px solid rgba(255,255,255,.07)",
                      borderRadius:14,minWidth:64}}>
                      <span style={{fontSize:"1.2rem"}}>{e}</span>
                      <span style={{fontSize:".55rem",color:"var(--mut)",
                        fontWeight:700,letterSpacing:".5px"}}>{l}</span>
                    </div>
                  ))}
                </div>

                {/* Change button */}
                <button onClick={()=>setShowPicker(true)}
                  style={{background:"rgba(255,255,255,.06)",
                    border:"1px solid rgba(255,255,255,.1)",borderRadius:16,
                    padding:"12px 24px",cursor:"pointer",
                    fontFamily:"'Nunito',sans-serif",fontSize:".78rem",
                    fontWeight:800,color:"var(--mut)",
                    animation:"flowIn .6s .65s ease both"}}>
                  Ändern
                </button>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                flex:1,padding:"24px 24px 100px",textAlign:"center",position:"relative"}}>


                {/* Day name - huge */}
                <div style={{position:"relative",marginBottom:8,width:"100%"}}>
                  <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
                    fontSize:"clamp(2.2rem,11vw,4rem)",letterSpacing:"-1px",lineHeight:.85,
                    background:"linear-gradient(160deg,var(--acc) 0%,rgba(255,255,255,.12) 80%)",
                    WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
                    backgroundClip:"text",userSelect:"none"}}>
                    {new Date().toLocaleDateString("de-DE",{weekday:"long"}).toUpperCase()}
                  </div>
                  {/* Blur glow behind text */}
                  <div style={{position:"absolute",inset:0,
                    background:"radial-gradient(ellipse 60% 40% at 50% 60%,var(--acc)08,transparent)",
                    pointerEvents:"none",zIndex:-1}}/>
                </div>

                {/* Date */}
                <div style={{fontSize:".65rem",color:"var(--mut)",fontWeight:700,
                  letterSpacing:"3px",textTransform:"uppercase",marginBottom:28,
                  animation:"flowIn .6s .3s ease both"}}>
                  {new Date().toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})}
                </div>

                {/* Divider */}
                <div style={{width:32,height:2,borderRadius:1,background:"rgba(255,255,255,.1)",marginBottom:28}}/>

                {/* Rotating athlete quotes */}
                <div style={{animation:"flowIn .6s .5s ease both"}}>
                <QuoteRotator/>
              </div>

                {/* CTA Button */}
                <button onClick={()=>{
                  if(customPlans.length===0) setShowOnboarding(true);
                  else setShowPicker(true);
                }} style={{
                  background:"var(--acc)",color:"var(--acc-txt,#080a0f)",border:"none",
                  borderRadius:20,padding:"18px 32px",cursor:"pointer",
                  fontFamily:"'Montserrat',sans-serif",fontSize:".95rem",fontWeight:900,
                  letterSpacing:"2px",textTransform:"uppercase",
                  boxShadow:"0 0 40px var(--acc)33,0 8px 24px rgba(0,0,0,.15)",
                  width:"auto",marginBottom:14,
                  transition:"transform .15s,box-shadow .15s"}}>
                  + TAG PLANEN
                </button>
                <button onClick={e=>{e.stopPropagation();setShowRestConfirm(true);}}
                  style={{background:"rgba(255,255,255,.06)",
                    border:"1px solid rgba(255,255,255,.1)",
                    backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)",
                    borderRadius:20,padding:"9px 20px",cursor:"pointer",
                    fontSize:".65rem",color:"rgba(255,255,255,.65)",fontWeight:700,
                    letterSpacing:".5px",fontFamily:"'Nunito',sans-serif",
                    marginTop:4,display:"flex",alignItems:"center",gap:6}}>
                  😴 als Ruhetag markieren
                </button>
              </div>
            )}
          </>
        )}

        <SwipeNav view={view} setView={setView}/>

        {showPicker&&<DayPickerModal date={selectedDate} current={dayInfo?.type} onSelect={setDayType} onClose={()=>{setShowPicker(false);if(pickerFromWeek.current){pickerFromWeek.current=false;setShowWeekOverview(true);}}} onNew={()=>{setShowPicker(false);setView("plans");setShowNewPlanModal(true);}} customPlans={customPlans} hiddenDefaults={hiddenDefaults}/>}
        {showNewPlanModal&&<NewPlanModal editPlan={null}
          onSave={plan=>{
            const exists=customPlans.find(p=>p.id===plan.id);
            if(exists) saveCustomPlans(customPlans.map(p=>p.id===plan.id?plan:p));
            else saveCustomPlans([...customPlans,plan]);
            setShowNewPlanModal(false);
          }}
          onClose={()=>setShowNewPlanModal(false)}/>}
        {showWeekOverview&&<WeekOverview allDays={allDays} customPlans={customPlans} onClose={()=>setShowWeekOverview(false)} onSelectDay={(d,dk)=>{setSelectedDate(d);setShowWeekOverview(false);pickerFromWeek.current=true;if(customPlans.length===0)setShowOnboarding(true);else setShowPicker(true);}}/>}
        {showRestConfirm&&(
          <div style={{position:"fixed",inset:0,zIndex:900,
            background:"rgba(0,0,0,.5)",backdropFilter:"blur(8px)",
            WebkitBackdropFilter:"blur(8px)",
            display:"flex",alignItems:"flex-end",animation:"bgFadeIn .25s ease both"}}
            onClick={()=>setShowRestConfirm(false)}>
            <div style={{width:"100%",background:"rgba(14,17,23,.97)",
              borderRadius:"24px 24px 0 0",padding:"24px 20px 48px",
              boxShadow:"0 -8px 40px rgba(0,0,0,.5)",
              animation:"sheetUp .45s cubic-bezier(.34,1.56,.64,1) both"}}
              onClick={e=>e.stopPropagation()}>
              <div style={{width:36,height:4,background:"rgba(255,255,255,.15)",
                borderRadius:2,margin:"0 auto 20px"}}/>
              <div style={{textAlign:"center",marginBottom:20}}>
                <div style={{fontSize:"2rem",marginBottom:8}}>😴</div>
                <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.1rem",
                  fontWeight:900,marginBottom:6}}>Ruhetag?</div>
                <div style={{fontSize:".75rem",color:"var(--mut)",fontWeight:600}}>
                  {selectedDate.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})} als Ruhetag markieren?
                </div>
              </div>
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setShowRestConfirm(false)}
                  style={{flex:1,padding:"14px",borderRadius:14,cursor:"pointer",
                    background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.1)",
                    fontFamily:"'Montserrat',sans-serif",fontSize:".78rem",
                    fontWeight:900,color:"var(--mut)"}}>
                  Abbrechen
                </button>
                <button onClick={()=>{setDayType("rest");setShowRestConfirm(false);}}
                  style={{flex:2,padding:"14px",borderRadius:14,cursor:"pointer",
                    background:"var(--acc)",border:"none",
                    fontFamily:"'Montserrat',sans-serif",fontSize:".78rem",
                    fontWeight:900,color:"var(--acc-txt,#080a0f)"}}>
                  😴 Ja, Ruhetag!
                </button>
              </div>
            </div>
          </div>
        )}
        {showSettings&&<SettingsModal
          onClose={()=>setShowSettings(false)}
          currentTheme={theme}
          onThemeChange={t=>saveTheme(t)}
          profilePic={profilePic}
          onProfilePicSave={saveProfilePic}
          darkMode={darkMode}
          onToggleDark={v=>{if(v!==darkMode) toggleDarkMode();}}
         username={user}/>}
      </div>
    </>
  );
}
