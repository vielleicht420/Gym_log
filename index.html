                  <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
                    <div style={{display:"flex",alignItems:"center",background:"var(--sur)",border:"1px solid var(--bdr)",borderRadius:"8px",overflow:"hidden",flex:1}}>
                      <button onClick={()=>setNewExSets(s=>Math.max(1,s-1))} style={{background:"none",border:"none",color:"var(--txt)",padding:"7px 10px",cursor:"pointer",fontSize:".9rem",fontWeight:800}}>-</button>
                      <div style={{flex:1,textAlign:"center",fontSize:".78rem",fontWeight:800}}>{newExSets} Sätze</div>
                      <button onClick={()=>setNewExSets(s=>Math.min(10,s+1))} style={{background:"none",border:"none",color:"var(--txt)",padding:"7px 10px",cursor:"pointer",fontSize:".9rem",fontWeight:800}}>+</button>
                    </div>
                    <input value={newExReps} onChange={e=>setNewExReps(e.target.value)} placeholder="Wdh."
                      style={{width:"70px",background:"var(--sur)",border:"1px solid var(--bdr)",borderRadius:"8px",color:"var(--txt)",fontFamily:"'Nunito',sans-serif",fontSize:".82rem",fontWeight:700,padding:"8px 8px",outline:"none",textAlign:"center"}}/>
                    <button onClick={()=>addExercise(si)}
                      style={{background:"var(--acc)",color:"#080a0f",border:"none",borderRadius:"8px",padding:"8px 12px",cursor:"pointer",fontFamily:"'Montserrat',sans-serif",fontSize:".75rem",fontWeight:800}}>OK</button>
                  </div>
                </div>
              )}
            </div>
          ))}
          {/* Add section */}
          <div style={{display:"flex",gap:"8px",marginTop:"4px"}}>
            <input value={newSecName} onChange={e=>setNewSecName(e.target.value)} placeholder="Neuer Abschnitt..."
              style={{flex:1,background:"var(--card)",border:"1px solid rgba(255,255,255,.06)",borderRadius:"10px",color:"var(--txt)",fontFamily:"'Nunito',sans-serif",fontSize:".82rem",fontWeight:700,padding:"9px 12px",outline:"none"}}
              onKeyDown={e=>e.key==="Enter"&&addSection()}/>
            <button onClick={addSection} style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",color:"var(--acc3)",borderRadius:"10px",padding:"9px 14px",cursor:"pointer",fontFamily:"'Montserrat',sans-serif",fontSize:".8rem",fontWeight:800}}>+</button>
          </div>
        </div>

        <button onClick={()=>{if(name.trim()&&sections.some(s=>s.exercises.length>0)) onSave({id:editPlan?.id||"p_"+Date.now(),name:name.trim(),color,sections,icon:name.trim()[0]?.toUpperCase()});}}
          disabled={!name.trim()||!sections.some(s=>s.exercises.length>0)}
          style={{width:"100%",background:"var(--acc)",color:"#080a0f",border:"none",borderRadius:"14px",
            fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:800,letterSpacing:"2px",
            textTransform:"uppercase",padding:"14px",cursor:"pointer",opacity:(!name.trim()||!sections.some(s=>s.exercises.length>0))?".35":"1"}}>
          {editPlan?"SPEICHERN":"PLAN ERSTELLEN"}
        </button>
        <button className="modal-cancel" onClick={onClose}>Abbrechen</button>
      </div>
    </div>
  );
}

// ── Custom TrainingPage ───────────────────────────────────────────────────────
function CustomTrainingPage({plan, dayData={}, onUpdate, onChangeType, prs, onNewPR, timerDuration=90}) {
  const [showTimer,setShowTimer]=useState(false);
  const [showConfetti,setShowConfetti]=useState(false);
  const prevDoneRef=useRef(0);
  const confettiShownRef=useRef(false); // only show once per session
  const overrides=dayData?.overrides??{};
  let total=0,done=0;
  plan.sections.forEach((s,si)=>{s.exercises.forEach((ex,ei)=>{
    const ov=overrides[`${si}_${ei}`]??{};
    const effSets=ov.sets??ex.sets;
    total+=effSets;
    const ed=dayData?.sections?.[si]?.[ei]??{};
    for(let i=0;i<effSets;i++){const sd=ed[i]??{};if(sd.w&&sd.r&&parseFloat(sd.w)>0&&parseFloat(sd.r)>0) done++;}
  });});
  useEffect(()=>{
    if(total>0&&done===total&&prevDoneRef.current<total&&!confettiShownRef.current){
      confettiShownRef.current=true;
      setShowConfetti(true);
    }
    prevDoneRef.current=done;
  },[done,total]);
  function upEx(si,ei,val){onUpdate({...dayData,sections:{...dayData?.sections,[si]:{...dayData?.sections?.[si],[ei]:val}}});}
  function saveOverride(si,ei,val){const k=`${si}_${ei}`,newOv={...overrides};if(!val.sets&&!val.reps) delete newOv[k]; else newOv[k]=val;onUpdate({...dayData,overrides:newOv});}
  function handleSetComplete(exId,weight){setShowTimer(true);if(weight>0) onNewPR(exId,weight);}

  return (
    <div className="page">
      {showConfetti&&<Confetti onDone={()=>setShowConfetti(false)}/>}
      <div className="statsbar">
        <div className="stat"><div className="sv">{done}</div><div className="sl">Erledigt</div></div>
        <div className="stat"><div className="sv">{total}</div><div className="sl">Gesamt</div></div>
        {done===total&&total>0&&(
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:"6px",
            background:"rgba(63,212,160,.1)",border:"1px solid rgba(63,212,160,.25)",
            borderRadius:"10px",padding:"5px 10px"}}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#3fd4a0" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="2,6.5 5,9.5 11,3.5"/>
            </svg>
            <span style={{fontSize:".6rem",fontWeight:800,color:"#3fd4a0",letterSpacing:"1px",textTransform:"uppercase"}}>Abgeschlossen</span>
          </div>
        )}
        {!(done===total&&total>0)&&<button className="day-banner-change" style={{marginLeft:"auto"}} onClick={onChangeType}>Ändern</button>}
      </div>
      <div className="pbar"><div className="pfill" style={{width:total?(done/total*100)+"%":"0%"}}/></div>
      {showTimer&&<RestTimer onDismiss={()=>setShowTimer(false)} duration={timerDuration}/>}
      <div className="dayhdr" style={{color:plan.color||"var(--txt)"}}>{plan.name.toUpperCase()}</div>
      <div className="daysub">{plan.sections.length} Abschnitte · {plan.sections.reduce((a,s)=>a+s.exercises.length,0)} Übungen</div>
      {plan.sections.map((sec,si)=>(
        <div key={si}>
          <div className="seclbl">{sec.label}</div>
          {sec.exercises.map((ex,ei)=>(
            <ExCard key={ex.id||ei} ex={ex}
              exData={dayData?.sections?.[si]?.[ei]??{}}
              overrides={overrides[`${si}_${ei}`]??{}}
              prs={prs}
              onUpdate={v=>upEx(si,ei,v)}
              onEditSave={v=>saveOverride(si,ei,v)}
              onDelete={()=>{}}
              onSetComplete={handleSetComplete}
              onNewPR={onNewPR}
            />
          ))}
        </div>
      ))}
      <textarea className="notes" placeholder="Notizen zum Training..." value={dayData?.notes??""} onChange={e=>onUpdate({...dayData,notes:e.target.value})}/>
    </div>
  );
}

// ── Plans Page ───────────────────────────────────────────────────────────────
function PlansPage({customPlans, onSavePlans, hiddenDefaults, onToggleDefault}) {
  const [showNew, setShowNew] = useState(false);
  const [editPlan, setEditPlan] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showTemplates, setShowTemplates] = useState(false);

  function toggleDefault(id) {
    onToggleDefault(hiddenDefaults.includes(id)
      ? hiddenDefaults.filter(x=>x!==id)
      : [...hiddenDefaults, id]);
  }

  function savePlan(plan) {
    if(editPlan) {
      onSavePlans(customPlans.map(p=>p.id===plan.id?plan:p));
    } else {
      onSavePlans([...customPlans, plan]);
    }
    setShowNew(false);
    setEditPlan(null);
  }

  function deletePlan(id) {
    onSavePlans(customPlans.filter(p=>p.id!==id));
  }

  const defaultPlans = [];

  return (
    <div className="plans-page">
      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.1rem",fontWeight:900,
        letterSpacing:"3px",textTransform:"uppercase",marginBottom:"6px",color:"var(--txt)"}}>
        Trainingspläne
      </div>
      <div style={{fontSize:".65rem",color:"var(--mut)",fontWeight:600,marginBottom:"18px"}}>
        Wähle beim Training einen Plan aus
      </div>



      {/* Custom plans */}
      {customPlans.length>0&&<>
        <div style={{fontSize:".6rem",letterSpacing:"2px",textTransform:"uppercase",color:"var(--mut)",
          fontWeight:800,margin:"18px 0 8px"}}>Eigene Pläne</div>
        {customPlans.map(p=>(
          <div key={p.id} className="plan-card" style={{animation:"fadeSlideUp .3s cubic-bezier(.25,.46,.45,.94) both"}}>
            <div className="plan-card-hdr">
              <div className="plan-icon" style={{background:(p.color||"#a78bfa")+"22",color:p.color||"#a78bfa",border:"1px solid "+(p.color||"#a78bfa")+"44"}}>{p.icon||p.name[0]}</div>
              <div style={{flex:1}}>
                <div className="plan-card-name" style={{color:p.color||"var(--acc)"}}>{p.name}</div>
                <div className="plan-card-sub">{p.sections?.length||0} Abschnitte · {p.sections?.reduce((a,s)=>a+s.exercises.length,0)||0} Übungen</div>
              </div>
              <div className="plan-actions">
                <button className="plan-btn" onClick={()=>setEditPlan(p)}>✏️</button>
                <button className="plan-btn del" onClick={()=>setConfirmDelete(p)}>✕</button>
              </div>
            </div>
            {p.sections?.map((sec,si)=>(
              <div key={si} style={{padding:"4px 14px 8px",borderTop:"1px solid rgba(255,255,255,.04)"}}>
                <div style={{fontSize:".55rem",letterSpacing:"2px",color:"var(--mut)",fontWeight:800,
                  textTransform:"uppercase",marginBottom:"4px"}}>{sec.label}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"4px"}}>
                  {sec.exercises.map((ex,ei)=>(
                    <div key={ei} className="plan-ex-pill" style={{fontSize:".65rem",fontWeight:700,padding:"3px 8px",
                      background:"rgba(255,255,255,.04)",borderRadius:"6px",border:"1px solid rgba(255,255,255,.06)",
                      color:"var(--acc3)"}}>
                      {ex.name} <span style={{color:"var(--mut)",fontWeight:600}}>{ex.sets}×</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        ))}
      </>}

      <button className="add-plan-btn" onClick={()=>setShowNew(true)}>
        + Neuen Plan erstellen
      </button>

      <button className="add-plan-btn" style={{marginTop:"8px",borderStyle:"solid",borderColor:"rgba(255,255,255,.08)",color:"var(--acc3)"}} onClick={()=>setShowTemplates(true)}>

      </button>

      <div style={{fontSize:".65rem",color:"var(--mut)",textAlign:"center",marginTop:"14px",fontWeight:600,lineHeight:1.6}}>

      </div>

        <div className="modal-bg" onClick={()=>setConfirmDelete(null)}>
          <div className="modal" style={{paddingBottom:"32px"}}>
            <div className="modal-handle"/>

const GYM_CHAINS = [
  "McFit","FitX","clever fit","John Reed","PRIME TIME fitness",
  "Fitness First","Holmes Place","EasyFitness","Elbgym","Meridian Spa",
  "ARES","Mrs.Sporty","Kieser Training","Injoy","Bodystreet",
  "PlusFit","Body + Soul","1Fit","High5","Fit One","Pfitzenmeier",
  "Wellfit","Oyster Sports Club","FitnessLoft","Be-Fit","Gold\'s Gym",
  "Anytime Fitness","Snap Fitness","Stadtbad","Vitafit","Aktiv Sport",
  "Crossfit","Hammer Sport","Workout","Fit & Gesund","Sportfit",
];

function GymPage({ gymName, onSaveGym }) {
  const [input, setInput] = useState(gymName || "");
  const [saved, setSaved] = useState(gymName || "");
  const [suggestions, setSuggestions] = useState([]);
  const [loading, setLoading] = useState(false);
  const debounceRef = useRef(null);
  const mapQuery = encodeURIComponent(saved);

  // Local chain suggestions when typing just the gym name
  function getLocalSuggestions(val) {
    const q = val.toLowerCase();
    return GYM_CHAINS.filter(g => g.toLowerCase().includes(q)).slice(0, 4);
  }

  // Use Claude API to find real gym locations with addresses
  async function searchGyms(text) {
    if (text.length < 3) { setSuggestions(getLocalSuggestions(text)); return; }
    setLoading(true);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 500,
          messages: [{
            role: "user",
            content: `List up to 6 real gym locations matching "${text}" in German-speaking countries. Return ONLY a JSON array of strings like ["McFit München Hauptbahnhof, Bayerstraße 10", "McFit München Schwabing, Leopoldstraße 44"]. No explanation, just the JSON array. If unsure about exact address, use the city and district.`
          }]
        })
      });
      const data = await res.json();
      const text2 = data.content?.[0]?.text || "[]";
      const clean = text2.replace(/`+json|`+/g, "").trim();
      const parsed = JSON.parse(clean);
      if (Array.isArray(parsed) && parsed.length > 0) {
        setSuggestions(parsed);
      } else {
        setSuggestions(getLocalSuggestions(text));
      }
    } catch {
      setSuggestions(getLocalSuggestions(text));
    }
    setLoading(false);
  }

  function handleInput(val) {
    setInput(val);
    setSuggestions([]);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    if (val.length < 2) return;
    // Show local suggestions immediately, then fetch real ones
    setSuggestions(getLocalSuggestions(val));
    debounceRef.current = setTimeout(() => searchGyms(val), 600);
  }

  function selectSuggestion(s) {
    setInput(s);
    setSuggestions([]);
    onSaveGym(s);
    setSaved(s);
  }

  function save() {
    if (!input.trim()) return;
    onSaveGym(input.trim());
    setSaved(input.trim());
    setSuggestions([]);
  }

  return (
    <div style={{ padding: "14px 14px 90px" }}>
      <div style={{ background: "var(--card)", border: "1px solid var(--bdr)", borderRadius: "12px", padding: "14px", marginBottom: "14px" }}>
        <div style={{ fontSize: ".7rem", color: "var(--mut)", letterSpacing: "1.5px", textTransform: "uppercase", marginBottom: "8px" }}>Dein Gym</div>
        <div style={{ display: "flex", gap: "8px" }}>
          <div style={{ flex: 1, position: "relative" }}>
            <input
              style={{ width: "100%", background: "var(--bg)", border: "1px solid var(--bdr)", borderRadius: suggestions.length > 0 ? "8px 8px 0 0" : "8px", color: "var(--txt)", fontFamily: "\'DM Sans\',sans-serif", fontSize: ".9rem", padding: "9px 12px", outline: "none" }}
              placeholder="z.B. FitX München..."
              value={input}
              onChange={e => handleInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && save()}
            />
            {loading && (
              <div style={{ position: "absolute", right: "10px", top: "50%", transform: "translateY(-50%)", fontSize: ".65rem", color: "var(--mut)" }}>Suche...</div>
            )}
            {suggestions.length > 0 && (
              <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "var(--bg)", border: "1px solid var(--bdr)", borderTop: "none", borderRadius: "0 0 8px 8px", zIndex: 50, overflow: "hidden" }}>
                {suggestions.map((s, i) => (
                  <div key={i} onClick={() => selectSuggestion(s)}
                    style={{ padding: "10px 12px", cursor: "pointer", borderBottom: i < suggestions.length - 1 ? "1px solid var(--bdr)" : "none", display: "flex", alignItems: "center", gap: "10px" }}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                    <div style={{ fontSize: ".78rem", color: "var(--txt)" }}>{s}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
          <button onClick={save} className="gym-ok-btn"
            style={{ background: "var(--acc)", color: "#111", border: "none", borderRadius: "8px", fontFamily: "\'Bebas Neue\',sans-serif", fontSize: ".9rem", letterSpacing: "2px", padding: "9px 14px", cursor: "pointer", flexShrink: 0 }}>
            OK
          </button>
        </div>
        {saved && <div style={{ fontSize: ".65rem", color: "var(--grn)", marginTop: "8px" }}>Gespeichert: {saved}</div>}
      </div>

      {!saved && (
        <div style={{ background: "var(--card)", border: "1px solid var(--bdr)", borderRadius: "12px", padding: "20px", textAlign: "center" }}>
          <div style={{ fontSize: "2rem", marginBottom: "8px" }}>🏋️</div>
          <div style={{ fontSize: ".85rem", fontWeight: 600, marginBottom: "4px", color: "var(--txt)" }}>Gym-Auslastung</div>
          <div style={{ fontSize: ".72rem", lineHeight: 1.6, color: "var(--mut)" }}>Tippe deinen Gym-Namen ein — ich suche automatisch nach echten Standorten mit Adresse.</div>
        </div>
      )}

      {saved && (
        <div style={{ background: "var(--card)", border: "1px solid var(--bdr)", borderRadius: "12px", padding: "16px" }}>
          <div style={{ fontSize: ".8rem", fontWeight: 600, marginBottom: "4px" }}>{saved}</div>
          <div style={{ fontSize: ".65rem", color: "var(--mut)", marginBottom: "14px" }}>Tippe um die Live-Auslastung in Google Maps zu sehen</div>
          <a href={`https://www.google.com/maps/search/${mapQuery}`} target="_blank" rel="noopener noreferrer"
            className="maps-btn"
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "8px", background: "var(--acc)", color: "#111", borderRadius: "10px", padding: "13px", fontFamily: "\'Bebas Neue\',sans-serif", fontSize: "1rem", letterSpacing: "3px", textDecoration: "none" }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            IN GOOGLE MAPS ÖFFNEN
          </a>
          <div style={{ fontSize: ".6rem", color: "var(--mut)", textAlign: "center", marginTop: "8px" }}>Öffnet Safari mit Live-Auslastung & Stoßzeiten</div>

    </div>
  );
}

  {id:"pr_5", icon:"💥", name:"5 PRs", desc:"5 Persönliche Rekorde gesetzt"},
  {id:"volume_1t", icon:"📦", name:"1 Tonne", desc:"1.000 kg Volumen in einem Training"},
  {id:"volume_total", icon:"🚀", name:"10 Tonnen", desc:"10.000 kg Gesamtvolumen"},
];

function getEarnedAchievements(allDays, prs) {
  const earned = new Set();
  let totalSessions = 0, maxStreak = 0, curStreak = 0, totalVol = 0;
  const sorted = Object.entries(allDays).filter(([,d])=>d?.type&&d.type!=="rest").sort(([a],[b])=>a.localeCompare(b));
  let lastDate = null;
  sorted.forEach(([dk, di]) => {
    totalSessions++;
    const d = new Date(dk);
    if (lastDate) {
      const diff = (d - lastDate) / 86400000;
      if (diff <= 1.5) curStreak++; else curStreak = 1;
    } else curStreak = 1;
    maxStreak = Math.max(maxStreak, curStreak);
    lastDate = d;
    let sessionVol = 0;
    if (di.sections) Object.values(di.sections).forEach(sec => Object.values(sec).forEach(ex => Object.values(ex).forEach(s => { if(s.w&&s.r) { totalVol+=parseFloat(s.w)*parseFloat(s.r); sessionVol+=parseFloat(s.w)*parseFloat(s.r); } })));
    if (sessionVol >= 1000) earned.add("volume_1t");
  });
  if (totalSessions >= 1) earned.add("first_session");
  if (maxStreak >= 3) earned.add("week_3");
  if (maxStreak >= 7) earned.add("week_7");
  if (totalSessions >= 10) earned.add("sessions_10");
  if (totalSessions >= 25) earned.add("sessions_25");
  if (totalSessions >= 50) earned.add("sessions_50");
  if (totalVol >= 10000) earned.add("volume_total");
  const prCount = Object.keys(prs).length;
  if (prCount >= 1) earned.add("first_pr");
  if (prCount >= 5) earned.add("pr_5");
  return earned;
}

// ── Weekly Review ─────────────────────────────────────────────────────────────
function WeeklyReview({ allDays, prs }) {
  const weekStart = getWeekStart(today());
  const weekDays = Array.from({length:7},(_,i)=>{ const d=new Date(weekStart); d.setDate(d.getDate()+i); return dateKey(d); });
  const weekSessions = weekDays.filter(dk=>allDays[dk]?.type&&allDays[dk].type!=="rest");
  let weekVol = 0, weekPRs = 0;
  weekSessions.forEach(dk=>{
    const di=allDays[dk];
    if(di?.sections) Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>Object.values(ex).forEach(s=>{if(s.w&&s.r) weekVol+=parseFloat(s.w)*parseFloat(s.r);})));
  });
  const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const lastWeekDays = Array.from({length:7},(_,i)=>{ const d=new Date(lastWeekStart); d.setDate(d.getDate()+i); return dateKey(d); });
  const lastWeekSessions = lastWeekDays.filter(dk=>allDays[dk]?.type&&allDays[dk].type!=="rest").length;
  const diff = weekSessions.length - lastWeekSessions;

  return (
    <div className="review-card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div className="review-title">Diese Woche</div>
          <div className="review-sub">{weekStart.toLocaleDateString("de-DE",{day:"numeric",month:"long"})} – heute</div>
        </div>
        {diff!==0&&<div style={{fontSize:".65rem",fontWeight:800,padding:"4px 10px",borderRadius:"10px",
          background:diff>0?"rgba(134,239,172,.15)":"rgba(248,113,113,.15)",
          color:diff>0?"var(--grn)":"var(--red)"}}>
          {diff>0?"+":""}{diff} vs letzte Woche
        </div>}
      </div>
      <div className="review-stats">
        <div><div className="review-stat-val">{weekSessions.length}</div><div className="review-stat-lbl">Trainings</div></div>
        <div><div className="review-stat-val">{Math.round(weekVol/1000*10)/10}t</div><div className="review-stat-lbl">Volumen</div></div>
        <div><div className="review-stat-val">{7-weekSessions.length}</div><div className="review-stat-lbl">Ruhetage</div></div>
      </div>
      <div style={{display:"flex",gap:"4px"}}>
        {weekDays.map((dk,i)=>{
          const di=allDays[dk]; const isToday=dk===dateKey(today());
          const isFuture=dk>dateKey(today());
          return <div key={dk} style={{flex:1,height:"6px",borderRadius:"3px",
            background:isFuture?"var(--bdr)":di?.type&&di.type!=="rest"?"var(--acc)":di?.type==="rest"?"var(--mut)":"var(--bdr2)",

    </div>
  );
}

    if(type==="A") return "#7dd3fc";

    return "var(--acc)";

  function getPlanName(type) {
    if(type==="A") return "Tag A \u2013 Brust & R\u00FCcken";
    if(type==="B") return "Tag B \u2013 Schulter & Arme";
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.name||"Eigener Plan";
    return type;
  }
  function getPlanSections(type) {
    if(type==="A") return DEFAULT_PLAN[0].sections;

    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.sections||null;

function HistoryPage({ allDays, customPlans }) {
  const [selected, setSelected] = useState(null);
  const entries = Object.entries(allDays).filter(([,d])=>d?.type&&d.type!=="rest").sort(([a],[b])=>b.localeCompare(a)).slice(0,60);
  function getPlanColor(type){if(type==="A") return "#7dd3fc";if(type==="B") return "#86efac";if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.color||"#a78bfa";return "var(--acc)";}
  function getPlanName(type){if(type==="A") return "Tag A";if(type==="B") return "Tag B";if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.name||"Eigener Plan";return type;}
  function getPlanSections(type){if(type==="A") return DEFAULT_PLAN[0].sections;if(type==="B") return DEFAULT_PLAN[1].sections;if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.sections||null;return null;}
  function getStats(di){
    let vol=0,done=0,total=0;
    if(di?.sections) Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>Object.values(ex).forEach(s=>{if(s.w&&s.r) vol+=parseFloat(s.w)*parseFloat(s.r);})));
    const secs=getPlanSections(di?.type);
    if(secs&&di?.sections){secs.forEach((sec,si)=>sec.exercises.forEach((ex,ei)=>{const ov=di.overrides?.[`${si}_${ei}`];const effSets=ov?.sets??ex.sets;const exData=di.sections?.[si]?.[ei]??{};total+=effSets;for(let i=0;i<effSets;i++){const s=exData[i]??{};if(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0) done++;}}));}
    else if(di?.sections){Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>{Object.values(ex).forEach(s=>{if(typeof s==="object"&&s.w!==undefined){total++;if(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0) done++;}});}));}
    return {vol:Math.round(vol),done,total,progress:total>0?Math.round(done/total*100):0};
  }

  if(selected) return <TrainingDetailView dk={selected[0]} di={selected[1]} customPlans={customPlans} onBack={()=>setSelected(null)} backLabel="Zum Verlauf"/>;

  return (
    <div>
      {entries.length===0&&<div className="no-data" style={{padding:"30px"}}>Noch keine Trainings</div>}
      {entries.map(([dk,di])=>{
        const {vol,done,total,progress}=getStats(di);
        const planColor=getPlanColor(di.type);
        return (
          <div key={dk} className="history-entry" onClick={()=>setSelected([dk,di])}>
            <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:planColor,flexShrink:0}}/>
              <div style={{flex:1}}>
                <div className="history-date">{new Date(dk+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>
                <div className="history-title" style={{color:planColor}}>{getPlanName(di.type)}</div>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
            <div style={{marginTop:"8px",paddingLeft:"18px"}}>
              <div style={{height:3,background:"rgba(255,255,255,.07)",borderRadius:2,overflow:"hidden",marginBottom:"6px"}}><div style={{height:"100%",width:progress+"%",background:planColor,borderRadius:2}}/></div>
              <div className="history-meta">
                <div className="history-stat">Saetze: <span>{done}/{total}</span></div>
                {vol>0&&<div className="history-stat">Volumen: <span>{vol} kg</span></div>}
                <div className="history-stat">Erledigt: <span style={{color:progress===100?"var(--grn)":planColor}}>{progress}%</span></div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Login({onLogin}) {
  const [mode,setMode]=useState("login");
  const [username,setUsername]=useState("");
  const [pin,setPin]=useState("");
  const [pin2,setPin2]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  async function submit() {
    const u=username.trim().toLowerCase();
    if(!u||!pin){setErr("Bitte alle Felder ausfüllen.");return;}
    setBusy(true);setErr("");setOk("");

    if(mode==="register"){
      if(pin.length<4){setErr("PIN mind. 4 Zeichen.");setBusy(false);return;}
      if(pin!==pin2){setErr("PINs stimmen nicht überein.");setBusy(false);return;}
      const exists=await dbLoad("auth_"+u);
      if(exists){setErr("Benutzername vergeben.");setBusy(false);return;}
      const hash=await hashPin(pin);
      await dbSave("auth_"+u,{hash});
      await dbSave("days_"+u,{});
      setOk("Konto erstellt!");
      setTimeout(()=>onLogin(u,{},{},{},3,[],90),700);
    } else {
      const rec=await dbLoad("auth_"+u);
      if(!rec){setErr("Benutzer nicht gefunden.");setBusy(false);return;}
      const hash=await hashPin(pin);
      if(hash!==rec.hash){setErr("Falscher PIN.");setBusy(false);return;}
      const [days,prs,cex,wg,bw,td]=await Promise.all([
        dbLoad("days_"+u).then(v=>v??{}),
        dbLoad("prs_"+u).then(v=>v??{}),
        dbLoad("cex_"+u).then(v=>v??{}),
        dbLoad("wgoal_"+u).then(v=>v??3),
        dbLoad("bw_"+u).then(v=>v??[]),
        dbLoad("timer_"+u).then(v=>v??90),
      ]);
      onLogin(u,days,prs,cex,wg,bw,td);
    }
    setBusy(false);
  }

  return (
    <div className="lw">
      <div className="lc">
        <div className="logo">GYM LOG</div>
        <div className="logo-sub">Dein Trainingsplan</div>
        <div className="ltabs">
          <button className={`ltab${mode==="login"?" on":""}`} onClick={()=>{setMode("login");setErr("");}}>Login</button>
          <button className={`ltab${mode==="register"?" on":""}`} onClick={()=>{setMode("register");setErr("");}}>Registrieren</button>
        </div>

        <div className="fld"><label>Benutzername</label><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="z.B. max123" autoComplete="username" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        <div className="fld"><label>PIN</label><input value={pin} onChange={e=>setPin(e.target.value)} type="password" placeholder="Mind. 4 Zeichen" autoComplete={mode==="login"?"current-password":"new-password"} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {mode==="register"&&<div className="fld"><label>PIN bestaetigen</label><input value={pin2} onChange={e=>setPin2(e.target.value)} type="password" placeholder="PIN wiederholen" autoComplete="new-password" onKeyDown={e=>e.key==="Enter"&&submit()}/></div>}
        {err&&<div className="merr">{err}</div>}
        {ok&&<div className="mok">{ok}</div>}
        <button className="pbtn" disabled={busy} onClick={submit}>{busy?"...":mode==="login"?"EINLOGGEN":"REGISTRIEREN"}</button>
      </div>
    </div>
  );
}

function SwipeNav({ view, setView }) {
  const navRef = useRef(null);
  const pillRef = useRef(null);
  const drag = useRef({ active:false, startX:0, startY:0, startPct:0, moved:false });
  const activeIdx = NAV_ITEMS.findIndex(i => i.key === view);
  const n = NAV_ITEMS.length;

  function getPillPos(idx) {
    // Returns left% and width% for pill at given index
    const w = 100 / n;
    return { left: idx * w, width: w };
  }

  function setPillStyle(left, animate) {
    const pill = pillRef.current;
    if (!pill) return;
    const w = 100 / n;
    pill.style.transition = animate
      ? "left .32s cubic-bezier(.34,1.2,.64,1)"
      : "none";
    pill.style.left = left + "%";
    pill.style.width = w + "%";
  }

  // Snap to current view on mount and view change
  useEffect(() => {
    setTimeout(() => {
      const { left } = getPillPos(activeIdx);
      setPillStyle(left, true);
    }, 30);
  }, [view]);

  // Attach touch listeners to the whole nav bar
  useEffect(() => {
    const bar = navRef.current;
    if (!bar) return;
    const w = 100 / n;

    function onStart(e) {
      drag.current.active = false; // don't start drag yet - wait for move
      drag.current.startX = e.touches[0].clientX;
      drag.current.startY = e.touches[0].clientY;
      drag.current.startPct = activeIdx * w;
      drag.current.moved = false;
    }

    function onMove(e) {
      const absDx = Math.abs(e.touches[0].clientX - drag.current.startX);
      const absDy = Math.abs(e.touches[0].clientY - drag.current.startY);
      if (!drag.current.active && absDx > 8 && absDx > absDy * 1.5) {
        drag.current.active = true;
        drag.current.moved = true;
        setPillStyle(drag.current.startPct, false);
      }
      if (!drag.current.active) return;
      e.preventDefault();
      const barW = bar.getBoundingClientRect().width;
      const dx = e.touches[0].clientX - drag.current.startX;
      const dPct = (dx / barW) * 100;
      const minLeft = 0;
      const maxLeft = (n - 1) * w;
      const newLeft = Math.max(minLeft, Math.min(maxLeft, drag.current.startPct + dPct));
      setPillStyle(newLeft, false);
    }

    function onEnd(e) {
      if (!drag.current.moved) {
        // It was a tap - find which button was tapped by X position
        const barRect = bar.getBoundingClientRect();
        const tapX = e.changedTouches[0].clientX - barRect.left;
        const tapIdx = Math.max(0, Math.min(n-1, Math.floor(tapX / barRect.width * n)));
        setPillStyle(tapIdx * w, true);
        setView(NAV_ITEMS[tapIdx].key);
        drag.current.active = false;
        return;
      }
      if (!drag.current.active) return;
      drag.current.active = false;
      drag.current.moved = false;
      const barW = bar.getBoundingClientRect().width;
      const dx = e.changedTouches[0].clientX - drag.current.startX;
      const dPct = (dx / barW) * 100;
      const rawIdx = drag.current.startPct / w + dPct / w;
      const newIdx = Math.max(0, Math.min(n - 1, Math.round(rawIdx)));
      setPillStyle(newIdx * w, true);
      setView(NAV_ITEMS[newIdx].key);
    }

    bar.addEventListener("touchstart", onStart, { passive: false });
    bar.addEventListener("touchmove", onMove, { passive: false });
    bar.addEventListener("touchend", onEnd, { passive: false });
    return () => {
      bar.removeEventListener("touchstart", onStart);
      bar.removeEventListener("touchmove", onMove);
      bar.removeEventListener("touchend", onEnd);
    };
  }, [view, activeIdx, setView]);

  return (
    <div className="bnav">
      <div className="bnav-inner" ref={navRef}>
        <div ref={pillRef} className="bnav-glass-pill" style={{
          position:"absolute", top:0, bottom:0,
          width: (100/n)+"%",
          left: (activeIdx * 100/n)+"%",
          borderRadius:"20px",
        }}/>
        {NAV_ITEMS.map(item => (
          <button key={item.key}
            className={`bnav-btn${view===item.key?" on":""}`}
            onClick={() => setView(item.key)}>
            {item.icon}
            <span>{item.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

    // Otherwise follow system
    return !window.matchMedia('(prefers-color-scheme: light)').matches;
  });
  const [view,setView]=useState("log");
  const [showPicker,setShowPicker]=useState(false);
  const [saveStatus,setSaveStatus]=useState("ok");
  const saveTimer=useRef(null);

  // Listen for system dark/light mode changes — only if user never manually set it
  useEffect(()=>{
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    function handleChange(e) {
      const saved = user ? localStorage.getItem("gymlog_dark_"+user) : localStorage.getItem("gymlog_dark_guest");
      if (saved === null || saved === undefined) {
        setDarkMode(!e.matches);
      }
      // If user manually set it — ignore system changes completely
    }
    mq.addEventListener('change', handleChange);
    return () => mq.removeEventListener('change', handleChange);
  }, [user]);

  useEffect(()=>{
    // Try to restore last session from localStorage
    try {
      const session=JSON.parse(localStorage.getItem("gymlog_session")||"null");
      if(session?.username){
        const u=session.username;
        const auth=JSON.parse(localStorage.getItem("gymlog_auth_"+u)||"null");
        if(auth){
          setUser(u);
          setAllDays(JSON.parse(localStorage.getItem("gymlog_days_"+u)||"{}"));
          setPrs(JSON.parse(localStorage.getItem("gymlog_prs_"+u)||"{}"));
          setCustomEx(JSON.parse(localStorage.getItem("gymlog_cex_"+u)||"{}"));
          setWeekGoal(JSON.parse(localStorage.getItem("gymlog_wgoal_"+u)||"3"));
          setBodyWeights(JSON.parse(localStorage.getItem("gymlog_bw_"+u)||"[]"));
          setTimerDuration(JSON.parse(localStorage.getItem("gymlog_timer_"+u)||"90"));

          setCustomPlans(JSON.parse(localStorage.getItem("gymlog_cplans_"+u)||"[]"));
          setHiddenDefaults(JSON.parse(localStorage.getItem("gymlog_hdef_"+u)||"[]"));
          setGymName(localStorage.getItem("gymlog_gym_"+u)||"");
          const savedDark = localStorage.getItem("gymlog_dark_"+u);
          const guestDark = localStorage.getItem("gymlog_dark_guest");
          if (savedDark !== null) {
            // User had a saved preference
            setDarkMode(JSON.parse(savedDark));
          } else if (guestDark !== null) {
            // Transfer guest manual setting to user
            setDarkMode(JSON.parse(guestDark));
            localStorage.setItem("gymlog_dark_"+u, guestDark);
            localStorage.removeItem("gymlog_dark_guest");
          } else {
            // No preference saved — follow system
            setDarkMode(!window.matchMedia('(prefers-color-scheme: light)').matches);
          }
          setStatus("app");return;
        }
      }
    } catch {}
    setStatus("login");
  },[]);

  function handleLogin(u,days,prData,cex,wg,bw,td) {
    localStorage.setItem("gymlog_session",JSON.stringify({username:u}));
    setUser(u);setAllDays(days);setPrs(prData);setCustomEx(cex);
    setWeekGoal(wg);setBodyWeights(bw);setTimerDuration(td);
    setStatus("app");
  }
  function handleLogout() {
    localStorage.removeItem("gymlog_session");
    setUser(null);setAllDays({});setPrs({});setCustomEx({});
    setWeekGoal(3);setBodyWeights([]);setTimerDuration(90);setCustomPlans([]);setHiddenDefaults([]);setDarkMode(true);setStatus("login");
  }

  function save(key,val) {
    localStorage.setItem("gymlog_"+key,JSON.stringify(val));
    dbSave(key,val); // also persist to indexedDB via dbSave
  }

  function debounce(fn){setSaveStatus("ing");if(saveTimer.current) clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>{fn();setSaveStatus("ok");},600);}
  function saveDays(next){setAllDays(next);debounce(()=>save("days_"+user,next));}
  function savePrs(next){setPrs(next);save("prs_"+user,next);}
  function saveCustomEx(next){setCustomEx(next);save("cex_"+user,next);}
  function saveWeekGoal(v){setWeekGoal(v);save("wgoal_"+user,v);}
  function saveBW(next){setBodyWeights(next);save("bw_"+user,next);}
  function saveTimerDuration(v){setTimerDuration(v);save("timer_"+user,v);}

  function saveCustomPlans(next){setCustomPlans(next);localStorage.setItem("gymlog_cplans_"+user,JSON.stringify(next));save("cplans_"+user,next);}

  function handleOnboardTemplate(tmpl) {
    const newPlans = tmpl.plans.map(p=>({...p, id:"tmpl_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)}));
    saveCustomPlans(newPlans);
    setShowOnboarding(false);
    // Immediately open picker so user can assign the plan to today
    setTimeout(() => setShowPicker(true), 200);
  }

  function handleOnboardCreateOwn() {
    setShowOnboarding(false);
    setView("plans");
  }
  function saveGymName(v){setGymName(v);localStorage.setItem("gymlog_gym_"+user,v);}
  function saveHiddenDefaults(next){setHiddenDefaults(next);localStorage.setItem("gymlog_hdef_"+user,JSON.stringify(next));}
  function toggleDarkMode(){
    const next=!darkMode;
    setDarkMode(next);
    // Save to localStorage with user key or guest key — marks as manually overridden
    const key = user ? "gymlog_dark_"+user : "gymlog_dark_guest";
    localStorage.setItem(key, JSON.stringify(next));
  }

  const dk=dateKey(selectedDate);
  const dayInfo=allDays[dk];
  const planIdx=dayInfo?.type==="A"?0:dayInfo?.type==="B"?1:null;
  const customPlanData = dayInfo?.type?.startsWith("custom_") ? customPlans.find(p=>"custom_"+p.id===dayInfo.type) : null;
  const isToday=dk===dateKey(today());

  function setDayType(type){saveDays({...allDays,[dk]:{...(allDays[dk]??{}),type}});setShowPicker(false);}
  function updateDayData(data){saveDays({...allDays,[dk]:{...(allDays[dk]??{}),...data}});}
  function handleNewPR(exId,weight){if(!prs[exId]||weight>prs[exId]) savePrs({...prs,[exId]:weight});}

  if(status==="boot") return (
    <>
      <style>{CSS}</style>

```
  <div className="loading">
    <div className="loading-logo">GYM LOG</div>
    <div className="loading-sub">Laden...</div>
  </div>
</>
```

);
if(status===“login”) return <><style>{CSS}</style><Login onLogin={handleLogin}/></>;

return (
<>
<style>{CSS}</style>
<div className=“app” ref={el=>{
if(el){
document.body.classList.toggle(‘light’,!darkMode);
// PWA fullscreen meta tags
let m1=document.querySelector(‘meta[name=“apple-mobile-web-app-capable”]’);
if(!m1){m1=document.createElement(‘meta’);m1.name=‘apple-mobile-web-app-capable’;document.head.appendChild(m1);}
m1.content=‘yes’;
let m2=document.querySelector(‘meta[name=“apple-mobile-web-app-status-bar-style”]’);
if(!m2){m2=document.createElement(‘meta’);m2.name=‘apple-mobile-web-app-status-bar-style’;document.head.appendChild(m2);}
m2.content=‘black-translucent’;
}
}}>
{showOnboarding && (
<OnboardingModal
onSelectTemplate={handleOnboardTemplate}
onCreateOwn={handleOnboardCreateOwn}
/>
)}
<header>
<div className="hlogo">GYM LOG</div>
<div className="dot"/>
<button onClick={toggleDarkMode} style={{background:“none”,border:“1px solid rgba(255,255,255,.1)”,borderRadius:“8px”,padding:“4px 8px”,cursor:“pointer”,fontSize:”.75rem”,color:“var(–mut)”,transition:“all .2s”}}>{darkMode?“☀️”:“🌙”}</button>
<div className="upill">
<div className="uav">{user[0].toUpperCase()}</div>
<div className="uname">{user}</div>
<button className="logoutbtn" onClick={handleLogout}>Logout</button>
</div>
</header>

```
    {view==="cal"?(
      <CalendarView allDays={allDays} selectedDate={selectedDate} onSelectDate={d=>{setSelectedDate(d);setView("log");}} customPlans={customPlans} onDeleteDay={dk=>{const next={...allDays};delete next[dk];saveDays(next);}}/>
    ):view==="stats"?(
      <StatsPage allDays={allDays} prs={prs} bodyWeights={bodyWeights} onSaveBW={saveBW} weekGoal={weekGoal} onSetWeekGoal={saveWeekGoal} timerDuration={timerDuration} onSetTimerDuration={saveTimerDuration} customPlans={customPlans} onSavePlans={saveCustomPlans}/>
    ):view==="gym"?(
      <GymPage gymName={gymName} onSaveGym={saveGymName}/>
    ):view==="plans"?(
      <PlansPage customPlans={customPlans} onSavePlans={saveCustomPlans} hiddenDefaults={hiddenDefaults} onToggleDefault={saveHiddenDefaults}/>

    ):(
      <>
        <div style={{padding:"12px 14px 0"}}>
          <div className="day-banner">
            <div>
              <div className="day-banner-date">{isToday?"Heute":selectedDate.toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</div>
              <div style={{fontSize:".63rem",color:"var(--mut)",marginTop:"2px"}}>{selectedDate.toLocaleDateString("de-DE",{weekday:"long"})}</div>
            </div>
            <div className="day-banner-info">
              {dayInfo?.type==="A"&&<><div className="day-banner-tag" style={{color:"var(--ga)"}}>TAG A</div><div className="day-banner-sub">Brust & Rücken</div></>}
              {dayInfo?.type==="B"&&<><div className="day-banner-tag" style={{color:"var(--gb)"}}>TAG B</div><div className="day-banner-sub">Schulter & Arme</div></>}
              {dayInfo?.type==="rest"&&<div className="day-banner-tag" style={{color:"var(--mut)"}}>Ruhetag</div>}
              {dayInfo?.type?.startsWith("custom_")&&customPlanData&&<><div className="day-banner-tag" style={{color:customPlanData.color||"var(--acc)"}}>{customPlanData.name.toUpperCase()}</div><div className="day-banner-sub">Eigener Plan</div></>}
              {!dayInfo?.type&&<div className="day-banner-sub">Kein Training geplant</div>}
            </div>
            <button className="day-banner-change" onClick={()=>{
              if(!dayInfo?.type && customPlans.length===0) setShowOnboarding(true);
              else setShowPicker(true);
            }}>{dayInfo?.type?"Ändern":"+ Planen"}</button>
          </div>
          <div className="savebar">
            <span className={`savetxt ${saveStatus}`}>{saveStatus==="ing"?"Speichert…":"Gespeichert"}</span>
          </div>
        </div>
        {planIdx!==null?(
          <TrainingPage planIdx={planIdx} dayData={dayInfo} customExercises={customEx} onUpdate={updateDayData} onUpdateCustom={saveCustomEx} onChangeType={()=>setShowPicker(true)} prs={prs} onNewPR={handleNewPR} timerDuration={timerDuration} allDays={allDays} currentDk={dk}/>
        ):customPlanData?(
          <CustomTrainingPage plan={customPlanData} dayData={dayInfo} onUpdate={updateDayData} onChangeType={()=>setShowPicker(true)} prs={prs} onNewPR={handleNewPR} timerDuration={timerDuration}/>
        ):dayInfo?.type==="rest"?(
          <div className="rest-wrap">
            <div style={{fontSize:"3rem"}}>💤</div>
            <div className="rest-title">Ruhetag</div>
            <div style={{fontSize:".78rem",color:"var(--mut)",textAlign:"center"}}>Morgen wieder Gas geben!</div>
            <button className="day-banner-change" style={{marginTop:"8px"}} onClick={()=>setShowPicker(true)}>Ändern</button>
          </div>
        ):(
          <div className="noday-wrap">
            <div style={{fontSize:"2.5rem"}}>📅</div>
            <div className="noday-title">Kein Training</div>
            <div className="noday-sub">Wähle einen Trainingstyp oder markiere als Ruhetag.</div>
            <button className="pbtn" style={{width:"auto",padding:"11px 28px",marginTop:"8px"}} onClick={()=>{
            if(customPlans.length===0) setShowOnboarding(true);
            else setShowPicker(true);
          }}>+ Tag planen</button>
          </div>
        )}
      </>
    )}

    <SwipeNav view={view} setView={setView} />

    {showPicker&&<DayPickerModal date={selectedDate} current={dayInfo?.type} onSelect={setDayType} onClose={()=>setShowPicker(false)} customPlans={customPlans} hiddenDefaults={hiddenDefaults}/>}
  </div>
</>
```

);
}

ReactDOM.createRoot(document.getElementById(‘root’)).render(React.createElement(App));
</script>

</body>
</html>
