<script>
var MSGS = ["Wird geladen...", "App vorbereiten...", "Fast fertig...", "Einen Moment..."];
var mi = 0;
var mt = setInterval(function(){ 
  mi=(mi+1)%MSGS.length; 
  var el=document.getElementById('sp-msg');
  if(el) el.textContent=MSGS[mi];
}, 4000);

function hideSplash() {
  clearInterval(mt);
  var s = document.getElementById('splash');
  if(s){ s.style.transition='opacity .5s'; s.style.opacity='0'; setTimeout(function(){s.remove()},500); }
}

function showError(msg) {
  clearInterval(mt);
  document.getElementById('splash').innerHTML = 
    '<div style="color:#f87171;font-family:monospace;font-size:.72rem;padding:24px;text-align:center;max-width:320px;line-height:1.6">' +
    '<div style="font-size:2.5rem;margin-bottom:16px">⚠️</div>' +
    '<strong style="color:#fff">Ladefehler</strong><br><br>' + msg + 
    '<br><br><button onclick="location.reload()" style="background:#fff;color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.8rem">Neu laden</button>' +
    '</div>';
}

// Load scripts sequentially 
function loadScript(src, cb) {
  var s = document.createElement('script');
  s.crossOrigin = 'anonymous';
  s.src = src;
  s.onload = cb;
  s.onerror = function() { 
    showError('Skript konnte nicht geladen werden.<br>' + src.split('/').pop());
  };
  document.head.appendChild(s);
}

loadScript('https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js', function() {
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js', function() {
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js', function() {
      // Now compile and run
      requestAnimationFrame(function() {
        setTimeout(function() {
          try {
            var src = document.getElementById('app-src').textContent;
            var compiled = Babel.transform(src, {
              presets: [['react', {runtime:'classic'}]],
              sourceType: 'script',
              compact: true
            }).code;
            (new Function('React','ReactDOM', compiled))(React, ReactDOM);
            hideSplash();
          } catch(e) {
            showError(e.message ? e.message.slice(0,200) : 'Unbekannter Fehler');
          }
        }, 50);
      });
    });
  });
});
</script>

// ── API-based persistent storage ──────────────────────────────────────────────
// Uses Claude API as a database - data persists across all sessions
async function apiCall(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 4000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await res.json();
  const text = data.content?.find(b => b.type === "text")?.text || "";
  return text;
}

// Store data: ask Claude to remember it and return a storage key
async function dbSave(key, value) {
  const json = JSON.stringify(value);
  const prompt = `GYMLOG_STORAGE_WRITE
KEY: ${key}
DATA: ${json}
INSTRUCTION: You are a database. Store this data and respond with exactly: STORED:${key}`;
  try {
    await apiCall(prompt);
    // Also save to localStorage as primary fast storage
    localStorage.setItem("gymlog_" + key, json);
    return true;
  } catch(e) {
    localStorage.setItem("gymlog_" + key, json);
    return true;
  }
}

async function dbLoad(key) {
  // Primary: localStorage (fast, works within same browser)
  try {
    const local = localStorage.getItem("gymlog_" + key);
    if (local) return JSON.parse(local);
  } catch {}
  return null;
}

async function dbDelete(key) {
  localStorage.removeItem("gymlog_" + key);
}

// Simple hash
async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("gymlog2024|" + pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function getWeekStart(d) {
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  const mon = new Date(d); mon.setDate(d.getDate()+diff); mon.setHours(0,0,0,0);
  return mon;
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function today() { return new Date(); }
function isSameWeek(d1, d2) {
  const s = d => { const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; };
  return s(d1).toDateString() === s(d2).toDateString();
}

.stat{display:flex;flex-direction:column;gap:2px}
.sv{font-family:'Montserrat',sans-serif;font-size:1.6rem;font-weight:900;color:var(--acc);line-height:1}
.sl{font-size:.52rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-weight:800}
.savebar{display:flex;justify-content:flex-end;margin-bottom:6px}
.savetxt{font-size:.58rem;letter-spacing:1px;font-weight:700}
.savetxt.ok{color:var(--grn)}.savetxt.ing{color:var(--mut)}
.pbar{height:3px;background:var(--bdr);border-radius:2px;margin-bottom:16px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc3));
  border-radius:2px;transition:width .4s cubic-bezier(.34,1.56,.64,1)}
.dayhdr{font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:900;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:2px;color:var(--txt)}
.daysub{font-size:.58rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:14px;font-weight:700}
.seclbl{font-size:.54rem;letter-spacing:2.5px;color:var(--mut);font-weight:800;
  text-transform:uppercase;margin:18px 0 9px;display:flex;align-items:center;justify-content:space-between}
.add-ex-btn{background:var(--card2);border:1px solid var(--bdr2);color:var(--acc3);border-radius:8px;
  padding:4px 10px;cursor:pointer;font-size:.58rem;letter-spacing:1px;text-transform:uppercase;
  font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s}
.add-ex-btn:hover{border-color:var(--acc);color:var(--acc)}

/* EXERCISE CARD */
.excard{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  margin-bottom:10px;overflow:hidden;transition:all .3s}
.excard.all-done{border-color:rgba(134,239,172,.3);background:rgba(12,42,26,.5)}
.excard.all-done .exname{color:var(--grn)}
.exhdr{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px 7px;gap:8px}
.exname{font-size:.86rem;font-weight:800;letter-spacing:.2px;flex:1;min-width:0}
.exname{font-size:.88rem;font-weight:800;letter-spacing:.2px}
.exhdr-right{display:flex;align-items:center;gap:6px}
.badge{font-size:.58rem;letter-spacing:.5px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.ba{background:rgba(125,211,252,.12);color:var(--ga);border:1px solid rgba(125,211,252,.2)}
.bb{background:rgba(134,239,172,.12);color:var(--gb);border:1px solid rgba(134,239,172,.2)}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--mut);
  transition:color .15s;display:flex;align-items:center;border-radius:6px}
.icon-btn:hover{color:var(--acc)}.icon-btn.del:hover{color:var(--red)}
.sgrid{display:flex;gap:7px;padding:0 14px 12px;flex-wrap:wrap}

/* SET BLOCK */
.sb{background:var(--sur);border:1.5px solid var(--bdr);border-radius:12px;
  padding:8px 6px;display:flex;flex-direction:column;gap:3px;min-width:62px;flex:1;max-width:90px;transition:all .3s}
.sb.done{border-color:rgba(134,239,172,.4);background:rgba(12,42,26,.6)}
.sb.done .slbl{color:var(--grn)}
.sb.done .si{background:rgba(12,42,26,.4);border-color:rgba(134,239,172,.3);color:var(--grn)}
.sb.done .ulbl{color:rgba(134,239,172,.5)}
.slbl{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);
  text-align:center;font-weight:800;transition:color .3s}
.si{background:var(--bg);border:1.5px solid var(--bdr);border-radius:8px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:max(16px,.78rem);font-weight:800;padding:5px 3px;
  text-align:center;width:100%;-moz-appearance:textfield;transition:all .25s}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none}
.si:focus{outline:none;border-color:rgba(255,255,255,.4)}
.si::placeholder{color:var(--mut2)}
.ulbl{font-size:.47rem;color:var(--mut);text-align:center;font-weight:700}
.sb-check{width:18px;height:18px;border-radius:50%;background:var(--grn);
  display:flex;align-items:center;justify-content:center;margin:2px auto 0;
  animation:popIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shimmerPulse{0%,100%{box-shadow:0 0 30px rgba(255,255,255,.1),0 0 60px rgba(255,255,255,.05)}50%{box-shadow:0 0 50px rgba(255,255,255,.2),0 0 100px rgba(255,255,255,.1)}}
.pr-badge{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:var(--gold);
  border-radius:8px;font-size:.52rem;font-weight:800;padding:2px 6px;text-align:center;margin-top:3px}

/* TIMER */
.timer-bar{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.timer-ring{position:relative;width:52px;height:52px;flex-shrink:0}
.timer-ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer-ring-track{fill:none;stroke:var(--bdr);stroke-width:3}
.timer-ring-fill{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:900;color:var(--acc)}
.timer-info{flex:1}.timer-title{font-size:.82rem;font-weight:800;margin-bottom:2px}
.timer-sub{font-size:.65rem;color:var(--mut);font-weight:600}
.timer-btns{display:flex;gap:6px}
.timer-btn{background:var(--card2);border:1px solid var(--bdr2);color:var(--acc3);border-radius:10px;
  padding:6px 12px;cursor:pointer;font-size:.68rem;font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s}
.timer-btn:hover{border-color:var(--acc);color:var(--acc)}
.timer-btn.skip{border-color:rgba(134,239,172,.3);color:var(--grn)}

/* EDIT MODAL */
.edit-exname{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:800;letter-spacing:1px;
  color:var(--acc);margin-bottom:18px;text-transform:uppercase}
.edit-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.edit-label{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:800;flex:1}
.edit-controls{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;overflow:hidden}
.edit-stepper{background:none;border:none;color:var(--txt);cursor:pointer;padding:9px 16px;font-size:1.1rem;font-weight:800;font-family:'Nunito',sans-serif}
.edit-stepper:hover{background:var(--card2)}.edit-stepper:disabled{color:var(--mut2);cursor:not-allowed}
.edit-val{min-width:44px;text-align:center;font-size:.95rem;font-weight:800;color:var(--txt);
  padding:9px 4px;border-left:1.5px solid var(--bdr);border-right:1.5px solid var(--bdr)}
.edit-reps-input{background:none;border:none;color:var(--txt);font-family:'Nunito',sans-serif;
  font-size:.9rem;font-weight:800;text-align:center;width:90px;padding:9px 6px;outline:none}
.edit-save{background:var(--acc);color:#080a0f;border:none;border-radius:14px;
  font-family:'Montserrat',sans-serif;font-size:.95rem;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;padding:13px;cursor:pointer;width:100%;margin-top:4px}
.edit-reset{background:none;border:1.5px solid var(--bdr);color:var(--mut);
  border-radius:14px;font-family:'Nunito',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;padding:10px;cursor:pointer;width:100%;margin-top:8px}
.add-ex-form{display:flex;flex-direction:column;gap:12px}
.add-ex-input{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:max(16px,.9rem);font-weight:700;padding:12px 15px;width:100%}
.add-ex-input:focus{outline:none;border-color:rgba(255,255,255,.3)}

/* STATS PAGE */
.stats-page{padding:16px 16px 110px}
.stats-section-title{font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:900;
  letter-spacing:3px;color:var(--mut);margin:22px 0 10px;text-transform:uppercase}
.streak-row{display:flex;gap:10px;margin-bottom:10px}
.streak-mini{flex:1;background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:14px 12px;display:flex;align-items:center;gap:10px}
.streak-icon{font-size:1.5rem;line-height:1}
.streak-info{display:flex;flex-direction:column;gap:2px}
.streak-val{font-family:'Montserrat',sans-serif;font-size:1.7rem;font-weight:900;color:var(--acc);line-height:1}
.streak-lbl{font-size:.54rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-weight:800}
.week-goal-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:16px;margin-bottom:10px}
.week-goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.week-goal-title{font-size:.84rem;font-weight:800}
.week-goal-count{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:900;color:var(--acc)}
.week-pips{display:flex;gap:5px;margin-bottom:7px}
.pip{height:5px;flex:1;border-radius:3px;background:var(--bdr2);transition:background .3s}
.pip.done{background:var(--acc)}
.week-goal-sub{font-size:.64rem;color:var(--mut);font-weight:700}
.week-goal-adj{display:flex;align-items:center;gap:8px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--bdr)}
.week-goal-adj-lbl{font-size:.64rem;color:var(--mut);flex:1;font-weight:700}
.goal-stepper{background:var(--card2);border:1px solid var(--bdr2);color:var(--txt);
  border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.9rem;font-weight:800}
.goal-val{font-size:.9rem;font-weight:800;min-width:24px;text-align:center}
.timer-settings-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:16px;margin-bottom:10px}
.timer-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.timer-preset{background:var(--card2);border:1px solid var(--bdr2);color:var(--mut);
  border-radius:10px;padding:7px 13px;cursor:pointer;font-size:.74rem;font-weight:800;
  font-family:'Nunito',sans-serif;transition:all .15s}
.timer-preset.active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:var(--acc)}
.graph-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:16px;margin-bottom:10px}
.graph-title{font-size:.82rem;font-weight:800;margin-bottom:2px}
.graph-sub{font-size:.62rem;color:var(--mut);margin-bottom:10px;font-weight:600}
.graph-select{background:var(--sur);border:1.5px solid var(--bdr);color:var(--txt);
  border-radius:12px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:.78rem;
  font-weight:700;width:100%;margin-bottom:12px;cursor:pointer}
.no-data{font-size:.75rem;color:var(--mut);text-align:center;padding:20px 0;font-weight:600}
.bw-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;padding:16px;margin-bottom:10px}
.bw-input-row{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.bw-input{background:var(--sur);border:1.5px solid var(--bdr);border-radius:12px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:max(16px,.92rem);font-weight:700;padding:10px 13px;
  flex:1;-moz-appearance:textfield;transition:border-color .15s}
.bw-input::-webkit-outer-spin-button,.bw-input::-webkit-inner-spin-button{-webkit-appearance:none}
.bw-input:focus{outline:none;border-color:rgba(255,255,255,.3)}
.bw-save-btn{background:var(--acc);color:#080a0f;border:none;border-radius:12px;
  font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:1px;
  padding:10px 14px;cursor:pointer;white-space:nowrap}
.bw-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.bw-entry{display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;background:var(--sur);border-radius:12px;border:1px solid var(--bdr)}
.bw-entry-date{font-size:.7rem;color:var(--mut);font-weight:700}
.bw-entry-val{font-size:.9rem;font-weight:800}
.bw-del{background:none;border:none;color:var(--mut2);cursor:pointer;padding:2px 8px;font-size:.9rem;font-weight:700}
.bw-del:hover{color:var(--red)}

/* NOTES */
.notes{width:100%;background:var(--card);border:1.5px solid var(--bdr);border-radius:16px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:.84rem;font-weight:700;padding:13px;
  resize:vertical;min-height:64px;margin-top:16px}
.notes:focus{outline:none;border-color:rgba(255,255,255,.2)}
.notes::placeholder{color:var(--mut2)}

/* REST / NO DAY */
.rest-wrap{padding:50px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rest-title{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:900;letter-spacing:4px;
  color:var(--mut);text-transform:uppercase}
.noday-wrap{padding:50px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.noday-title{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:900;letter-spacing:3px;
  color:var(--mut);text-transform:uppercase}
.noday-sub{font-size:.78rem;color:var(--mut);text-align:center;max-width:240px;
  line-height:1.6;font-weight:600}

/* CONFETTI */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* CUSTOM PLANS */
.plans-page{padding:16px 16px 110px}
.plan-card{background:linear-gradient(145deg,rgba(26,31,42,.95) 0%,rgba(20,24,32,.98) 100%);
  border:1px solid rgba(255,255,255,.07);border-radius:18px;margin-bottom:10px;
  overflow:hidden;transition:all .2s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.plan-card:active{transform:scale(.99)}
.plan-card-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px}
.plan-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:900;flex-shrink:0}
.plan-card-name{font-size:.9rem;font-weight:800;flex:1}
.plan-card-sub{font-size:.62rem;color:var(--mut);font-weight:600;margin-top:2px}
.plan-actions{display:flex;gap:6px}
.plan-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.62rem;font-weight:700;
  font-family:'Nunito',sans-serif;color:var(--acc3);transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.plan-btn:hover{border-color:rgba(255,255,255,.2);color:var(--acc)}
.plan-btn.del{color:var(--red);border-color:rgba(248,113,113,.15)}
.plan-btn.del:hover{border-color:var(--red)}
.add-plan-btn{width:100%;background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.1);
  border-radius:18px;padding:16px;cursor:pointer;color:var(--mut);font-family:'Nunito',sans-serif;
  font-size:.82rem;font-weight:700;text-align:center;transition:all .2s;margin-top:4px}
.add-plan-btn:hover{border-color:rgba(255,255,255,.2);color:var(--acc3);background:rgba(255,255,255,.06)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;transition:transform .15s;border:2px solid transparent}
.color-dot.sel{border-color:var(--acc);transform:scale(1.2)}
.color-dot:active{transform:scale(.9)}

/* LOADING */
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,#0d1424,var(--bg) 70%)}
.loading-logo{font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:900;
  letter-spacing:6px;color:var(--acc);text-transform:uppercase}
.loading-sub{font-size:.65rem;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-weight:800}

/* ONBOARDING */
.onboard-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;
  justify-content:center;animation:fadeIn .2s ease}
.onboard-modal{background:var(--sur);border-radius:24px 24px 0 0;border:1px solid rgba(255,255,255,.08);
  border-bottom:none;padding:28px 20px 44px;width:100%;max-width:480px;
  animation:slideUp .3s cubic-bezier(.34,1.1,.64,1)}
.onboard-title{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;color:var(--txt)}
.onboard-sub{font-size:.75rem;color:var(--mut);font-weight:600;line-height:1.5;margin-bottom:22px}
.onboard-tmpl{background:linear-gradient(145deg,rgba(26,31,42,.95),rgba(20,24,32,.98));
  border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px}
.onboard-tmpl:hover{border-color:rgba(255,255,255,.18);transform:scale(1.01)}
.onboard-tmpl:active{transform:scale(.99)}
.onboard-tmpl-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;flex-shrink:0}
.onboard-tmpl-name{font-size:.9rem;font-weight:800}
.onboard-tmpl-sub{font-size:.65rem;color:var(--mut);font-weight:600;margin-top:2px}
.onboard-or{display:flex;align-items:center;gap:10px;margin:14px 0}
.onboard-or-line{flex:1;height:1px;background:rgba(255,255,255,.07)}
.onboard-or-text{font-size:.62rem;color:var(--mut);font-weight:800;letter-spacing:1px;text-transform:uppercase}

/* PREV WEIGHT HINT */
.prev-hint{font-size:.48rem;color:rgba(255,255,255,.3);text-align:center;margin-top:2px;font-weight:700;letter-spacing:.5px}
.sb.done .prev-hint{color:rgba(134,239,172,.3)}

/* LIGHT MODE */
body.light{
  --bg:#f0f2f8;--sur:#ffffff;--card:#f8f9ff;--card2:#eef0fa;
  --bdr:#dde0f0;--bdr2:#ccd0e8;
  --acc:#1a1f2a;--acc2:#3b6bff;--acc3:#4466bb;
  --txt:#0d1020;--mut:#7080a0;--mut2:#a0aac0;
  --ga:#0066aa;--ga-bg:#e0f0ff;--gb:#007744;--gb-bg:#e0f5ea;
  --red:#cc2222;--red-bg:#ffe8e8;--grn:#007744;--grn-bg:#e0f5ea;
  --gold:#996600;--gold-bg:#fff5d0;
  --bdr-glass:rgba(0,0,0,.1);
}

/* Base cards */
body.light .excard,body.light .day-banner,body.light .statsbar,
body.light .timer-bar,body.light .week-goal-card,body.light .timer-settings-card,
body.light .graph-card,body.light .bw-card,body.light .streak-mini,
body.light .plan-card,body.light .lc,body.light .review-card,
body.light .history-entry,body.light .tmpl-card{
  background:#ffffff!important;
  border-color:rgba(0,0,0,.08)!important;
  box-shadow:0 2px 12px rgba(0,0,0,.07)!important;
}

/* Modal */
body.light .modal{background:#f8f9ff!important;border-color:rgba(0,0,0,.08)!important}
body.light .modal-opt{background:#f0f2fa!important;border-color:rgba(0,0,0,.08)!important}
body.light .modal-opt.active{background:#e8f0ff!important;border-color:var(--acc)!important}

/* Header & nav */
body.light header{background:rgba(240,242,248,.92)!important;border-bottom-color:rgba(0,0,0,.07)!important}
body.light .bnav{background:rgba(235,237,248,.95)!important;border-top-color:rgba(0,0,0,.07)!important}

/* Pill stays dark in light mode */
body.light .bnav-glass-pill{
  background:linear-gradient(160deg,#1a1f2a 0%,#2d3548 100%)!important;
  border-color:rgba(0,0,0,.2)!important;
  box-shadow:0 2px 12px rgba(0,0,0,.25)!important;
}
body.light .bnav-btn{color:rgba(0,0,0,.4)!important}
body.light .bnav-btn.on{color:#fff!important}

/* Set blocks */
body.light .sb{
  background:#f0f2fa!important;
  border-color:rgba(0,0,0,.08)!important;
}
body.light .sb.done{
  background:#e0f5ea!important;
  border-color:rgba(0,120,70,.25)!important;

// ── Graph helpers ─────────────────────────────────────────────────────────────
function buildGraphPaths(points, W, H, padL, padR, padT, padB) {
  const ys = points.map(p => p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const yRange = maxY - minY || 1, yPad = yRange * 0.25;
  const yMin = minY - yPad, yMax = maxY + yPad;
  const n = points.length;
  const sx = i => padL + (n < 2 ? 0.5 : i / (n-1)) * (W - padL - padR);
  const sy = v => padT + (1 - (v-yMin)/(yMax-yMin)) * (H - padT - padB);
  function line(pts) {
    let d = `M${sx(0).toFixed(1)},${sy(pts[0].y).toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const x0=sx(i),y0=sy(pts[i].y),x1=sx(i+1),y1=sy(pts[i+1].y),cpx=(x0+x1)/2;
      d+=` C${cpx.toFixed(1)},${y0.toFixed(1)} ${cpx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
    }
    return d;
  }
  function area(pts){ return `${line(pts)} L${sx(n-1).toFixed(1)},${(H-padB).toFixed(1)} L${padL},${(H-padB).toFixed(1)} Z`; }
  const tickVals = Array.from({length:4},(_,i)=>Math.round(yMin+(i/3)*(yMax-yMin)));
  const step = Math.max(1,Math.floor((n-1)/4));
  const xIdxs = [];
  for(let i=0;i<n;i+=step) xIdxs.push(i);
  if(xIdxs[xIdxs.length-1]!==n-1) xIdxs.push(n-1);
  return {sx,sy,line,area,tickVals,xIdxs};
}

function BigGraph({points, color="#e8ff47", isExample=false, onTap}) {
  if(!points||points.length<2) return <div className="no-data">Nicht genug Daten</div>;
  const W=320,H=160,padL=42,padR=10,padT=20,padB=28;
  const {sx,sy,line,area,tickVals,xIdxs}=buildGraphPaths(points,W,H,padL,padR,padT,padB);
  const maxY=Math.max(...points.map(p=>p.y));
  const gradId=`gr${color.replace(/[^a-z0-9]/gi,"")}${isExample?"ex":""}`;
  return (
    <div onClick={onTap} style={{cursor:onTap?"pointer":"default"}}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block",overflow:"visible"}}>
        <defs>
          <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity={isExample?"0.06":"0.22"}/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {tickVals.map((v,i)=>{const y=sy(v);return(<g key={i}><line x1={padL} y1={y} x2={W-padR} y2={y} stroke="#1e2128" strokeWidth="1" strokeDasharray="3,4"/><text x={padL-5} y={y+3.5} fontSize="9" fill="#555e6b" textAnchor="end" fontFamily="DM Sans,sans-serif">{v}</text></g>);})}
        <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#252830" strokeWidth="1"/>
        <line x1={padL} y1={padT} x2={padL} y2={H-padB} stroke="#252830" strokeWidth="1"/>

        {!isExample&&points.map((p,i)=>{const cx=sx(i),cy=sy(p.y),isPR=p.y===maxY;return(<g key={i}><circle cx={cx} cy={cy} r={isPR?"5":"3.5"} fill={isPR?"#ffd700":color} stroke={isPR?"#111":"#0d0e10"} strokeWidth="1.5"/><text x={cx} y={cy-9} fontSize="9.5" fill={isPR?"#ffd700":color} textAnchor="middle" fontWeight="700" fontFamily="DM Sans,sans-serif">{p.y}</text></g>);})}
        {xIdxs.map(i=>(<text key={i} x={sx(i)} y={H-padB+14} fontSize="9" fill="#555e6b" textAnchor="middle" fontFamily="DM Sans,sans-serif">{points[i].label}</text>))}

}

            <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#252830" strokeWidth="1"/>

            <div key={s.label} style={{background:"var(--card)",border:"1px solid var(--bdr)",borderRadius:"10px",padding:"10px",textAlign:"center"}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.15rem",color:s.c,lineHeight:1}}>{s.val}</div>

              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",color:p.y===maxW?"#ffd700":"var(--txt)"}}>{p.y} kg{p.y===maxW?" 🏆":""}</div>
            </div>

function Confetti({onDone}) {
  const [phase,setPhase]=useState("in");
  useEffect(()=>{
    const t1=setTimeout(()=>setPhase("hold"),80);
    const t2=setTimeout(()=>setPhase("out"),1800);
    const t3=setTimeout(onDone,2200);
    return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
  },[]);

  const C = 2 * Math.PI * 40; // circumference for r=40

  return (
    <div style={{position:"fixed",inset:0,zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",
      pointerEvents:"none",
      background:phase==="out"?"rgba(0,0,0,0)":"rgba(0,0,0,.55)",
      backdropFilter:phase==="out"?"none":"blur(8px)",
      WebkitBackdropFilter:phase==="out"?"none":"blur(8px)",
      transition:"background .5s ease, backdrop-filter .5s ease"}}>
      <div style={{
        textAlign:"center",
        opacity:phase==="out"?0:phase==="hold"?1:0,
        transform:phase==="hold"?"scale(1) translateY(0)":phase==="in"?"scale(.7) translateY(16px)":"scale(1.05) translateY(-8px)",
        transition:"opacity .4s ease, transform .5s cubic-bezier(.34,1.56,.64,1)",
      }}>
        {/* Animated SVG circle + checkmark */}
        <div style={{position:"relative",width:100,height:100,margin:"0 auto 20px"}}>
          <svg width="100" height="100" viewBox="0 0 100 100" style={{transform:"rotate(-90deg)"}}>
            {/* Background circle */}
            <circle cx="50" cy="50" r="40" fill="none"
              stroke="rgba(134,239,172,.15)" strokeWidth="5"/>
            {/* Animated green circle */}
            <circle cx="50" cy="50" r="40" fill="none"
              stroke="#3fd4a0" strokeWidth="5" strokeLinecap="round"
              strokeDasharray={C}
              strokeDashoffset={phase==="hold"?0:C}
              style={{transition:"stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)",
                filter:"drop-shadow(0 0 8px rgba(63,212,160,.5))"}}/>
          </svg>
          {/* Checkmark */}
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none"
            style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)"}}>
            <polyline points="8,22 18,32 36,12"
              stroke="#3fd4a0" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"
              fill="none"
              strokeDasharray="50"
              strokeDashoffset={phase==="hold"?0:50}
              style={{transition:"stroke-dashoffset .5s cubic-bezier(.4,0,.2,1) .6s",
                filter:"drop-shadow(0 0 6px rgba(63,212,160,.6))"}}/>
          </svg>
          {/* Glow ring */}
          <div style={{position:"absolute",inset:-8,borderRadius:"50%",
            background:"radial-gradient(circle,rgba(63,212,160,.08) 0%,transparent 70%)",
            animation:phase==="hold"?"shimmerPulse 2s ease-in-out infinite":"none"}}/>
        </div>

        <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.2rem",fontWeight:900,
          letterSpacing:"2px",textTransform:"uppercase",color:"#fff",
          textShadow:"0 0 24px rgba(63,212,160,.3)",marginBottom:"6px"}}>
          Training abgeschlossen
        </div>
        <div style={{fontSize:".7rem",color:"rgba(255,255,255,.45)",fontWeight:600,letterSpacing:"1px"}}>
          Gut gemacht! 💪
        </div>
      </div>
    </div>
  );
}

function RestTimer({onDismiss, duration=90}) {
  const [left,setLeft]=useState(duration);
  const [running,setRunning]=useState(true);
  const ref=useRef(null);
  const C=2*Math.PI*22;
  useEffect(()=>{
    if(!running) return;
    ref.current=setInterval(()=>setLeft(l=>{if(l<=1){clearInterval(ref.current);onDismiss();return 0;}return l-1;}),1000);
    return()=>clearInterval(ref.current);
  },[running]);
  const pct=left/duration,mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
  return (
    <div className="timer-bar">
      <div className="timer-ring">
        <svg viewBox="0 0 52 52"><circle className="timer-ring-track" cx="26" cy="26" r="22"/><circle className="timer-ring-fill" cx="26" cy="26" r="22" strokeDasharray={C} strokeDashoffset={C*(1-pct)}/></svg>
        <div className="timer-num">{mm}:{ss}</div>
      </div>
      <div className="timer-info"><div className="timer-title">Pause</div><div className="timer-sub">{running?"Erholung...":"Pausiert"}</div></div>
      <div className="timer-btns">
        <button className="timer-btn" onClick={()=>{clearInterval(ref.current);setRunning(r=>!r);}}>{running?"||":">"}</button>
        <button className="timer-btn skip" onClick={onDismiss}>Weiter</button>
      </div>
    </div>
  );
}

function SetBlock({idx, data={}, onChange, isPR, prevWeight=null}) {

  return (
    <div className={`sb${isDone?" done":""}`}>
      <div className="slbl">Satz {idx+1}</div>
      <input className="si" type="number" placeholder="kg" step="0.5" value={data.w??""} onChange={e=>onChange("w",e.target.value)}/>
      {prevWeight&&!data.w&&<div className="prev-hint">{prevWeight}kg</div>}
      <div className="ulbl">Gewicht</div>
      <input className="si" type="number" placeholder="Wdh" step="1" value={data.r??""} onChange={e=>onChange("r",e.target.value)}/>
      <div className="ulbl">Wdh.</div>
      {isDone&&<div className="sb-check"><svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="#111" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1,4.5 3.5,7 8,1.5"/></svg></div>}
      {isDone&&isPR&&<div className="pr-badge">PR</div>}

  );
}

function ExCard({ex, exData={}, overrides={}, onUpdate, onEditSave, onDelete, onSetComplete, prs, prevExData={}}) {
  const [showEdit,setShowEdit]=useState(false);
  const effSets=overrides.sets??ex.sets, effReps=overrides.reps??ex.reps;
  const isUserAdded=ex.id?.startsWith("cx_");
  const allDone=Array.from({length:effSets},(_,i)=>{const s=exData[i]??{};return !!(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0);}).every(Boolean);

  function handleChange(i,f,v) {
    const updated={...exData,[i]:{...exData[i],[f]:v}};
    onUpdate(updated);
    const s=updated[i];
    if(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0) onSetComplete(ex.id,parseFloat(s.w));
  }

  return (
    <>
      <div className={`excard${allDone?" all-done":""}`}>
        <div className="exhdr">
          <div className="exname">{ex.name}</div>
          <div className="exhdr-right">
            <div className={`badge b${ex.badge}`}>{effSets}x * {effReps}{(overrides.sets||overrides.reps)?<span style={{marginLeft:"3px",opacity:.6}}>e</span>:""}</div>
            <button className="icon-btn" onClick={()=>setShowEdit(true)}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            {isUserAdded&&<button className="icon-btn del" onClick={onDelete}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4h6v2"/></svg></button>}
          </div>
        </div>
        <div className="sgrid">
          {Array.from({length:effSets},(_,i)=>{const s=exData[i]??{},w=parseFloat(s.w)||0,isPR=w>0&&prs[ex.id]===w;return <SetBlock key={i} idx={i} data={s} isPR={isPR} onChange={(f,v)=>handleChange(i,f,v)} onComplete={()=>onSetComplete(ex.id,parseFloat(s.w)||0)}/>;  })}
        </div>
      </div>
      {showEdit&&<EditModal ex={ex} overrides={overrides} onSave={v=>{onEditSave(v);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </>
  );
}

function TrainingPage({planIdx, dayData={}, customExercises={}, onUpdate, onUpdateCustom, onChangeType, prs, onNewPR, timerDuration=90, allDays={}, currentDk=''}) {
  const [showTimer,setShowTimer]=useState(false);
  const [addingToSection,setAddingToSection]=useState(null);
  const [showConfetti,setShowConfetti]=useState(false);
  const prevDoneRef=useRef(0);
  const confettiShownRef=useRef(false); // only show once per session
  const tab=DEFAULT_PLAN[planIdx];
  const planType=planIdx===0?"A":"B";
  // Find most recent previous session with same plan type
  const prevSessionData = Object.entries(allDays)
    .filter(([dk,di])=>dk<currentDk&&di?.type===planType)
    .sort(([a],[b])=>b.localeCompare(a))[0]?.[1] ?? null;
  const overrides=dayData?.overrides??{};
  let total=0,done=0;
  tab.sections.forEach((s,si)=>{const allEx=[...s.exercises,...(customExercises[`${planIdx}_${si}`]??[])];allEx.forEach((ex,ei)=>{const ov=overrides[`${si}_${ei}`]??{},effSets=ov.sets??ex.sets;total+=effSets;const ed=dayData?.sections?.[si]?.[ei]??{};for(let i=0;i<effSets;i++){const sd=ed[i]??{};if(sd.w&&sd.r&&parseFloat(sd.w)>0&&parseFloat(sd.r)>0) done++;}});});
  useEffect(()=>{
    if(total>0&&done===total&&prevDoneRef.current<total&&!confettiShownRef.current){
      confettiShownRef.current=true;
      setShowConfetti(true);
    }
    prevDoneRef.current=done;
  },[done,total]);
  function upEx(si,ei,val){onUpdate({...dayData,sections:{...dayData?.sections,[si]:{...dayData?.sections?.[si],[ei]:val}}});}
  function saveOverride(si,ei,val){const k=`${si}_${ei}`,newOv={...overrides};if(!val.sets&&!val.reps) delete newOv[k]; else newOv[k]=val;onUpdate({...dayData,overrides:newOv});}
  function handleSetComplete(exId,weight){setShowTimer(true);if(weight>0) onNewPR(exId,weight);}
  function addCustomEx(si,ex){const key=`${planIdx}_${si}`,prev=customExercises[key]??[];onUpdateCustom({...customExercises,[key]:[...prev,ex]});setAddingToSection(null);}
  function deleteCustomEx(si,idx){const key=`${planIdx}_${si}`,prev=[...(customExercises[key]??[])];onUpdateCustom({...customExercises,[key]:prev.filter((_,i)=>i!==idx)});}

  return (
    <div className="page">
      {showConfetti&&<Confetti onDone={()=>setShowConfetti(false)}/>}
      <div className="statsbar">
        <div className="stat"><div className="sv">{done}</div><div className="sl">Erledigt</div></div>
        <div className="stat"><div className="sv">{total}</div><div className="sl">Gesamt</div></div>
        {done===total&&total>0&&(
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:"6px",
            background:"rgba(63,212,160,.1)",border:"1px solid rgba(63,212,160,.25)",
            borderRadius:"10px",padding:"5px 10px"}}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#3fd4a0" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="2,6.5 5,9.5 11,3.5"/>
            </svg>
            <span style={{fontSize:".6rem",fontWeight:800,color:"#3fd4a0",letterSpacing:"1px",textTransform:"uppercase"}}>Abgeschlossen</span>
          </div>
        )}
        {!(done===total&&total>0)&&<button className="day-banner-change" style={{marginLeft:"auto"}} onClick={onChangeType}>Ändern</button>}
      </div>
      <div className="pbar"><div className="pfill" style={{width:total?(done/total*100)+"%":"0%"}}/></div>
      {showTimer&&<RestTimer onDismiss={()=>setShowTimer(false)} duration={timerDuration}/>}
      <div className="dayhdr">{tab.title}</div>
      <div className="daysub">{tab.subtitle}</div>
      {tab.sections.map((sec,si)=>{
        const customList=customExercises[`${planIdx}_${si}`]??[];
        const allEx=[...sec.exercises,...customList];
        return (
          <div key={si}>
            <div className="seclbl">{sec.label}<button className="add-ex-btn" onClick={()=>setAddingToSection(si)}>+ Übung</button></div>
            {allEx.map((ex,ei)=><ExCard key={ex.id||ei} ex={ex} exData={dayData?.sections?.[si]?.[ei]??{}} overrides={overrides[`${si}_${ei}`]??{}} prs={prs} prevExData={prevSessionData?.sections?.[si]?.[ei]??{}} onUpdate={v=>upEx(si,ei,v)} onEditSave={v=>saveOverride(si,ei,v)} onDelete={()=>deleteCustomEx(si,ei-sec.exercises.length)} onSetComplete={handleSetComplete} onNewPR={onNewPR}/>)}
          </div>
        );
      })}
      <textarea className="notes" placeholder="Notizen zum Training..." value={dayData?.notes??""} onChange={e=>onUpdate({...dayData,notes:e.target.value})}/>
      {addingToSection!==null&&<AddExerciseModal onAdd={ex=>addCustomEx(addingToSection,ex)} onClose={()=>setAddingToSection(null)}/>}
    </div>
  );
}

      <div className="modal">
        <div className="modal-handle"/>
        <div className="modal-title">Trainingstyp</div>
        <div className="modal-sub">{label}</div>
        <div className="modal-opts">
          {allOpts.map(o=>(
            <div key={o.type} className={`modal-opt${current===o.type?" active":""}`} onClick={()=>onSelect(o.type)}>
              <div className="modal-opt-icon" style={{background:o.color+"22",color:o.color}}>{o.icon}</div>
              <div className="modal-opt-text"><div className="modal-opt-name">{o.name}</div><div className="modal-opt-desc">{o.desc}</div></div>
              {current===o.type&&<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--acc)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="2,8 6,12 14,4"/></svg>}
            </div>
          ))}
        </div>
        <button className="modal-cancel" onClick={onClose}>Abbrechen</button>
      </div>
    </div>
  );
}

function CalendarView({allDays, selectedDate, onSelectDate, customPlans=[], onDeleteDay}) {
  const [viewDate,setViewDate]=useState(new Date(selectedDate));
  const [popup,setPopup]=useState(null);
  const [confirmDay,setConfirmDay]=useState(null);
  const [confirmDeleteDay,setConfirmDeleteDay]=useState(null);
  const [popupDetail,setPopupDetail]=useState(null); // ask user if they want to plan this day
  const year=viewDate.getFullYear(),month=viewDate.getMonth();
  let startOffset=new Date(year,month,1).getDay()-1;
  if(startOffset<0) startOffset=6;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayKey=dateKey(today()),selKey=dateKey(selectedDate);
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(year,month,d));

  function getPlanColor(type) {
    if(!type||type==="rest") return null;
    if(type==="A") return "#7dd3fc";
    if(type==="B") return "#86efac";
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.color||"#a78bfa";
    return "#e8ff47";
  }
  function getPlanName(type) {
    if(type==="rest") return "💤 Ruhetag";
    if(type==="A") return "Tag A – Brust & Rücken";
    if(type==="B") return "Tag B – Schulter & Arme";
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.name||"Eigener Plan";
    return type;
  }
  function getSessionStats(di, planType) {
    let done=0, total=0, vol=0;
    // Get plan definition to know exact sets per exercise
    let planSections = null;
    if(planType==="A") planSections = DEFAULT_PLAN[0].sections;
    else if(planType==="B") planSections = DEFAULT_PLAN[1].sections;
    else if(planType?.startsWith("custom_")) {
      const cp = customPlans.find(p=>"custom_"+p.id===planType);
      planSections = cp?.sections || null;
    }

    if(planSections && di?.sections) {
      planSections.forEach((sec, si) => {
        sec.exercises.forEach((ex, ei) => {
          const ov = di.overrides?.[`${si}_${ei}`];
          const effSets = ov?.sets ?? ex.sets;
          const exData = di.sections?.[si]?.[ei] ?? {};
          total += effSets;
          for(let i=0; i<effSets; i++) {
            const s = exData[i] ?? {};
            if(s.w && s.r && parseFloat(s.w)>0 && parseFloat(s.r)>0) {
              done++;
              vol += parseFloat(s.w) * parseFloat(s.r);
            }
          }
        });
      });
    } else if(di?.sections) {
      // Fallback: count from data
      Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>{
        Object.values(ex).forEach(s=>{
          if(typeof s==="object"&&s.w!==undefined){
            total++;
            if(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0){done++;vol+=parseFloat(s.w)*parseFloat(s.r);}
          }
        });
      }));
    }
    return {done, total, vol:Math.round(vol)};
  }

  const pressTimer = React.useRef(null);
  function onTouchStart(dk,di,e) { pressTimer.current=setTimeout(()=>{if(di?.type) setPopup({dk,di});},450); }
  function onTouchEnd() { clearTimeout(pressTimer.current); }

  function handleDayTap(date, dk, di) {
    if(di?.type) {
      // Day has a plan — go directly
      onSelectDate(date);
    } else {
      // Empty day — ask if they want to plan it
      setConfirmDay({date, dk});
    }
  }

  return (
    <div className="cal-wrap" onClick={()=>{setPopup(null);setConfirmDay(null);}}>
      {popupDetail&&(
        <div style={{position:"fixed",inset:0,zIndex:450,background:"var(--bg)",overflowY:"auto",padding:"16px 16px 100px"}} onClick={e=>e.stopPropagation()}>
          <TrainingDetailView dk={popupDetail.dk} di={popupDetail.di} customPlans={customPlans} onBack={()=>setPopupDetail(null)} backLabel="Zum Kalender"/>
        </div>
      )}
      <div className="cal-header">
        <button className="cal-nav" onClick={e=>{e.stopPropagation();setViewDate(new Date(year,month-1,1));}}>{'<'}</button>
        <div className="cal-month">{MONTHS_DE[month]} {year}</div>
        <button className="cal-nav" onClick={e=>{e.stopPropagation();setViewDate(new Date(year,month+1,1));}}>{'>'}</button>
      </div>
      <div className="cal-grid">
        {DAYS_DE.map(d=><div key={d} className="cal-day-lbl">{d}</div>)}
        {cells.map((date,i)=>{
          if(!date) return <div key={"e"+i} className="cal-day empty"/>;
          const dk=dateKey(date),di=allDays[dk];
          const planColor=getPlanColor(di?.type);
          const isToday=dk===todayKey,isSel=dk===selKey;
          const isRest=di?.type==="rest";
          const stats=di?getSessionStats(di,di?.type):null;
          const progress=stats?.total>0?stats.done/stats.total:0;
          return (
            <div key={dk}
              className={`cal-day${isToday?" today":""}${isSel?" selected":""}`}
              style={planColor&&!isSel?{border:`2px solid ${planColor}66`,background:`${planColor}12`}
                :isRest&&!isSel?{border:"1.5px solid rgba(255,255,255,.08)",background:"rgba(255,255,255,.03)"}:{}}
              onClick={e=>{e.stopPropagation();setPopup(null);handleDayTap(date,dk,di);}}
              onTouchStart={e=>onTouchStart(dk,di,e)}
              onTouchEnd={onTouchEnd}
              onTouchMove={onTouchEnd}
              onContextMenu={e=>{e.preventDefault();if(di?.type) setPopup({dk,di});}}>
              <div className="cal-dn" style={planColor&&!isSel?{color:planColor}:isRest&&!isSel?{color:"var(--mut)"}:{}}>{date.getDate()}</div>
              {planColor&&stats?.done>0&&(
                <div style={{width:"60%",height:3,borderRadius:2,background:`${planColor}44`,overflow:"hidden",marginTop:1}}>
                  <div style={{height:"100%",width:(progress*100)+"%",background:isSel?"rgba(0,0,0,.4)":planColor,borderRadius:2}}/>
                </div>
              )}
              {isRest&&<div style={{fontSize:".42rem",opacity:.45,marginTop:1}}>💤</div>}
            </div>
          );
        })}
      </div>

      {/* Confirm plan modal — shown when tapping empty day */}
      {confirmDay&&(
        <div style={{position:"fixed",inset:0,zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:"rgba(0,0,0,.6)",backdropFilter:"blur(6px)"}}
          onClick={e=>{e.stopPropagation();setConfirmDay(null);}}>
          <div style={{background:"var(--sur)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"22px",
            padding:"24px 22px",width:"100%",maxWidth:"320px",
            boxShadow:"0 24px 64px rgba(0,0,0,.7)",animation:"scaleIn .2s cubic-bezier(.34,1.56,.64,1)"}}
            onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:"center",marginBottom:"18px"}}>
              <div style={{fontSize:"2rem",marginBottom:"8px"}}>📅</div>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,letterSpacing:"1px",marginBottom:"6px"}}>
                Training planen?
              </div>
              <div style={{fontSize:".72rem",color:"var(--mut)",fontWeight:600,lineHeight:1.5}}>
                {new Date(confirmDay.dk+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
              </div>
            </div>
            <button onClick={()=>{setConfirmDay(null);onSelectDate(confirmDay.date);}}
              className="cal-confirm-btn"
              style={{width:"100%",background:"var(--acc)",color:"#080a0f",border:"none",borderRadius:"14px",
                padding:"14px",fontFamily:"'Montserrat',sans-serif",fontSize:".9rem",fontWeight:900,
                cursor:"pointer",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"10px",
                boxShadow:"0 4px 20px rgba(255,255,255,.1)"}}>
              Ja, Training planen
            </button>
            <button onClick={()=>setConfirmDay(null)}
              style={{width:"100%",background:"none",border:"1px solid rgba(255,255,255,.08)",borderRadius:"14px",
                padding:"12px",cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",
                fontSize:".82rem",fontWeight:700}}>
              Abbrechen
            </button>
          </div>
        </div>
      )}

      {/* Long-press detail popup */}
      {popup&&(()=>{
        const {dk,di}=popup;
        const planColor=getPlanColor(di?.type);
        const stats=getSessionStats(di,di?.type);
        const date=new Date(dk+"T12:00:00");
        const plan=di?.type?.startsWith("custom_")?customPlans.find(p=>"custom_"+p.id===di.type):null;
        const progress=stats.total>0?Math.round(stats.done/stats.total*100):0;
        return (
          <div style={{position:"fixed",inset:0,zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",background:"rgba(0,0,0,.65)",backdropFilter:"blur(8px)"}}
            onClick={e=>{e.stopPropagation();setPopup(null);}}>
            <div style={{background:"var(--sur)",border:`1px solid ${planColor||"rgba(255,255,255,.1)"}33`,
              borderRadius:"24px",padding:"0",width:"100%",maxWidth:"360px",overflow:"hidden",
              boxShadow:`0 24px 64px rgba(0,0,0,.7),0 0 0 1px ${planColor||"#fff"}11`,
              animation:"scaleIn .2s cubic-bezier(.34,1.56,.64,1)"}}
              onClick={e=>e.stopPropagation()}>

              {/* Color banner */}
              <div style={{background:planColor?`linear-gradient(135deg,${planColor}22,${planColor}08)`:"rgba(255,255,255,.04)",
                borderBottom:`1px solid ${planColor||"#fff"}22`,padding:"22px 22px 18px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"14px"}}>
                  <div style={{width:52,height:52,borderRadius:"16px",
                    background:planColor?planColor+"28":"rgba(255,255,255,.08)",
                    border:`1.5px solid ${planColor||"rgba(255,255,255,.15)"}44`,
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.6rem",flexShrink:0}}>
                    {di?.type==="rest"?"💤":plan?.icon||"🏋️"}
                  </div>
                  <div>
                    <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.05rem",fontWeight:900,
                      color:planColor||"var(--txt)",letterSpacing:".5px"}}>
                      {getPlanName(di?.type)}
                    </div>
                    <div style={{fontSize:".7rem",color:"var(--mut)",fontWeight:600,marginTop:"3px"}}>
                      {date.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
                    </div>
                  </div>
                </div>
              </div>

              <div style={{padding:"18px 22px 22px"}}>
                              {/* Quick stats only — details via button */}
                {di?.type!=="rest"&&stats.total>0&&(
                  <div style={{display:"flex",gap:"8px",marginBottom:"16px"}}>
                    <div style={{flex:1,background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"10px 6px",textAlign:"center",border:"1px solid rgba(255,255,255,.06)"}}>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,color:planColor||"var(--acc)",lineHeight:1}}>{stats.done}/{stats.total}</div>
                      <div style={{fontSize:".52rem",color:"var(--mut)",fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",marginTop:"3px"}}>Sätze</div>
                    </div>
                    <div style={{flex:1,background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"10px 6px",textAlign:"center",border:"1px solid rgba(255,255,255,.06)"}}>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,color:planColor||"var(--acc)",lineHeight:1}}>{progress}%</div>
                      <div style={{fontSize:".52rem",color:"var(--mut)",fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",marginTop:"3px"}}>Erledigt</div>
                    </div>
                    {stats.vol>0&&<div style={{flex:1,background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"10px 6px",textAlign:"center",border:"1px solid rgba(255,255,255,.06)"}}>
                      <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,color:planColor||"var(--acc)",lineHeight:1}}>{stats.vol}kg</div>
                      <div style={{fontSize:".52rem",color:"var(--mut)",fontWeight:800,textTransform:"uppercase",letterSpacing:"1px",marginTop:"3px"}}>Volumen</div>
                    </div>}
                  </div>
                )}
                {di?.notes&&(
                  <div style={{background:"rgba(255,255,255,.03)",borderRadius:"10px",padding:"9px 12px",
                    marginBottom:"14px",fontSize:".72rem",color:"var(--mut)",fontStyle:"italic",lineHeight:1.5,
                    border:"1px solid rgba(255,255,255,.05)"}}>
                    📝 {di.notes}
                  </div>
                )}
                {/* Actions */}
                <div style={{display:"flex",gap:"8px",marginBottom:"8px"}}>
                  <button onClick={()=>{setPopup(null);onSelectDate(date);}}

                      borderRadius:"12px",padding:"13px",fontFamily:"'Montserrat',sans-serif",
                      fontSize:".85rem",fontWeight:900,cursor:"pointer",letterSpacing:"1px",textTransform:"uppercase"}}>
                    Öffnen
                  </button>
                  <button onClick={()=>{setPopupDetail({dk,di});setPopup(null);}}
                    style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",
                      borderRadius:"12px",padding:"13px 14px",cursor:"pointer",color:"var(--acc3)",
                      fontFamily:"'Nunito',sans-serif",fontSize:".72rem",fontWeight:800}}>
                    Details
                  </button>
                  <button onClick={()=>setPopup(null)}
                    style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",
                      borderRadius:"12px",padding:"13px 16px",cursor:"pointer",color:"var(--mut)",
                      fontFamily:"'Nunito',sans-serif",fontSize:".8rem",fontWeight:700}}>
                    ✕
                  </button>
                </div>
                {/* Delete */}
                {confirmDeleteDay===dk?(
                  <div style={{background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.2)",
                    borderRadius:"12px",padding:"12px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <div style={{flex:1,fontSize:".72rem",color:"var(--red)",fontWeight:700}}>Training wirklich löschen?</div>
                    <button onClick={()=>{onDeleteDay(dk);setPopup(null);setConfirmDeleteDay(null);}}
                      style={{background:"var(--red)",color:"#fff",border:"none",borderRadius:"8px",
                        padding:"7px 12px",cursor:"pointer",fontFamily:"'Montserrat',sans-serif",
                        fontSize:".72rem",fontWeight:800,letterSpacing:".5px"}}>JA</button>
                    <button onClick={()=>setConfirmDeleteDay(null)}
                      style={{background:"none",border:"1px solid rgba(255,255,255,.1)",borderRadius:"8px",
                        padding:"7px 10px",cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",
                        fontSize:".72rem",fontWeight:700}}>Nein</button>
                  </div>
                ):(
                  <button onClick={()=>setConfirmDeleteDay(dk)}
                    style={{width:"100%",background:"rgba(248,113,113,.06)",border:"1px solid rgba(248,113,113,.15)",
                      borderRadius:"12px",padding:"10px",cursor:"pointer",color:"var(--red)",
                      fontFamily:"'Nunito',sans-serif",fontSize:".75rem",fontWeight:800,
                      letterSpacing:".5px",textTransform:"uppercase"}}>
                    🗑 Training löschen
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}


function StatsPage({allDays, prs, bodyWeights, onSaveBW, weekGoal, onSetWeekGoal, timerDuration, onSetTimerDuration, customPlans=[], onSavePlans}) {
  const [bwInput,setBwInput]=useState("");
  const [selectedEx,setSelectedEx]=useState("");
  const [graphExpanded,setGraphExpanded]=useState(false);
  const [bwExpanded,setBwExpanded]=useState(false);
  const [statsTab,setStatsTab]=useState("stats");


  // Streak
  let streak=0;
  const sd=new Date(today());
  const todayInfo=allDays[dateKey(sd)];
  if(!todayInfo?.type||todayInfo.type==="rest") sd.setDate(sd.getDate()-1);
  for(let i=0;i<365;i++){const di=allDays[dateKey(sd)];if(di?.type&&di.type!=="rest"){streak++;sd.setDate(sd.getDate()-1);}else break;}

  const weekSessions=Object.entries(allDays).filter(([k,v])=>{try{return v?.type&&v.type!=="rest"&&isSameWeek(new Date(k),today());}catch{return false;}}).length;
  let totalSessions=0;
  Object.values(allDays).forEach(di=>{if(di?.type&&di.type!=="rest") totalSessions++;});

  const graphPoints=[];
  Object.entries(allDays).sort(([a],[b])=>a.localeCompare(b)).forEach(([dk,di])=>{
    if(!di?.sections) return;
    DEFAULT_PLAN.forEach(tab=>tab.sections.forEach((sec,si)=>sec.exercises.forEach((ex,ei)=>{
      if(ex.id!==selectedEx) return;
      const ed=di.sections?.[si]?.[ei];if(!ed) return;
      let max=0;Object.values(ed).forEach(s=>{if(s.w&&parseFloat(s.w)>max) max=parseFloat(s.w);});
      if(max>0) graphPoints.push({x:graphPoints.length,y:max,label:dk.slice(5)});
    })));
  });

  const examplePoints=[{x:0,y:60,label:"01-06"},{x:1,y:62,label:"01-09"},{x:2,y:65,label:"01-13"},{x:3,y:67,label:"01-16"},{x:4,y:70,label:"01-20"},{x:5,y:72,label:"01-23"}];
  const bwExPoints=[{x:0,y:82,label:"04-01"},{x:1,y:81.5,label:"04-05"},{x:2,y:81,label:"04-09"},{x:3,y:80.5,label:"04-13"},{x:4,y:80,label:"04-17"},{x:5,y:79.5,label:"04-21"}];
  const allExercises=[...DEFAULT_PLAN.flatMap(tab=>tab.sections.flatMap(sec=>sec.exercises)),...customPlans.flatMap(p=>p.sections?.flatMap(s=>s.exercises)||[])];
  const selectedExName=allExercises.find(e=>e.id===selectedEx)?.name??"";

  function saveBW(){if(!bwInput) return;const val=parseFloat(bwInput);if(isNaN(val)||val<=0) return;const entry={date:dateKey(today()),weight:val};onSaveBW([entry,...(bodyWeights||[]).filter(e=>e.date!==entry.date)].slice(0,90));setBwInput("");}
  function deleteBW(date){onSaveBW((bodyWeights||[]).filter(e=>e.date!==date));}
  const bwPoints=(bodyWeights||[]).slice(0,30).reverse().map((e,i)=>({x:i,y:e.weight,label:e.date.slice(5)}));
  const timerPresets=[30,60,90,120,180,240];
  const earned=getEarnedAchievements(allDays,prs);

  return (
    <div className="stats-page">
      {/* Sub tabs */}
      <div className="stats-subtabs" style={{display:"flex",background:"var(--card)",borderRadius:"14px",padding:"4px",gap:"4px",marginBottom:"16px",border:"1px solid rgba(255,255,255,.06)"}}>
        {[["stats","📊 Stats"],["history","📋 Verlauf"],["achievements","🏆 Abzeichen"]].map(([key,label])=>(
          <button key={key} onClick={()=>setStatsTab(key)}
            className={statsTab===key?"stats-tab-active":"stats-tab-inactive"}
            style={{flex:1,padding:"8px",textAlign:"center",fontSize:".65rem",fontWeight:800,
              letterSpacing:".5px",textTransform:"uppercase",cursor:"pointer",border:"none",
              background:statsTab===key?"var(--acc)":"none",
              borderRadius:"10px",transition:"all .2s",fontFamily:"'Nunito',sans-serif"}}>
            {label}
          </button>
        ))}
      </div>

      {statsTab==="history"&&<HistoryPage allDays={allDays} customPlans={customPlans}/>}

      {statsTab==="achievements"&&(
        <div>
          <div style={{fontSize:".62rem",color:"var(--mut)",fontWeight:700,marginBottom:"12px"}}>{earned.size} / {ACHIEVEMENTS.length} freigeschaltet</div>
          <div className="badge-grid">
            {ACHIEVEMENTS.map(a=>(
              <div key={a.id} className={`achieve-card${earned.has(a.id)?" earned":" locked"}`}>
                <div className="achieve-icon">{a.icon}</div>
                <div className="achieve-name">{a.name}</div>
                <div className="achieve-desc">{a.desc}</div>
                {earned.has(a.id)&&<div style={{fontSize:".5rem",color:"var(--gold)",fontWeight:800}}>✓ Verdient</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {statsTab==="stats"&&<>
        <WeeklyReview allDays={allDays} prs={prs}/>

        <div className="streak-row">
          <div className="streak-mini"><div className="streak-icon">🔥</div><div className="streak-info"><div className="streak-val">{streak}</div><div className="streak-lbl">Tage Streak</div></div></div>
          <div className="streak-mini"><div className="streak-icon">🏋️</div><div className="streak-info"><div className="streak-val">{totalSessions}</div><div className="streak-lbl">Trainings</div></div></div>
        </div>

        <div className="week-goal-card">
          <div className="week-goal-header"><div className="week-goal-title">Wochenziel</div><div className="week-goal-count">{weekSessions}/{weekGoal}</div></div>
          <div className="week-pips">{Array.from({length:weekGoal},(_,i)=><div key={i} className={`pip${i<weekSessions?" done":""}`}/>)}</div>
          <div className="week-goal-sub">{weekSessions>=weekGoal?"Ziel erreicht!":` Noch ${weekGoal-weekSessions} bis zum Ziel`}</div>
          <div className="week-goal-adj"><div className="week-goal-adj-lbl">Ziel anpassen</div><button className="goal-stepper" disabled={weekGoal<=1} onClick={()=>onSetWeekGoal(weekGoal-1)}>-</button><div className="goal-val">{weekGoal}x</div><button className="goal-stepper" disabled={weekGoal>=7} onClick={()=>onSetWeekGoal(weekGoal+1)}>+</button></div>
        </div>

        <div className="stats-section-title">Pausentimer</div>
        <div className="timer-settings-card">
          <div style={{fontSize:".8rem",fontWeight:600,marginBottom:"4px"}}>Pausenlänge</div>
          <div style={{fontSize:".65rem",color:"var(--mut)",marginBottom:"10px"}}>Aktuell: <strong style={{color:"var(--acc)"}}>{Math.floor(timerDuration/60)}:{String(timerDuration%60).padStart(2,"0")} min</strong></div>
          <div className="timer-presets">{timerPresets.map(s=><button key={s} className={`timer-preset${timerDuration===s?" active":""}`} onClick={()=>onSetTimerDuration(s)}>{s<60?`${s}s`:`${s/60} min`}</button>)}</div>

        <div className="graph-card">

          <div className="graph-sub">{!selectedEx?"Wähle eine Übung":graphPoints.length>=2?"Antippen für Details":graphPoints.length===0?"Noch keine Daten":"1 Eintrag – noch 1 weiteres Training"}</div>
          <select className="graph-select" value={selectedEx} onChange={e=>{setSelectedEx(e.target.value);setGraphExpanded(false);}}>

          {!selectedEx&&<><div style={{fontSize:".62rem",color:"var(--mut)",marginBottom:"6px",fontStyle:"italic"}}>Beispiel:</div><BigGraph points={examplePoints} color="#444b55" isExample={true}/></>}
          {selectedEx&&graphPoints.length>=2&&<BigGraph points={graphPoints} onTap={()=>setGraphExpanded(true)}/>}
          {selectedEx&&graphPoints.length===0&&<><div style={{fontSize:".62rem",color:"var(--mut)",marginBottom:"6px",fontStyle:"italic"}}>So wird es aussehen:</div><BigGraph points={examplePoints} color="#444b55" isExample={true}/></>}

          </div>
          {(bodyWeights||[]).length>0&&<div className="bw-list">{(bodyWeights||[]).map((e,i)=><div key={i} className="bw-entry"><div className="bw-entry-date">{e.date}</div><div className="bw-entry-val">{e.weight} kg</div><button className="bw-del" onClick={()=>deleteBW(e.date)}>x</button></div>)}</div>}
        </div>
        {bwExpanded&&bwPoints.length>=2&&<GraphModal points={bwPoints} exName="Körpergewicht" color="#3fd4a0" onClose={()=>setBwExpanded(false)}/>}

      </>}
    </div>
  );
}


// ── Custom Plan Creator ──────────────────────────────────────────────────────
const PLAN_COLORS = ["#7dd3fc","#86efac","#f9a8d4","#fbbf24","#a78bfa","#fb923c","#34d399","#f87171","#e879f9","#38bdf8"];

function NewPlanModal({onSave, onClose, editPlan=null}) {
  const [name, setName] = useState(editPlan?.name||"");
  const [color, setColor] = useState(editPlan?.color||PLAN_COLORS[0]);
  const [sections, setSections] = useState(editPlan?.sections||[{label:"ÜBUNGEN",exercises:[]}]);
  const [newSecName, setNewSecName] = useState("");
  const [newExName, setNewExName] = useState("");
  const [newExSets, setNewExSets] = useState(3);
  const [newExReps, setNewExReps] = useState("8-12");
  const [addingToSec, setAddingToSec] = useState(null);

  function addSection() {
    if(!newSecName.trim()) return;
    setSections(s=>[...s,{label:newSecName.trim().toUpperCase(),exercises:[]}]);
    setNewSecName("");
  }
  function removeSection(i) { setSections(s=>s.filter((_,idx)=>idx!==i)); }
  function addExercise(si) {
    if(!newExName.trim()) return;
    const ex={id:"cx_"+Date.now(),name:newExName.trim(),sets:newExSets,reps:newExReps,badge:"a"};
    setSections(s=>s.map((sec,i)=>i===si?{...sec,exercises:[...sec.exercises,ex]}:sec));
    setNewExName(""); setAddingToSec(null);
  }
  function removeExercise(si,ei) {
    setSections(s=>s.map((sec,i)=>i===si?{...sec,exercises:sec.exercises.filter((_,j)=>j!==ei)}:sec));
  }

  const icon = name.trim()[0]?.toUpperCase()||"?";

  return (
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-handle"/>
        <div className="modal-title">{editPlan?"Plan bearbeiten":"Neuer Plan"}</div>

        {/* Preview */}
        <div style={{display:"flex",alignItems:"center",gap:"12px",padding:"12px 0 16px",borderBottom:"1px solid rgba(255,255,255,.06)",marginBottom:"16px"}}>
          <div style={{width:48,height:48,borderRadius:14,background:color+"22",border:"1px solid "+color+"44",
            display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Montserrat',sans-serif",
            fontSize:"1.3rem",fontWeight:900,color,flexShrink:0}}>{icon}</div>
          <div>
            <div style={{fontSize:".9rem",fontWeight:800,color:"var(--acc)"}}>{name||"Plan Name..."}</div>
            <div style={{fontSize:".62rem",color:"var(--mut)",marginTop:"2px",fontWeight:600}}>{sections.length} Abschnitt{sections.length!==1?"e":""} · {sections.reduce((a,s)=>a+s.exercises.length,0)} Übungen</div>
          </div>
        </div>

        {/* Name */}
        <div style={{marginBottom:"14px"}}>
          <div style={{fontSize:".6rem",letterSpacing:"2px",textTransform:"uppercase",color:"var(--mut)",fontWeight:700,marginBottom:"6px"}}>Plan Name</div>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="z.B. Beine & Bauch"
            style={{width:"100%",background:"var(--card)",border:"1.5px solid var(--bdr)",borderRadius:"12px",color:"var(--txt)",fontFamily:"'Nunito',sans-serif",fontSize:".9rem",fontWeight:700,padding:"11px 14px",outline:"none"}}/>
        </div>

        {/* Color */}
        <div style={{marginBottom:"16px"}}>
          <div style={{fontSize:".6rem",letterSpacing:"2px",textTransform:"uppercase",color:"var(--mut)",fontWeight:700,marginBottom:"8px"}}>Farbe</div>
          <div className="color-grid">
            {PLAN_COLORS.map(c=>(
              <div key={c} className={`color-dot${color===c?" sel":""}`} style={{background:c}}
                onClick={()=>setColor(c)}/>
            ))}
          </div>
        </div>

        {/* Sections */}
        <div style={{marginBottom:"14px"}}>
          <div style={{fontSize:".6rem",letterSpacing:"2px",textTransform:"uppercase",color:"var(--mut)",fontWeight:700,marginBottom:"8px"}}>Abschnitte & Übungen</div>
          {sections.map((sec,si)=>(
            <div key={si} style={{background:"var(--card)",border:"1px solid rgba(255,255,255,.06)",borderRadius:"12px",marginBottom:"8px",overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",padding:"10px 12px",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                <div style={{flex:1,fontSize:".75rem",fontWeight:800,letterSpacing:"1px"}}>{sec.label}</div>
                <button onClick={()=>setAddingToSec(si===addingToSec?null:si)}
                  style={{background:"none",border:"1px solid rgba(255,255,255,.1)",color:"var(--acc3)",borderRadius:"6px",padding:"3px 8px",cursor:"pointer",fontSize:".6rem",fontWeight:800,fontFamily:"'Nunito',sans-serif"}}>+ Übung</button>
                {sections.length>1&&<button onClick={()=>removeSection(si)}
                  style={{background:"none",border:"none",color:"var(--red)",cursor:"pointer",fontSize:".8rem",marginLeft:"6px",padding:"2px 4px"}}>✕</button>}
              </div>
              {sec.exercises.map((ex,ei)=>(
                <div key={ei} style={{display:"flex",alignItems:"center",padding:"8px 12px",borderBottom:"1px solid rgba(255,255,255,.03)"}}>
                  <div style={{flex:1,fontSize:".78rem",fontWeight:600}}>{ex.name}</div>
                  <div style={{fontSize:".62rem",color:"var(--mut)",marginRight:"8px",fontWeight:600}}>{ex.sets}× {ex.reps}</div>
                  <button onClick={()=>removeExercise(si,ei)} style={{background:"none",border:"none",color:"var(--mut2)",cursor:"pointer",fontSize:".8rem"}}>✕</button>
                </div>
              ))}
              {addingToSec===si&&(
                <div style={{padding:"10px 12px",borderTop:"1px solid rgba(255,255,255,.05)",display:"flex",flexDirection:"column",gap:"8px"}}>
                  <input value={newExName} onChange={e=>setNewExName(e.target.value)} placeholder="Übungsname"
