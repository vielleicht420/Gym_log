                      fontFamily:"'Nunito',sans-serif",fontSize:".75rem",fontWeight:800,
                      letterSpacing:".5px",textTransform:"uppercase"}}>
                    Training löschen
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}


function StatsPage({allDays, prs, bodyWeights, onSaveBW, weekGoal, onSetWeekGoal, timerDuration, onSetTimerDuration, customPlans=[], onSavePlans}) {
  const [showWeeklyReview, setShowWeeklyReview] = useState(false);
  const [bwInput,setBwInput]=useState("");
  const [selectedEx,setSelectedEx]=useState("");
  const [graphExpanded,setGraphExpanded]=useState(false);
  const [bwExpanded,setBwExpanded]=useState(false);
  const [statsTab,setStatsTab]=useState("stats");


  // Streak
  let streak=0;
  const sd=new Date(today());
  const todayInfo=allDays[dateKey(sd)];
  if(!todayInfo?.type||todayInfo.type==="rest") sd.setDate(sd.getDate()-1);
  for(let i=0;i<365;i++){const di=allDays[dateKey(sd)];if(di?.type&&di.type!=="rest"){streak++;sd.setDate(sd.getDate()-1);}else break;}

  const weekSessions=Object.entries(allDays).filter(([k,v])=>{try{return v?.type&&v.type!=="rest"&&isSameWeek(new Date(k),today());}catch{return false;}}).length;
  let totalSessions=0;
  Object.values(allDays).forEach(di=>{if(di?.type&&di.type!=="rest") totalSessions++;});

  const graphPoints=[];
  Object.entries(allDays).sort(([a],[b])=>a.localeCompare(b)).forEach(([dk,di])=>{
    if(!di?.sections) return;
    // Search in all plans (default + custom)
    let found=false;
    DEFAULT_PLAN.forEach(tab=>tab.sections.forEach((sec,si)=>sec.exercises.forEach((ex,ei)=>{
      if(found||ex.id!==selectedEx) return;
      const ed=di.sections?.[si]?.[ei];if(!ed) return;
      let max=0;
      Object.values(ed).forEach(s=>{
        // Support bodyweight exercises: use reps as value if no weight
        const w=s.w&&parseFloat(s.w)>0?parseFloat(s.w):s.r&&parseFloat(s.r)>0?parseFloat(s.r):0;
        if(w>max) max=w;
      });
      if(max>0){graphPoints.push({x:graphPoints.length,y:max,label:dk.slice(5)});found=true;}
    })));
    if(!found) customPlans.forEach(cp=>cp.sections?.forEach((sec,si)=>sec.exercises?.forEach((ex,ei)=>{
      if(found||ex.id!==selectedEx) return;
      const ed=di.sections?.[si]?.[ei];if(!ed) return;
      let max=0;
      Object.values(ed).forEach(s=>{
        const w=s.w&&parseFloat(s.w)>0?parseFloat(s.w):s.r&&parseFloat(s.r)>0?parseFloat(s.r):0;
        if(w>max) max=w;
      });
      if(max>0){graphPoints.push({x:graphPoints.length,y:max,label:dk.slice(5)});found=true;}
    })));
  });

  const examplePoints=[{x:0,y:60,label:"01-06"},{x:1,y:62,label:"01-09"},{x:2,y:65,label:"01-13"},{x:3,y:67,label:"01-16"},{x:4,y:70,label:"01-20"},{x:5,y:72,label:"01-23"}];
  const bwExPoints=[{x:0,y:82,label:"04-01"},{x:1,y:81.5,label:"04-05"},{x:2,y:81,label:"04-09"},{x:3,y:80.5,label:"04-13"},{x:4,y:80,label:"04-17"},{x:5,y:79.5,label:"04-21"}];
  const allExercises=[...DEFAULT_PLAN.flatMap(tab=>tab.sections.flatMap(sec=>sec.exercises)),...customPlans.flatMap(p=>p.sections?.flatMap(s=>s.exercises)||[])];
  const selectedExName=allExercises.find(e=>e.id===selectedEx)?.name??"";

  function saveBW(){if(!bwInput) return;const val=parseFloat(bwInput);if(isNaN(val)||val<=0) return;const entry={date:dateKey(today()),weight:val};onSaveBW([entry,...(bodyWeights||[]).filter(e=>e.date!==entry.date)].slice(0,90));setBwInput("");}
  function deleteBW(date){onSaveBW((bodyWeights||[]).filter(e=>e.date!==date));}
  const bwPoints=(bodyWeights||[]).slice(0,30).reverse().map((e,i)=>({x:i,y:e.weight,label:e.date.slice(5)}));
  const timerPresets=[30,60,90,120,180,240];
  const earned=getEarnedAchievements(allDays,prs);

  return (
    <div className="stats-page">
      {/* Sub tabs */}
      <div className="stats-subtabs" style={{display:"flex",background:"var(--card)",borderRadius:"14px",padding:"4px",gap:"4px",marginBottom:"16px",border:"1px solid rgba(255,255,255,.06)"}}>
        {[["stats","Stats"],["history","Verlauf"],["muscles","Muskeln"],["prs","Rekorde"],["achievements","Abzeichen"]].map(([key,label])=>(
          <button key={key} onClick={()=>setStatsTab(key)}
            className={statsTab===key?"stats-tab-active":"stats-tab-inactive"}
            style={{flex:1,padding:"8px",textAlign:"center",fontSize:".65rem",fontWeight:800,
              letterSpacing:".5px",textTransform:"uppercase",cursor:"pointer",border:"none",
              background:statsTab===key?"var(--acc)":"none",
              borderRadius:"10px",transition:"all .2s",fontFamily:"'Nunito',sans-serif"}}>
            {label}
          </button>
        ))}
      </div>

      {statsTab==="history"&&<HistoryPage allDays={allDays} customPlans={customPlans}/>}

      {statsTab==="muscles"&&<MuscleMapPage allDays={allDays} customPlans={customPlans}/>}

      {statsTab==="prs"&&<PRsPage prs={prs} allDays={allDays} customPlans={customPlans}/>}

      {statsTab==="achievements"&&(
        <div>
          <div style={{fontSize:".62rem",color:"var(--mut)",fontWeight:700,marginBottom:"12px"}}>{earned.size} / {ACHIEVEMENTS.length} freigeschaltet</div>
          <div className="badge-grid">
            {ACHIEVEMENTS.map(a=>(
              <div key={a.id} className={`achieve-card${earned.has(a.id)?" earned":" locked"}`}>
                <div className="achieve-icon">{a.icon}</div>
                <div className="achieve-name">{a.name}</div>
                <div className="achieve-desc">{a.desc}</div>
                {earned.has(a.id)&&<div style={{fontSize:".5rem",color:"var(--gold)",fontWeight:800}}>✓ Verdient</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {statsTab==="stats"&&<>
        <WeeklyReview allDays={allDays} prs={prs}/>

        <div className="streak-row">
          <div className="streak-mini"><div className="streak-icon">🔥</div><div className="streak-info"><div className="streak-val">{streak}</div><div className="streak-lbl">Tage Streak</div></div></div>
          <div className="streak-mini"><div className="streak-icon">🏋️</div><div className="streak-info"><div className="streak-val">{totalSessions}</div><div className="streak-lbl">Trainings</div></div></div>
        </div>

        <div className="week-goal-card">
          <div className="week-goal-header"><div className="week-goal-title">Wochenziel</div><div className="week-goal-count">{weekSessions}/{weekGoal}</div></div>
          <div className="week-pips">{Array.from({length:weekGoal},(_,i)=><div key={i} className={`pip${i<weekSessions?" done":""}`}/>)}</div>
          <div className="week-goal-sub">{weekSessions>=weekGoal?"Ziel erreicht!":` Noch ${weekGoal-weekSessions} bis zum Ziel`}</div>
          <div className="week-goal-adj"><div className="week-goal-adj-lbl">Ziel anpassen</div><button className="goal-stepper" disabled={weekGoal<=1} onClick={()=>onSetWeekGoal(weekGoal-1)}>-</button><div className="goal-val">{weekGoal}x</div><button className="goal-stepper" disabled={weekGoal>=7} onClick={()=>onSetWeekGoal(weekGoal+1)}>+</button></div>
        </div>

        <div className="stats-section-title">Pausentimer</div>
        <div className="timer-settings-card">
          <div style={{fontSize:".8rem",fontWeight:600,marginBottom:"4px"}}>Pausenlänge</div>
          <div style={{fontSize:".65rem",color:"var(--mut)",marginBottom:"10px"}}>Aktuell: <strong style={{color:"var(--acc)"}}>{Math.floor(timerDuration/60)}:{String(timerDuration%60).padStart(2,"0")} min</strong></div>
          <div className="timer-presets">{timerPresets.map(s=><button key={s} className={`timer-preset${timerDuration===s?" active":""}`} onClick={()=>onSetTimerDuration(s)}>{s<60?`${s}s`:`${s/60} min`}</button>)}</div>
          <div style={{display:"flex",alignItems:"center",gap:"8px",marginTop:"12px",paddingTop:"10px",borderTop:"1px solid var(--bdr)"}}>
            <div style={{fontSize:".65rem",color:"var(--mut)",flex:1}}>Eigene Zeit (Sekunden)</div>
            <input type="number" min="10" max="600" value={timerDuration} onChange={e=>{const v=parseInt(e.target.value);if(v>=10&&v<=600) onSetTimerDuration(v);}} style={{background:"var(--bg)",border:"1px solid var(--bdr)",borderRadius:"7px",color:"var(--txt)",fontFamily:"'DM Sans',sans-serif",padding:"6px 10px",width:"80px",textAlign:"center"}}/>
          </div>
        </div>

        {Object.keys(prs).length>0&&<>
          <div className="stats-section-title">Persönliche Bestleistungen</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
            {allExercises.filter(ex=>prs[ex.id]).map(ex=>(
              <div key={ex.id} style={{background:"var(--card)",border:"1px solid var(--bdr)",borderRadius:"10px",padding:"10px 12px",display:"flex",flexDirection:"column",gap:"4px"}}>
                <div style={{fontSize:".68rem",color:"var(--mut)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ex.name}</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",color:"var(--gold)",lineHeight:1}}>{prs[ex.id]} kg</div>
              </div>
            ))}
          </div>
        </>}

        <div className="stats-section-title">Verlauf</div>
        <div className="graph-card">
          <div className="graph-title">Maximales Gewicht pro Training</div>
          <div className="graph-sub">{!selectedEx?"Wähle eine Übung":graphPoints.length>=2?"Antippen für Details":graphPoints.length===0?"Noch keine Daten":"1 Eintrag - noch 1 weiteres Training"}</div>
          <select className="graph-select" value={selectedEx} onChange={e=>{setSelectedEx(e.target.value);setGraphExpanded(false);}}>
            <option value="">— Übung wählen —</option>
            {allExercises.map(ex=><option key={ex.id} value={ex.id}>{ex.name}</option>)}
          </select>
          {!selectedEx&&<><div style={{fontSize:".62rem",color:"var(--mut)",marginBottom:"6px",fontStyle:"italic"}}>Beispiel:</div><BigGraph points={examplePoints} color="#444b55" isExample={true}/></>}
          {selectedEx&&graphPoints.length>=2&&<BigGraph points={graphPoints} onTap={()=>setGraphExpanded(true)}/>}
          {selectedEx&&graphPoints.length===0&&<><div style={{fontSize:".62rem",color:"var(--mut)",marginBottom:"6px",fontStyle:"italic"}}>So wird es aussehen:</div><BigGraph points={examplePoints} color="#444b55" isExample={true}/></>}
        </div>
        {graphExpanded&&<GraphModal points={graphPoints} exName={selectedExName} onClose={()=>setGraphExpanded(false)}/>}

        <div className="stats-section-title">Körpergewicht</div>
        <div className="bw-card">
          <div className="bw-input-row"><input className="bw-input" type="number" step="0.1" placeholder="z.B. 78.5" value={bwInput} onChange={e=>setBwInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveBW()}/><button className="bw-save-btn" onClick={saveBW}>Eintragen</button></div>
          <div style={{fontSize:".62rem",color:"var(--mut)",marginBottom:"10px"}}>Dein Gewicht heute in kg</div>
          <div style={{background:"var(--bg)",borderRadius:"10px",padding:"10px 8px 4px",marginBottom:"10px"}}>
            {bwPoints.length>=2?<BigGraph points={bwPoints} color="#3fd4a0" onTap={()=>setBwExpanded(true)}/>:<><div style={{fontSize:".62rem",color:"var(--mut)",marginBottom:"4px",fontStyle:"italic"}}>{bwPoints.length===0?"Beispiel:":"Noch 1 Eintrag:"}</div><BigGraph points={bwExPoints} color="#1a5a40" isExample={true}/></>}
          </div>
          {(bodyWeights||[]).length>0&&<div className="bw-list">{(bodyWeights||[]).map((e,i)=><div key={i} className="bw-entry"><div className="bw-entry-date">{e.date}</div><div className="bw-entry-val">{e.weight} kg</div><button className="bw-del" onClick={()=>deleteBW(e.date)}>x</button></div>)}</div>}
        </div>
        {bwExpanded&&bwPoints.length>=2&&<GraphModal points={bwPoints} exName="Körpergewicht" color="#3fd4a0" onClose={()=>setBwExpanded(false)}/>}

      </>}
      {showWeeklyReview&&<WeeklyReviewModal allDays={allDays} onClose={()=>setShowWeeklyReview(false)}/>}
    </div>
  );
}


// ── Custom Plan Creator ──────────────────────────────────────────────────────
const PLAN_COLORS = ["#7dd3fc","#86efac","#f9a8d4","#fbbf24","#a78bfa","#fb923c","#34d399","#f87171"];

function NewPlanModal({onSave, onClose, editPlan=null}) {
  const [step, setStep] = React.useState(0);
  const [name, setName] = React.useState(editPlan?.name||"");
  const [color, setColor] = React.useState(editPlan?.color||PLAN_COLORS[0]);
  const [sections, setSections] = React.useState(editPlan?.sections||[{label:"ÜBUNGEN",exercises:[]}]);
  const [activeSec, setActiveSec] = React.useState(0);
  const [addingEx, setAddingEx] = React.useState(false);
  const [newExName, setNewExName] = React.useState("");
  const [newExSets, setNewExSets] = React.useState(3);
  const [newExReps, setNewExReps] = React.useState("8-12");
  const [newSecName, setNewSecName] = React.useState(null);

  const totalEx = sections.reduce((a,s)=>a+s.exercises.length,0);
  const canSave = name.trim() && totalEx > 0;

  function addExercise() {
    if(!newExName.trim()) return;
    const ex={id:"cx_"+Date.now(),name:newExName.trim(),sets:newExSets,reps:newExReps,badge:"a"};
    setSections(s=>s.map((sec,i)=>i===activeSec?{...sec,exercises:[...sec.exercises,ex]}:sec));
    setNewExName(""); setAddingEx(false);
  }
  function removeExercise(si,ei) {
    setSections(s=>s.map((sec,i)=>i===si?{...sec,exercises:sec.exercises.filter((_,j)=>j!==ei)}:sec));
  }
  function removeSection(i) {
    if(sections.length<=1) return;
    setSections(s=>s.filter((_,idx)=>idx!==i));
    setActiveSec(Math.max(0,activeSec-1));
  }

  // Full screen layout
  return (
    <div style={{position:"fixed",inset:0,zIndex:900,background:"linear-gradient(160deg,#08070f 0%,#0e0b18 50%,#130d1e 100%)",
      display:"flex",flexDirection:"column",overflowY:"hidden"}}>

      {/* ── HEADER ── */}
      <div style={{flexShrink:0,padding:"16px 20px 0",
        borderBottom:"1px solid rgba(255,255,255,.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <button onClick={step===1?()=>setStep(0):onClose}
            style={{background:"rgba(255,255,255,.06)",border:"none",borderRadius:12,
              padding:"8px 14px",cursor:"pointer",color:"var(--txt)",
              fontFamily:"'Nunito',sans-serif",fontSize:".78rem",fontWeight:800,
              display:"flex",alignItems:"center",gap:6,marginLeft:8}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M19 12H5"/><polyline points="12,19 5,12 12,5"/>
            </svg>
            {step===1?"Zurück":"Abbrechen"}
          </button>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".95rem",fontWeight:900,
              letterSpacing:"1px"}}>
              {editPlan?"Plan bearbeiten":"Neuer Plan"}
            </div>
          </div>
          {/* Step indicator */}
          <div style={{display:"flex",gap:4}}>
            {[0,1].map(i=>(
              <div key={i} style={{height:4,borderRadius:2,transition:"all .3s",
                width:i===step?24:8,
                background:i===step?"var(--acc)":"rgba(255,255,255,.15)"}}/>
            ))}
          </div>
        </div>

        {/* Step tabs */}
        <div style={{display:"flex",gap:0,marginBottom:-1}}>
          {["Name & Farbe","Übungen"].map((label,i)=>(
            <div key={i} onClick={()=>i===0||name.trim()?setStep(i):null}
              style={{padding:"8px 16px",cursor:i===0||name.trim()?"pointer":"default",
                fontSize:".65rem",fontWeight:800,letterSpacing:".5px",textTransform:"uppercase",
                color:step===i?"var(--acc)":"var(--mut)",
                borderBottom:step===i?"2px solid var(--acc)":"2px solid transparent",
                transition:"all .2s",fontFamily:"'Nunito',sans-serif"}}>
              {label}
            </div>
          ))}
        </div>
      </div>

      {/* ── STEP 0: Name + Color ── */}
      {step===0&&(
        <div style={{flex:1,overflowY:"auto",padding:"24px 20px"}}>
          {/* Preview */}
          <div style={{display:"flex",alignItems:"center",gap:14,padding:"16px",
            background:color+"12",borderRadius:20,border:"1.5px solid "+color+"33",
            marginBottom:28}}>
            <div style={{width:52,height:52,borderRadius:16,background:color+"22",
              border:"1.5px solid "+color+"44",display:"flex",alignItems:"center",
              justifyContent:"center",fontFamily:"'Montserrat',sans-serif",
              fontSize:"1.4rem",fontWeight:900,color,flexShrink:0}}>
              {name.trim()[0]?.toUpperCase()||"?"}
            </div>
            <div>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.1rem",
                fontWeight:900,color:color}}>{name||"Plan Name..."}</div>
              <div style={{fontSize:".65rem",color:"rgba(255,255,255,.4)",marginTop:3,fontWeight:600}}>
                {sections.length} Abschnitt{sections.length!==1?"e":""} · {totalEx} Übungen
              </div>
            </div>
          </div>

          {/* Name */}
          <div style={{marginBottom:28}}>
            <div style={{fontSize:".6rem",letterSpacing:"2px",textTransform:"uppercase",
              color:"var(--mut)",fontWeight:800,marginBottom:10}}>Plan Name</div>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="z.B. Push · Legs · Fullbody"
              autoFocus
              style={{width:"100%",background:"var(--card)",border:"1.5px solid var(--bdr)",
                borderRadius:16,color:"var(--txt)",fontFamily:"'Nunito',sans-serif",
                fontSize:"1.05rem",fontWeight:700,padding:"15px 18px",outline:"none"}}
              onFocus={e=>e.target.style.borderColor="var(--acc)"}
              onBlur={e=>e.target.style.borderColor="var(--bdr)"}
              onKeyDown={e=>e.key==="Enter"&&name.trim()&&setStep(1)}/>
          </div>

          {/* Color */}
          <div style={{marginBottom:32}}>
            <div style={{fontSize:".6rem",letterSpacing:"2px",textTransform:"uppercase",
              color:"var(--mut)",fontWeight:800,marginBottom:14}}>Farbe</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
              {PLAN_COLORS.map(c=>(
                <div key={c} onClick={()=>setColor(c)}
                  style={{width:32,height:32,borderRadius:"50%",background:c,cursor:"pointer",
                    border:`2.5px solid ${color===c?"#fff":"transparent"}`,
                    boxShadow:color===c?`0 0 0 2px ${c}`:"none",
                    transform:color===c?"scale(1.15)":"scale(1)",transition:"all .2s",
                    display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {color===c&&!PLAN_COLORS.includes(color)===false&&<svg width="11" height="11" viewBox="0 0 14 14" fill="none"
                    stroke="#000" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="2,7 5.5,10.5 12,3.5"/>
                  </svg>}
                </div>
              ))}
              {/* Custom color picker */}
              <div style={{position:"relative",width:32,height:32,flexShrink:0}}>
                <div style={{width:32,height:32,borderRadius:"50%",
                  border:`2.5px solid ${!PLAN_COLORS.includes(color)?"#fff":"rgba(255,255,255,.25)"}`,
                  boxShadow:!PLAN_COLORS.includes(color)?`0 0 0 2px ${color}`:"none",
                  transform:!PLAN_COLORS.includes(color)?"scale(1.15)":"scale(1)",
                  transition:"all .2s",
                  background:!PLAN_COLORS.includes(color)
                    ? color
                    : "linear-gradient(135deg,#f9a8d4,#a78bfa,#7dd3fc)",
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {PLAN_COLORS.includes(color)&&(
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                      stroke="rgba(255,255,255,.8)" strokeWidth="2.5"
                      strokeLinecap="round" strokeLinejoin="round">
                      <line x1="12" y1="5" x2="12" y2="19"/>
                      <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                  )}
                  {!PLAN_COLORS.includes(color)&&(
                    <svg width="10" height="10" viewBox="0 0 14 14" fill="none"
                      stroke="#000" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="2,7 5.5,10.5 12,3.5"/>
                    </svg>
                  )}
                </div>
                <input type="color" value={color} onChange={e=>setColor(e.target.value)}
                  style={{position:"absolute",inset:0,opacity:0,width:"100%",height:"100%",
                    cursor:"pointer",border:"none",padding:0,margin:0}}/>
              </div>
            </div>
          </div>

          <button onClick={()=>name.trim()&&setStep(1)} disabled={!name.trim()}
            style={{width:"100%",background:name.trim()?"var(--acc)":"rgba(255,255,255,.08)",
              color:name.trim()?"var(--acc-txt,#080a0f)":"var(--mut)",border:"none",
              borderRadius:18,padding:"17px",cursor:name.trim()?"pointer":"default",
              fontFamily:"'Montserrat',sans-serif",fontSize:"1rem",fontWeight:900,
              letterSpacing:"2px",textTransform:"uppercase"}}>
            Weiter →
          </button>
        </div>
      )}

      {/* ── STEP 1: Sections + Exercises ── */}
      {step===1&&(
        <div style={{flex:1,display:"flex",flexDirection:"column",overflowY:"hidden"}}>
          {/* Section tabs */}
          <div style={{flexShrink:0,padding:"14px 20px 0",
            borderBottom:"1px solid rgba(255,255,255,.06)"}}>
            <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:14}}>
              {sections.map((sec,i)=>(
                <button key={i} onClick={()=>setActiveSec(i)}
                  style={{padding:"8px 18px",borderRadius:20,border:"none",cursor:"pointer",
                    background:activeSec===i?"var(--acc)":"rgba(255,255,255,.06)",
                    color:activeSec===i?"var(--acc-txt,#080a0f)":"var(--mut)",
                    fontSize:".65rem",fontWeight:800,letterSpacing:".5px",textTransform:"uppercase",
                    fontFamily:"'Nunito',sans-serif",whiteSpace:"nowrap",flexShrink:0,
                    display:"flex",alignItems:"center",gap:6,transition:"all .2s"}}>
                  {sec.label}
                  <span style={{background:activeSec===i?"rgba(0,0,0,.15)":"rgba(255,255,255,.1)",
                    borderRadius:10,padding:"1px 6px",fontSize:".55rem",fontWeight:900}}>
                    {sec.exercises.length}
                  </span>
                </button>
              ))}
              <button onClick={()=>setNewSecName("")}
                style={{padding:"8px 14px",borderRadius:20,
                  border:"1.5px dashed rgba(255,255,255,.2)",cursor:"pointer",
                  background:"none",color:"var(--mut)",fontSize:".65rem",fontWeight:800,
                  fontFamily:"'Nunito',sans-serif",whiteSpace:"nowrap",flexShrink:0}}>
                + Abschnitt
              </button>
            </div>
          </div>

          {/* Exercises list */}
          <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
            {sections[activeSec]?.exercises.length===0?(
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",
                justifyContent:"center",padding:"40px 20px",gap:12,opacity:.5}}>
                <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:".85rem",
                  fontWeight:800,letterSpacing:"2px",color:"var(--mut)"}}>
                  KEINE ÜBUNGEN
                </div>
                <div style={{fontSize:".7rem",color:"var(--mut)",fontWeight:600}}>
                  Füge deine erste Übung hinzu
                </div>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
                {sections[activeSec]?.exercises.map((ex,ei)=>(
                  <div key={ei} style={{display:"flex",alignItems:"center",gap:12,
                    background:"var(--card)",border:"1px solid var(--bdr)",
                    borderRadius:16,padding:"13px 16px"}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:".88rem",fontWeight:700}}>{ex.name}</div>
                      <div style={{fontSize:".65rem",color:"var(--mut)",fontWeight:600,marginTop:2}}>
                        {ex.sets} Sätze · {ex.reps} Wdh.
                      </div>
                    </div>
                    <button onClick={()=>removeExercise(activeSec,ei)}
                      style={{background:"rgba(248,113,113,.1)",border:"1px solid rgba(248,113,113,.2)",
                        borderRadius:10,padding:"6px 10px",cursor:"pointer",color:"var(--red)",
                        fontSize:".7rem",fontWeight:800,fontFamily:"'Nunito',sans-serif"}}>
                      Entf.
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* Add exercise form */}
            {addingEx?(
              <div style={{background:"var(--card)",border:"1.5px solid var(--acc)",
                borderRadius:18,padding:"16px",marginBottom:12}}>
                <div style={{fontSize:".6rem",letterSpacing:"2px",textTransform:"uppercase",
                  color:"var(--mut)",fontWeight:800,marginBottom:10}}>Neue Übung</div>
                <input value={newExName} onChange={e=>setNewExName(e.target.value)}
                  placeholder="Übungsname..."
                  autoFocus
                  style={{width:"100%",background:"var(--bg)",border:"1px solid var(--bdr)",
                    borderRadius:12,color:"var(--txt)",fontFamily:"'Nunito',sans-serif",
                    fontSize:".95rem",fontWeight:700,padding:"12px 14px",outline:"none",
                    marginBottom:12}}
                  onKeyDown={e=>e.key==="Enter"&&addExercise()}/>
                <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:".58rem",color:"var(--mut)",fontWeight:700,
                      letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>Sätze</div>
                    <div style={{display:"flex",alignItems:"center",background:"var(--bg)",
                      border:"1px solid var(--bdr)",borderRadius:12,overflow:"hidden"}}>
                      <button onClick={()=>setNewExSets(s=>Math.max(1,s-1))}
                        style={{background:"none",border:"none",color:"var(--txt)",padding:"10px 16px",
                          cursor:"pointer",fontSize:"1.1rem",fontWeight:800}}>−</button>
                      <div style={{flex:1,textAlign:"center",fontFamily:"'Montserrat',sans-serif",
                        fontSize:"1rem",fontWeight:900}}>{newExSets}</div>
                      <button onClick={()=>setNewExSets(s=>Math.min(10,s+1))}
                        style={{background:"none",border:"none",color:"var(--txt)",padding:"10px 16px",
                          cursor:"pointer",fontSize:"1.1rem",fontWeight:800}}>+</button>
                    </div>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:".58rem",color:"var(--mut)",fontWeight:700,
                      letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>Wdh.</div>
                    <input value={newExReps} onChange={e=>setNewExReps(e.target.value)}
                      style={{width:"100%",background:"var(--bg)",border:"1px solid var(--bdr)",
                        borderRadius:12,color:"var(--txt)",fontFamily:"'Nunito',sans-serif",
                        fontSize:".95rem",fontWeight:700,padding:"10px 14px",outline:"none",
                        textAlign:"center"}}/>
                  </div>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={addExercise} disabled={!newExName.trim()}
                    style={{flex:2,background:newExName.trim()?"var(--acc)":"rgba(255,255,255,.08)",
                      color:newExName.trim()?"var(--acc-txt,#080a0f)":"var(--mut)",
                      border:"none",borderRadius:14,padding:"13px",cursor:"pointer",
                      fontFamily:"'Montserrat',sans-serif",fontSize:".85rem",fontWeight:900,
                      letterSpacing:"1px",textTransform:"uppercase"}}>
                    Hinzufügen
                  </button>
                  <button onClick={()=>{setAddingEx(false);setNewExName("");}}
                    style={{flex:1,background:"rgba(255,255,255,.06)",
                      border:"1px solid rgba(255,255,255,.1)",borderRadius:14,padding:"13px",
                      cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",
                      fontSize:".82rem",fontWeight:700}}>
                    Abbruch
                  </button>
                </div>
              </div>
            ):(
              <button onClick={()=>setAddingEx(true)}
                style={{width:"100%",background:"none",border:"1.5px dashed rgba(255,255,255,.15)",
                  borderRadius:16,padding:"14px",cursor:"pointer",color:"var(--acc3)",
                  fontFamily:"'Nunito',sans-serif",fontSize:".82rem",fontWeight:800,
                  display:"flex",alignItems:"center",justifyContent:"center",gap:8,
                  marginBottom:12}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Übung hinzufügen
              </button>
            )}

            {/* Delete section */}
            {sections.length>1&&!addingEx&&(
              <button onClick={()=>removeSection(activeSec)}
                style={{width:"100%",background:"none",border:"1px solid rgba(248,113,113,.15)",
                  borderRadius:14,padding:"11px",cursor:"pointer",color:"var(--red)",
                  fontFamily:"'Nunito',sans-serif",fontSize:".75rem",fontWeight:700,
                  marginTop:4}}>
                Abschnitt „{sections[activeSec]?.label}" löschen
              </button>
            )}
          </div>

          {/* Save button */}
          <div style={{flexShrink:0,padding:"12px 20px",
            borderTop:"1px solid rgba(255,255,255,.06)",
            paddingBottom:"max(12px,env(safe-area-inset-bottom))"}}>
            <button onClick={()=>{
              if(canSave) onSave({
                id:editPlan?.id||"p_"+Date.now(),
                name:name.trim(),color,sections,
                icon:name.trim()[0]?.toUpperCase()
              });
            }} disabled={!canSave}
              style={{width:"100%",background:canSave?"var(--acc)":"rgba(255,255,255,.08)",
                color:canSave?"var(--acc-txt,#080a0f)":"var(--mut)",border:"none",
                borderRadius:16,padding:"16px",cursor:canSave?"pointer":"default",
                fontFamily:"'Montserrat',sans-serif",fontSize:".95rem",fontWeight:900,
                letterSpacing:"2px",textTransform:"uppercase"}}>
              {editPlan?"Änderungen speichern":"Plan erstellen"}
            </button>
          </div>
        </div>
      )}

      {/* Add section overlay */}
      {newSecName!==null&&(
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",
          backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",zIndex:10}}>
          <div style={{width:"100%",background:"var(--sur)",borderRadius:"24px 24px 0 0",
            padding:"20px 20px 40px",boxShadow:"0 -8px 40px rgba(0,0,0,.6)"}}>
            <div style={{width:36,height:4,background:"rgba(255,255,255,.15)",borderRadius:2,
              margin:"0 auto 20px"}}/>
            <div style={{fontSize:".65rem",color:"var(--mut)",fontWeight:800,letterSpacing:"2px",
              textTransform:"uppercase",marginBottom:12}}>Neuer Abschnitt</div>
            <input value={newSecName} onChange={e=>setNewSecName(e.target.value)}
              placeholder="z.B. Brust, Rücken, Beine..."
              autoFocus
              style={{width:"100%",background:"var(--card)",border:"1.5px solid var(--acc)",
                borderRadius:14,color:"var(--txt)",fontFamily:"'Nunito',sans-serif",
                fontSize:"1rem",fontWeight:700,padding:"14px 16px",outline:"none",marginBottom:14}}
              onKeyDown={e=>{
                if(e.key==="Enter"&&newSecName.trim()){
                  setSections(s=>[...s,{label:newSecName.trim().toUpperCase(),exercises:[]}]);
                  setActiveSec(sections.length);
                  setNewSecName(null);
                }
                if(e.key==="Escape") setNewSecName(null);
              }}/>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{
                if(newSecName.trim()){
                  setSections(s=>[...s,{label:newSecName.trim().toUpperCase(),exercises:[]}]);
                  setActiveSec(sections.length);
                }
                setNewSecName(null);
              }} style={{flex:1,background:"var(--acc)",border:"none",borderRadius:14,
                padding:"14px",cursor:"pointer",color:"var(--acc-txt,#080a0f)",
                fontFamily:"'Montserrat',sans-serif",fontSize:".9rem",fontWeight:900,
                letterSpacing:"1px",textTransform:"uppercase"}}>
                Hinzufügen
              </button>
              <button onClick={()=>setNewSecName(null)}
                style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",
                  borderRadius:14,padding:"14px 20px",cursor:"pointer",color:"var(--mut)",
                  fontFamily:"'Nunito',sans-serif",fontSize:".85rem",fontWeight:700}}>
                Abbruch
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ── Custom TrainingPage ───────────────────────────────────────────────────────
function CustomTrainingPage({plan, dayData={}, onUpdate, onChangeType, prs, onNewPR, timerDuration=90, allDays={}, currentDk=""}) {
  const [activeSec,setActiveSec]=React.useState(0);
  const [activeEx,setActiveEx]=React.useState(0);
  const [paused,setPaused]=useState(false);
  const [showPauseMenu,setShowPauseMenu]=useState(false);
  const [focusFlash,setFocusFlash]=useState(false);
  const [flashPos,setFlashPos]=useState({x:"50%",y:"50%"});
  const pausedAt=React.useRef(null);
  const focusBtnRef=React.useRef(null);
  const flashTimerRef=React.useRef(null);
  const [focusMode,setFocusMode]=React.useState(()=>{try{return localStorage.getItem('focusMode')==='1';}catch(e){return false;}});
  function toggleFocus(val){setFocusMode(val);localStorage.setItem('focusMode',val?'1':'0');const btn=focusBtnRef.current;if(btn){const r=btn.getBoundingClientRect();setFlashPos({x:r.left+r.width/2+'px',y:r.top+r.height/2+'px'});}if(flashTimerRef.current)clearTimeout(flashTimerRef.current);setFocusFlash(false);requestAnimationFrame(()=>{setFocusFlash(true);flashTimerRef.current=setTimeout(()=>{setFocusFlash(false);flashTimerRef.current=null;},1700);});}
  function handlePause(){setPaused(true);setShowPauseMenu(true);try{pausedAt.current=Date.now();}catch(e){}}
  function handleResume(){
    if(pausedAt.current){try{const saved=localStorage.getItem('workout_start');if(saved){const elapsed=Date.now()-pausedAt.current;localStorage.setItem('workout_start',String(parseInt(saved)+elapsed));}}catch(e){}}
    setPaused(false);setShowPauseMenu(false);pausedAt.current=null;
  }
  function handleAbort(){try{localStorage.removeItem('workout_start');}catch(e){}setShowPauseMenu(false);setPaused(false);onChangeType();}
  const [wSecs, setWSecs] = React.useState(()=>{
    try{
      const saved=localStorage.getItem('workout_start');
      if(saved) return Math.floor((Date.now()-parseInt(saved))/1000);
    }catch(e){}
    return 0;
  });
  const [timerRunning, setTimerRunning] = React.useState(true);
  React.useEffect(()=>{
    if(!timerRunning) return;
    const iv=setInterval(()=>{
      const saved=localStorage.getItem('workout_start');
      if(saved) setWSecs(Math.floor((Date.now()-parseInt(saved))/1000));
    },500);
    return()=>clearInterval(iv);
  },[timerRunning]);
  const [showTimer,setShowTimer]=useState(false);
  const [showConfetti,setShowConfetti]=useState(false);
  const prevDoneRef=useRef(0);
  const confettiShownRef=useRef(false); // only show once per session
  const overrides=dayData?.overrides??{};
  let total=0,done=0;
  plan.sections.forEach((s,si)=>{s.exercises.forEach((ex,ei)=>{
    const ov=overrides[`${si}_${ei}`]??{};
    const effSets=ov.sets??ex.sets;
    total+=effSets;
    const ed=dayData?.sections?.[si]?.[ei]??{};
    for(let i=0;i<effSets;i++){const sd=ed[i]??{};if(sd.r&&parseFloat(sd.r)>0) done++;}
  });});
  useEffect(()=>{
    if(total>0&&done===total&&prevDoneRef.current<total&&!confettiShownRef.current){
      confettiShownRef.current=true;
      setShowConfetti(true);
      setTimerRunning(false);
      localStorage.removeItem('workout_start');
      onUpdate({...dayData, duration: wSecs});
    }
    prevDoneRef.current=done;
  },[done,total]);
  function upEx(si,ei,val){onUpdate({...dayData,sections:{...dayData?.sections,[si]:{...dayData?.sections?.[si],[ei]:val}}});}
  function saveOverride(si,ei,val){const k=`${si}_${ei}`,newOv={...overrides};if(!val.sets&&!val.reps&&!val.bodyweight) delete newOv[k]; else newOv[k]=val;onUpdate({...dayData,overrides:newOv});}
  function handleSetComplete(exId,weight){
    setShowTimer(true);
    if(weight>0) onNewPR(exId,weight);
    try{if(!localStorage.getItem('workout_start'))localStorage.setItem('workout_start',String(Date.now()));}catch(e){}
  }

  return (
    <div className="page">
      {showConfetti&&<Confetti onDone={()=>setShowConfetti(false)}/>}
      {/* Focus mode fullscreen flash */}


      <div className="statsbar">
        <div className="stat">
          <div className="sv" style={{fontFamily:"'Montserrat',sans-serif",color:"var(--grn)",fontSize:".95rem"}}>
            {String(Math.floor(wSecs/60)).padStart(2,'0')}:{String(wSecs%60).padStart(2,'0')}
          </div>
          <div className="sl">Zeit</div>
        </div>
        <div className="stat"><div className="sv"><CountUp value={done}/></div><div className="sl">Erledigt</div></div>
        <div className="stat"><div className="sv"><CountUp value={total}/></div><div className="sl">Gesamt</div></div>
        {done===total&&total>0&&(
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:"6px",
            background:"rgba(63,212,160,.1)",border:"1px solid rgba(63,212,160,.25)",
            borderRadius:"10px",padding:"5px 10px"}}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#3fd4a0" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="2,6.5 5,9.5 11,3.5"/>
            </svg>
            <span style={{fontSize:".6rem",fontWeight:800,color:"#3fd4a0",letterSpacing:"1px",textTransform:"uppercase"}}>Abgeschlossen</span>
          </div>
        )}
      </div>
      <div className="pbar"><div className="pfill" style={{width:total?(done/total*100)+"%":"0%"}}/></div>
      {showTimer&&<RestTimer onDismiss={()=>setShowTimer(false)} duration={timerDuration}/>}
      <div className="dayhdr" style={{color:plan.color||"var(--txt)"}}>{plan.name.toUpperCase()}</div>
      <div className="daysub">{plan.sections.length} Abschnitte · {plan.sections.reduce((a,s)=>a+s.exercises.length,0)} Übungen</div>
      {/* Abschnitt-Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        {plan.sections.map((s,i)=>{
          let d3=0,t3=0;
          s.exercises.forEach((ex,ei)=>{const ov3=overrides[`${i}_${ei}`]??{};const es3=ov3.sets??ex.sets;const ed3=dayData?.sections?.[i]?.[ei]??{};t3+=es3;for(let j=0;j<es3;j++){const s3=ed3[j]??{};if(s3.r&&parseFloat(s3.r)>0)d3++;}});
          const ok3=t3>0&&d3===t3;
          return <button key={i} onClick={()=>setActiveSec(i)} style={{padding:"7px 16px",borderRadius:20,border:"none",cursor:"pointer",background:activeSec===i?"var(--acc)":ok3?"rgba(63,212,160,.15)":"rgba(255,255,255,.06)",color:activeSec===i?"var(--acc-txt,#080a0f)":ok3?"#3fd4a0":"var(--mut)",fontSize:".62rem",fontWeight:800,letterSpacing:".5px",textTransform:"uppercase",fontFamily:"'Nunito',sans-serif",transition:"all .2s"}}>{ok3?"✓ ":""}{s.label}</button>;
        })}
      </div>
      {/* Focus mode toggle */}
      <div style={{padding:"0 14px 12px"}}>
        <button ref={focusBtnRef} onClick={()=>toggleFocus(!focusMode)}
          style={{width:"100%",padding:"11px",borderRadius:14,cursor:"pointer",
            fontFamily:"'Montserrat',sans-serif",fontSize:".72rem",fontWeight:900,
            letterSpacing:".5px",transition:"background .3s, color .3s",
            border:focusMode?"1px solid rgba(125,211,252,.4)":"1px solid rgba(255,255,255,.08)",
            position:"relative",overflow:"hidden",
            background:focusMode
              ?"linear-gradient(120deg,rgba(99,179,237,.18),rgba(125,211,252,.22),rgba(147,220,255,.18),rgba(99,179,237,.22),rgba(125,211,252,.18))"
              :"rgba(255,255,255,.06)",
            backgroundSize:focusMode?"300% 300%":"100%",
            animation:focusFlash?(focusMode?"focusBtnOutline 1.6s ease-out":"focusBtnOutlinePurple 1.6s ease-out"):
              focusMode?"focusLavaFlow 8s ease-in-out infinite":"none",
            boxShadow:focusMode?"0 0 20px rgba(125,211,252,.2), 0 0 40px rgba(125,211,252,.08)":"0 0 0 0 rgba(167,139,250,0)",
            color:focusMode?"rgba(125,211,252,.95)":"var(--mut)",
            display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          {/* Ripple effect */}
          {focusFlash&&(
            <div style={{position:"absolute",top:"50%",left:"50%",
              width:80,height:80,borderRadius:"50%",pointerEvents:"none",
              background:focusMode?"rgba(255,255,255,.3)":"rgba(125,211,252,.4)",
              animation:"focusRipple .6s ease-out forwards"}}/>
          )}
          <span style={{position:"relative",transition:"transform .3s",
            transform:focusFlash?"scale(1.2)":"scale(1)"}}>
            {focusMode?"◎":"◎"}
          </span>
          <span style={{position:"relative"}}>{focusMode?"FOKUS AN":"FOKUS"}</span>
        </button>
      </div>

      {plan.sections.map((sec,si)=>{
        if(si!==activeSec) return null;

        // Focus mode: show only active exercise
        if(focusMode) {
          const totalEx = sec.exercises.length;
          const ex = sec.exercises[activeEx] || sec.exercises[0];
          const ei = activeEx;
          const prevDk=Object.keys(allDays).filter(k=>k<currentDk&&allDays[k]?.sections?.[si]?.[ei]).sort().reverse()[0];
          const prevExData=prevDk?(allDays[prevDk]?.sections?.[si]?.[ei]??{}):{};
          const exDone = Object.values(dayData?.sections?.[si]?.[ei]||{}).filter(s=>{
            const isBW=!!(overrides[`${si}_${ei}`]?.bodyweight);
            return isBW?parseFloat(s?.r)>0:parseFloat(s?.w)>0&&parseFloat(s?.r)>0;
          }).length >= (overrides[`${si}_${ei}`]?.sets ?? ex.sets ?? 3);

          return (
            <div key={`focus-${si}-${ei}`} style={{padding:"0 14px"}}>
              {/* Progress dots */}
              <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:16}}>
                {sec.exercises.map((_,i)=>{
                  const done = Object.values(dayData?.sections?.[si]?.[i]||{}).filter(s=>{
                    const bw=!!(overrides[`${si}_${i}`]?.bodyweight);
                    return bw?parseFloat(s?.r)>0:parseFloat(s?.w)>0&&parseFloat(s?.r)>0;
                  }).length >= (overrides[`${si}_${i}`]?.sets ?? sec.exercises[i]?.sets ?? 3);
                  return (
                    <button key={i} onClick={()=>setActiveEx(i)}
                      style={{width:i===ei?24:8,height:8,borderRadius:4,border:"none",
                        cursor:"pointer",transition:"all .3s",
                        background:done?"var(--grn)":i===ei?"var(--acc)":"rgba(255,255,255,.15)"}}>
                    </button>
                  );
                })}
              </div>

              {/* Exercise counter */}
              <div style={{textAlign:"center",fontSize:".58rem",color:"var(--mut)",
                fontWeight:700,letterSpacing:"1px",marginBottom:8}}>
                ÜBUNG {ei+1} VON {totalEx}
              </div>

              {/* Active exercise */}
              <div style={{animation:"fadeSlideUp .3s ease both"}}>
                <ExCard key={`${ex.id||ei}-${ei}`} ex={ex} focusMode={focusMode} si={si} ei={ei} allDays={allDays}
                  exData={dayData?.sections?.[si]?.[ei]??{}}
                  overrides={overrides[`${si}_${ei}`]??{}} prs={prs}
                  prevExData={prevExData}
                  onUpdate={v=>upEx(si,ei,v)}
                  onEditSave={v=>saveOverride(si,ei,v)}
                  onDelete={()=>{}} onSetComplete={handleSetComplete} onNewPR={onNewPR}/>
              </div>

              {/* Nav buttons */}
              <div style={{display:"flex",gap:10,marginTop:4}}>
                {ei>0&&(
                  <button onClick={()=>setActiveEx(ei-1)}
                    style={{flex:1,background:"rgba(255,255,255,.06)",
                      border:"1px solid rgba(255,255,255,.1)",borderRadius:14,
                      padding:"13px",cursor:"pointer",color:"var(--mut)",
                      fontFamily:"'Montserrat',sans-serif",fontSize:".72rem",fontWeight:900}}>
                    ← Zurück
                  </button>
                )}
                {ei<totalEx-1?(
                  <button onClick={()=>setActiveEx(ei+1)}
                    style={{flex:2,background:exDone?"var(--acc)":"rgba(255,255,255,.06)",
                      border:exDone?"none":"1px solid rgba(255,255,255,.1)",borderRadius:14,
                      padding:"13px",cursor:"pointer",
                      color:exDone?"var(--acc-txt,#080a0f)":"var(--mut)",
                      fontFamily:"'Montserrat',sans-serif",fontSize:".72rem",fontWeight:900,
                      transition:"all .2s"}}>
                    Weiter →
                  </button>
                ):(
                  activeSec<plan.sections.length-1&&(
                    <button onClick={()=>{setActiveSec(activeSec+1);setActiveEx(0);}}
                      style={{flex:2,background:"var(--acc)",border:"none",borderRadius:14,
                        padding:"13px",cursor:"pointer",
                        color:"var(--acc-txt,#080a0f)",
                        fontFamily:"'Montserrat',sans-serif",fontSize:".72rem",fontWeight:900}}>
                      Nächster Abschnitt →
                    </button>
                  )
                )}
              </div>
            </div>
          );
        }

        return (
          <div key={si} style={{animation:"fadeSlideUp .25s ease both"}}>
            <div className="seclbl">{sec.label}</div>
            {sec.exercises.map((ex,ei)=>{
              const prevDk=Object.keys(allDays).filter(k=>k<currentDk&&allDays[k]?.sections?.[si]?.[ei]).sort().reverse()[0];
              const prevExData=prevDk?(allDays[prevDk]?.sections?.[si]?.[ei]??{}):{};
              return <ExCard key={ex.id||ei} ex={ex} focusMode={focusMode} si={si} ei={ei} allDays={allDays} exData={dayData?.sections?.[si]?.[ei]??{}} overrides={overrides[`${si}_${ei}`]??{}} prs={prs} prevExData={prevExData} onUpdate={v=>upEx(si,ei,v)} onEditSave={v=>saveOverride(si,ei,v)} onDelete={()=>{}} onSetComplete={handleSetComplete} onNewPR={onNewPR}/>;
            })}
            {activeSec<plan.sections.length-1&&<button onClick={()=>setActiveSec(activeSec+1)} style={{width:"100%",background:"rgba(255,255,255,.04)",border:"1.5px solid rgba(255,255,255,.08)",borderRadius:16,padding:"13px",cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",fontSize:".78rem",fontWeight:800,marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>Weiter: {plan.sections[activeSec+1].label} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><polyline points="12,5 19,12 12,19"/></svg></button>}
          </div>
        );
      })}
      <textarea className="notes" placeholder="Notizen zum Training..." value={dayData?.notes??""} onChange={e=>onUpdate({...dayData,notes:e.target.value})}/>
    </div>
  );
}

// ── Plans Page ──────────────────────────────────────────────────────────────
function PlansPage({customPlans=[], onSavePlans, hiddenDefaults=[], onToggleDefault, onSelectTemplate=()=>{}, favoritePlans=[], onSaveFavs=()=>{}}) {
  const [expandedPlan, setExpandedPlan] = useState(null);
  const [showFavsOnly, setShowFavsOnly] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  function toggleFav(id){const next=favoritePlans.includes(id)?favoritePlans.filter(f=>f!==id):[...favoritePlans,id];onSaveFavs(next);}
  const [showNew, setShowNew] = useState(false);
  const [editPlan, setEditPlan] = useState(null);


  function handleSave(plan) {
    const exists = customPlans.find(p=>p.id===plan.id);
    if(exists) onSavePlans(customPlans.map(p=>p.id===plan.id?plan:p));
    else onSavePlans([...customPlans, plan]);
    setShowNew(false); setEditPlan(null);
  }
  function handleDelete(id) {
    onSavePlans(customPlans.filter(p=>p.id!==id));
    setExpandedPlan(null);
  }

  return (
    <div style={{padding:"16px 16px 110px"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,animation:"daySlideIn .6s ease both"}}>
        <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.6rem",
          fontWeight:900,letterSpacing:"2px",marginBottom:4}}>PLÄNE</div>
        <div style={{fontSize:".62rem",color:"var(--mut)",fontWeight:700,letterSpacing:"1px",marginTop:2}}>
          {customPlans.length} {customPlans.length===1?"Plan":"Pläne"}
        </div>
        <button onClick={()=>setShowFavsOnly(f=>!f)}
          style={{padding:"8px 14px",borderRadius:20,cursor:"pointer",
            border:"1px solid",transition:"all .2s",
            background:showFavsOnly?"rgba(255,255,255,.1)":"rgba(255,255,255,.05)",
            borderColor:showFavsOnly?"var(--acc)":"rgba(255,255,255,.1)",
            display:"flex",alignItems:"center",gap:6}}>
          <svg width="13" height="13" viewBox="0 0 24 24"
            fill={showFavsOnly?"var(--acc)":"none"}
            stroke={showFavsOnly?"var(--acc)":"rgba(255,255,255,.4)"}
            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span style={{fontFamily:"'Montserrat',sans-serif",fontSize:".62rem",
            fontWeight:900,letterSpacing:".5px",
            color:showFavsOnly?"var(--acc)":"rgba(255,255,255,.4)"}}>
            Favoriten
          </span>
        </button>
      </div>

      {/* Custom plans */}
      {customPlans.length>0&&(
        <>
          <div style={{fontSize:".55rem",color:"var(--mut)",fontWeight:800,
            letterSpacing:"2px",textTransform:"uppercase",marginBottom:10}}>
            Eigene Pläne
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:24}}>
            {(showFavsOnly?customPlans.filter(p=>favoritePlans.includes(p.id)):customPlans).map((p,pi)=>(
              <div key={p.id} style={{borderRadius:20,overflow:"hidden",
                position:"relative",
                animation:`flowIn .4s ${pi*.06}s ease both`,
                border:`1.5px solid ${p.color||"var(--acc)"}33`,
                background:`linear-gradient(135deg,${p.color||"#ffffff"}0d,rgba(18,14,28,.9))`}}>
                <div style={{display:"flex",alignItems:"center",gap:14,padding:"16px",cursor:"pointer"}}
                  onClick={()=>setExpandedPlan(expandedPlan===p.id?null:p.id)}>
                  {/* Fav star */}
                  <button onClick={e=>{e.stopPropagation();toggleFav(p.id);}}
                    style={{position:"absolute",top:10,right:10,background:"none",
                      border:"none",cursor:"pointer",padding:6,lineHeight:1}}>
                    <svg width="16" height="16" viewBox="0 0 24 24"
                      fill={favoritePlans.includes(p.id)?"var(--acc)":"none"}
                      stroke={favoritePlans.includes(p.id)?"var(--acc)":"rgba(255,255,255,.25)"}
                      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                  </button>
                  {/* Icon */}
                  <div style={{width:44,height:44,borderRadius:14,flexShrink:0,
                    background:`${p.color||"var(--acc)"}22`,
                    border:`1.5px solid ${p.color||"var(--acc)"}44`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:"1.3rem"}}>
                    {p.icon||p.name?.[0]||"💪"}

                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,

                    </div>
                    <div style={{fontSize:".6rem",color:"var(--mut)",fontWeight:700,letterSpacing:".5px"}}>

                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"

                        fontFamily:"'Nunito',sans-serif",fontSize:".72rem",fontWeight:800,
                        color:"var(--txt)"}}>
                      Bearbeiten
                    </button>
                    <button onClick={()=>setConfirmDelete(p.id)}
                      style={{flex:1,padding:"10px",borderRadius:12,cursor:"pointer",
                        background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",
                        fontFamily:"'Nunito',sans-serif",fontSize:".72rem",fontWeight:800,
                        color:"#ef4444"}}>
                      Löschen
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </>
      )}



      {/* New plan button */}
      <button onClick={()=>{setEditPlan(null);setShowNew(true);}}
        style={{width:"100%",padding:"16px",borderRadius:18,cursor:"pointer",
          background:"var(--acc)",border:"none",
          fontFamily:"'Montserrat',sans-serif",fontSize:".82rem",
          fontWeight:900,color:"var(--acc-txt,#080a0f)",letterSpacing:"1px",
          display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        NEUER PLAN
      </button>

      {/* Delete Confirm */}
      {confirmDelete&&(
        <div style={{position:"fixed",inset:0,zIndex:900,
          background:"rgba(0,0,0,.6)",backdropFilter:"blur(8px)",
          WebkitBackdropFilter:"blur(8px)",animation:"bgFadeIn .25s ease both",
          display:"flex",alignItems:"flex-end"}}
          onClick={()=>setConfirmDelete(null)}>
          <div style={{width:"100%",background:"rgba(14,17,23,.97)",
            borderRadius:"24px 24px 0 0",padding:"24px 20px 48px",
            animation:"sheetUp .45s cubic-bezier(.34,1.56,.64,1) both"}}

            <div style={{textAlign:"center",marginBottom:20}}>

              </div>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfirmDelete(null)}
                style={{flex:1,padding:"14px",borderRadius:14,cursor:"pointer",
                  background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.1)",
                  fontFamily:"'Montserrat',sans-serif",fontSize:".78rem",
                  fontWeight:900,color:"var(--mut)"}}>
                Abbrechen
              </button>
              <button onClick={()=>{handleDelete(confirmDelete);setConfirmDelete(null);}}
                style={{flex:2,padding:"14px",borderRadius:14,cursor:"pointer",
                  background:"#ef4444",border:"none",
                  fontFamily:"'Montserrat',sans-serif",fontSize:".78rem",
                  fontWeight:900,color:"#fff"}}>
                Ja, löschen
              </button>
            </div>
          </div>
        </div>
      )}
      {/* New/Edit Plan Modal */}
      {(showNew||editPlan)&&<NewPlanModal
        editPlan={editPlan}
        onSave={handleSave}
        onClose={()=>{setShowNew(false);setEditPlan(null);}}/>}
    </div>
  );
}


function GymPage({gymName, onSaveGym}) {
  const [input, setInput] = React.useState(gymName||"");
  const [saved, setSaved] = React.useState(gymName||"");
  const [suggestions, setSuggestions] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [editing, setEditing] = React.useState(!gymName);
  const [eggOpen, setEggOpen] = React.useState(false);
  const debounceRef = React.useRef(null);

  async function handleInput(val) {
    setInput(val);
    clearTimeout(debounceRef.current);
    if(val.length < 2) { setSuggestions([]); return; }
    setLoading(true);
    debounceRef.current = setTimeout(async () => {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(val+" gym")}&format=json&limit=4&addressdetails=1`);
        const data = await r.json();
        setSuggestions(data.slice(0,4));
      } catch(e) { setSuggestions([]); }
      setLoading(false);
    }, 500);
  }

  function selectSuggestion(s) {
    const name = s.display_name.split(",")[0];
    setInput(name); setSuggestions([]); save(name);
  }

  function save(name) {
    const n = (name||input).trim();
    if(!n) return;
    if(n.toLowerCase()==="winkler") { setInput(""); setEggOpen(true); return; }
    setSaved(n); onSaveGym(n); setEditing(false); setSuggestions([]);
  }

  const mapQuery = encodeURIComponent(saved);
  const initials = saved ? (saved.trim().split(/\s+/)[0]||"GYM").slice(0,3).toUpperCase() : "GYM";

  return (
    <div style={{padding:"14px 14px 90px",minHeight:"100%"}}>

      {/* ── HEADER CARD ── */}
      {saved&&!editing?(
        <div style={{position:"relative",overflow:"hidden",borderRadius:24,marginBottom:16,
          background:"linear-gradient(135deg,var(--card) 0%,var(--card2) 100%)",
          border:"1px solid var(--bdr)",padding:"24px 20px"}}>
          {/* Background initials */}
          <div style={{position:"absolute",right:-10,top:-10,
            fontFamily:"'Montserrat',sans-serif",fontSize:"7rem",fontWeight:900,
            color:"rgba(255,255,255,.03)",lineHeight:1,pointerEvents:"none",userSelect:"none"}}>
            {initials}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:52,height:52,borderRadius:16,background:"var(--acc)22",
              border:"1.5px solid var(--acc)44",display:"flex",alignItems:"center",
              justifyContent:"center",fontFamily:"'Montserrat',sans-serif",
              fontSize:"1.1rem",fontWeight:900,color:"var(--acc)",flexShrink:0}}>
              {initials}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
                fontSize:"1rem",letterSpacing:".3px",marginBottom:2,
                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                {saved}
              </div>
              <div style={{fontSize:".6rem",color:"var(--mut)",fontWeight:700,letterSpacing:"1px",
                textTransform:"uppercase"}}>Dein Gym</div>
            </div>
            <button onClick={()=>setEditing(true)}
              style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",
                borderRadius:10,padding:"7px 12px",cursor:"pointer",color:"var(--mut)",
                fontFamily:"'Nunito',sans-serif",fontSize:".7rem",fontWeight:800}}>
              Ändern
            </button>
          </div>
        </div>
      ):(
        /* ── INPUT ── */
        <div style={{background:"var(--card)",border:"1px solid var(--bdr)",borderRadius:20,
          padding:"16px",marginBottom:16}}>
          <div style={{fontSize:".58rem",letterSpacing:"2px",textTransform:"uppercase",
            color:"var(--mut)",fontWeight:800,marginBottom:10}}>Dein Gym</div>
          <div style={{display:"flex",gap:8,position:"relative"}}>
            <div style={{flex:1,position:"relative"}}>
              <input value={input} onChange={e=>handleInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&save()}
                placeholder="z.B. FitX München..."
                autoFocus={editing}
                style={{width:"100%",background:"var(--bg)",border:"1.5px solid var(--acc)",
                  borderRadius:suggestions.length>0?"12px 12px 0 0":"12px",
                  color:"var(--txt)",fontFamily:"'Nunito',sans-serif",
                  fontSize:".9rem",fontWeight:700,padding:"11px 14px",outline:"none"}}/>
              {loading&&<div style={{position:"absolute",right:12,top:"50%",
                transform:"translateY(-50%)",fontSize:".6rem",color:"var(--mut)"}}>…</div>}

function getEarnedAchievements(allDays, prs) {
  const earned = new Set();
  let totalSessions = 0, maxStreak = 0, curStreak = 0, totalVol = 0;
  const sorted = Object.entries(allDays).filter(([,d])=>d?.type&&d.type!=="rest").sort(([a],[b])=>a.localeCompare(b));
  let lastDate = null;
  sorted.forEach(([dk, di]) => {
    totalSessions++;
    const d = new Date(dk);
    if (lastDate) {
      const diff = (d - lastDate) / 86400000;
      if (diff <= 1.5) curStreak++; else curStreak = 1;
    } else curStreak = 1;
    maxStreak = Math.max(maxStreak, curStreak);
    lastDate = d;
    let sessionVol = 0;
    if (di.sections) Object.values(di.sections).forEach(sec => Object.values(sec).forEach(ex => Object.values(ex).forEach(s => { if(s.w&&s.r) { totalVol+=parseFloat(s.w)*parseFloat(s.r); sessionVol+=parseFloat(s.w)*parseFloat(s.r); } })));
    if (sessionVol >= 1000) earned.add("volume_1t");
  });
  if (totalSessions >= 1) earned.add("first_session");
  if (maxStreak >= 3) earned.add("week_3");
  if (maxStreak >= 7) earned.add("week_7");
  if (totalSessions >= 10) earned.add("sessions_10");
  if (totalSessions >= 25) earned.add("sessions_25");
  if (totalSessions >= 50) earned.add("sessions_50");
  if (totalVol >= 10000) earned.add("volume_total");
  const prCount = Object.keys(prs).length;
  if (prCount >= 1) earned.add("first_pr");
  if (prCount >= 5) earned.add("pr_5");
  return earned;
}

// ── Weekly Review ─────────────────────────────────────────────────────────────
function WeeklyReview({ allDays, prs }) {
  const weekStart = getWeekStart(today());
  const weekDays = Array.from({length:7},(_,i)=>{ const d=new Date(weekStart); d.setDate(d.getDate()+i); return dateKey(d); });
  const weekSessions = weekDays.filter(dk=>allDays[dk]?.type&&allDays[dk].type!=="rest");
  let weekVol = 0, weekPRs = 0;
  weekSessions.forEach(dk=>{
    const di=allDays[dk];
    if(di?.sections) Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>Object.values(ex).forEach(s=>{if(s.w&&s.r) weekVol+=parseFloat(s.w)*parseFloat(s.r);})));
  });
  const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const lastWeekDays = Array.from({length:7},(_,i)=>{ const d=new Date(lastWeekStart); d.setDate(d.getDate()+i); return dateKey(d); });
  const lastWeekSessions = lastWeekDays.filter(dk=>allDays[dk]?.type&&allDays[dk].type!=="rest").length;
  const diff = weekSessions.length - lastWeekSessions;

  return (
    <div className="review-card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div className="review-title">Diese Woche</div>
          <div className="review-sub">{weekStart.toLocaleDateString("de-DE",{day:"numeric",month:"long"})} - heute</div>
        </div>
        {diff!==0&&<div style={{fontSize:".65rem",fontWeight:800,padding:"4px 10px",borderRadius:"10px",
          background:diff>0?"rgba(134,239,172,.15)":"rgba(248,113,113,.15)",
          color:diff>0?"var(--grn)":"var(--red)"}}>
          {diff>0?"+":""}{diff} vs letzte Woche
        </div>}
      </div>
      <div className="review-stats">
        <div><div className="review-stat-val">{weekSessions.length}</div><div className="review-stat-lbl">Trainings</div></div>
        <div><div className="review-stat-val">{Math.round(weekVol/1000*10)/10}t</div><div className="review-stat-lbl">Volumen</div></div>
        <div><div className="review-stat-val">{7-weekSessions.length}</div><div className="review-stat-lbl">Ruhetage</div></div>
      </div>
      <div style={{display:"flex",gap:"4px"}}>
        {weekDays.map((dk,i)=>{
          const di=allDays[dk]; const isToday=dk===dateKey(today());
          const isFuture=dk>dateKey(today());
          return <div key={dk} style={{flex:1,height:"6px",borderRadius:"3px",
            background:isFuture?"var(--bdr)":di?.type&&di.type!=="rest"?"var(--acc)":di?.type==="rest"?"var(--mut)":"var(--bdr2)",
            border:isToday?"1px solid var(--acc)":"none",
            transition:"background .3s"}}/>;
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:"4px"}}>
        {["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=><div key={d} style={{flex:1,fontSize:".48rem",color:"var(--mut)",fontWeight:700,textAlign:"center"}}>{d}</div>)}
      </div>
    </div>
  );
}

    if(type==="A") return "#7dd3fc";
    if(type==="B") return "#86efac";
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.color||"#a78bfa";
    return "var(--acc)";
  }
  function getPlanName(type) {
    if(type==="A") return "Tag A \u2013 Brust & R\u00FCcken";
    if(type==="B") return "Tag B \u2013 Schulter & Arme";
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.name||"Eigener Plan";
    return type;
  }
  function getPlanSections(type) {
    if(type==="A") return DEFAULT_PLAN[0].sections;
    if(type==="B") return DEFAULT_PLAN[1].sections;
    if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.sections||null;

                <div key={ei} style={{background:exComplete?"rgba(63,212,160,.06)":"rgba(255,255,255,.03)",border:exComplete?"1px solid rgba(63,212,160,.18)":"1px solid rgba(255,255,255,.05)",borderRadius:"12px",padding:"10px 12px"}}>

                  </div>
                  {exDone>0&&(
                    <div style={{display:"flex",gap:"5px",flexWrap:"wrap",paddingLeft:"26px"}}>
                      {setDetails.map((s,i)=>(

                          {s.isDone?`${s.w}kg x ${s.r}`:`Satz ${i+1}`}

                  )}

              );
            })}
          </div>
        </div>
      ))}

    </div>
  );
}

function HistoryPage({ allDays, customPlans }) {
  const [selected, setSelected] = useState(null);
  const entries = Object.entries(allDays).filter(([,d])=>d?.type&&d.type!=="rest").sort(([a],[b])=>b.localeCompare(a)).slice(0,60);
  function getPlanColor(type){if(type==="A") return "#7dd3fc";if(type==="B") return "#86efac";if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.color||"#a78bfa";return "var(--acc)";}
  function getPlanName(type){if(type==="A") return "Tag A";if(type==="B") return "Tag B";if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.name||"Eigener Plan";return type;}
  function getPlanSections(type){if(type==="A") return DEFAULT_PLAN[0].sections;if(type==="B") return DEFAULT_PLAN[1].sections;if(type?.startsWith("custom_")) return customPlans.find(p=>"custom_"+p.id===type)?.sections||null;return null;}
  function getStats(di){
    let vol=0,done=0,total=0;
    if(di?.sections) Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>Object.values(ex).forEach(s=>{if(s.w&&s.r) vol+=parseFloat(s.w)*parseFloat(s.r);})));
    const secs=getPlanSections(di?.type);
    if(secs&&di?.sections){secs.forEach((sec,si)=>sec.exercises.forEach((ex,ei)=>{const ov=di.overrides?.[`${si}_${ei}`];const effSets=ov?.sets??ex.sets;const exData=di.sections?.[si]?.[ei]??{};total+=effSets;for(let i=0;i<effSets;i++){const s=exData[i]??{};if(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0) done++;}}));}
    else if(di?.sections){Object.values(di.sections).forEach(sec=>Object.values(sec).forEach(ex=>{Object.values(ex).forEach(s=>{if(typeof s==="object"&&s.w!==undefined){total++;if(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0) done++;}});}));}
    return {vol:Math.round(vol),done,total,progress:total>0?Math.round(done/total*100):0};
  }

  if(selected) return <TrainingDetailView dk={selected[0]} di={selected[1]} customPlans={customPlans} onBack={()=>setSelected(null)} backLabel="Zum Verlauf"/>;

  return (
    <div>
      {entries.length===0&&<div className="no-data" style={{padding:"30px"}}>Noch keine Trainings</div>}
      {entries.map(([dk,di])=>{
        const {vol,done,total,progress}=getStats(di);
        const planColor=getPlanColor(di.type);
        return (
          <div key={dk} className="history-entry" onClick={()=>setSelected([dk,di])}>
            <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:planColor,flexShrink:0}}/>
              <div style={{flex:1}}>
                <div className="history-date">{new Date(dk+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div className="history-title" style={{color:planColor}}>{getPlanName(di.type)}</div>
                  {di.duration&&di.duration>0&&(
                    <div style={{fontSize:".6rem",color:"var(--mut)",fontWeight:700,
                      display:"flex",alignItems:"center",gap:3}}>
                      <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
                        stroke="var(--mut)" strokeWidth="2" strokeLinecap="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/>
                      </svg>
                      {Math.floor(di.duration/60)}:{String(di.duration%60).padStart(2,'0')}
                    </div>
                  )}
                </div>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
            <div style={{marginTop:"8px",paddingLeft:"18px"}}>
              <div style={{height:3,background:"rgba(255,255,255,.07)",borderRadius:2,overflow:"hidden",marginBottom:"6px"}}><div style={{height:"100%",width:progress+"%",background:planColor,borderRadius:2}}/></div>
              <div className="history-meta">
                <div className="history-stat">Saetze: <span>{done}/{total}</span></div>
                {vol>0&&<div className="history-stat">Volumen: <span>{vol} kg</span></div>}
                <div className="history-stat">Erledigt: <span style={{color:progress===100?"var(--grn)":planColor}}>{progress}%</span></div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}


// ── Templates Page ────────────────────────────────────────────────────────────
function TemplatesPage({ customPlans, onSavePlans, onClose }) {
  const [applied, setApplied] = useState(null);
  const [duplicateWarning, setDuplicateWarning] = useState(null);

  function applyTemplate(tmpl) {
    // Check if any plan from this template already exists (by name)
    const tmplNames = tmpl.plans.map(p=>p.name.toLowerCase());
    const alreadyHas = customPlans.some(p=>tmplNames.includes(p.name.toLowerCase()));
    if(alreadyHas){
      setDuplicateWarning(tmpl.id);
      setTimeout(()=>setDuplicateWarning(null), 3000);
      return;
    }
    const newPlans = tmpl.plans.map(p=>({...p, id:"tmpl_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)}));
    onSavePlans([...customPlans, ...newPlans]);
    setApplied(tmpl.id);
  }

  return (
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-handle"/>
        <div className="modal-title">Plan-Vorlagen</div>
        <div className="modal-sub">Fertige Trainingspläne zum Übernehmen</div>
        <div style={{
          overflow:"hidden",
          maxHeight:duplicateWarning?"60px":"0px",
          opacity:duplicateWarning?1:0,
          marginBottom:duplicateWarning?12:0,
          transition:"max-height .4s ease, opacity .4s ease, margin-bottom .4s ease"
        }}>
          <div style={{background:"rgba(248,113,113,.12)",border:"1px solid rgba(248,113,113,.35)",
            borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--red)"
              strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div style={{fontSize:".78rem",fontWeight:700,color:"var(--red)"}}>
              Dieser Plan ist bereits in deiner Liste.
            </div>
          </div>
        </div>
        {PLAN_TEMPLATES.map(tmpl=>(
          <div key={tmpl.id} className="tmpl-card">
            <div className="tmpl-card-hdr">
              <div className="tmpl-icon" style={{background:tmpl.color+"18",
                border:"1.5px solid "+tmpl.color+"33",
                fontFamily:"'Montserrat',sans-serif",fontSize:".95rem",fontWeight:900,
                color:tmpl.color,letterSpacing:"0px"}}>
                {tmpl.name.split(" ")[0].replace("/","").slice(0,3).toUpperCase()}
              </div>
              <div>
                <div className="tmpl-name" style={{color:tmpl.color}}>{tmpl.name}</div>
                <div className="tmpl-sub">{tmpl.desc} · {tmpl.plans.length} Pläne</div>
              </div>
            </div>
            <div className="tmpl-tags">
              {tmpl.plans.map(p=><div key={p.name} className="tmpl-tag">{p.name}</div>)}
            </div>
            <button onClick={()=>applyTemplate(tmpl)}
              style={{marginTop:"10px",width:"100%",
                background:duplicateWarning===tmpl.id?"rgba(248,113,113,.15)":applied===tmpl.id?"var(--grn-bg)":"var(--acc)",
                color:duplicateWarning===tmpl.id?"var(--red)":applied===tmpl.id?"var(--grn)":"var(--acc-txt,#080a0f)",
                border:duplicateWarning===tmpl.id?"1px solid var(--red)":applied===tmpl.id?"1px solid var(--grn)":"none",
                borderRadius:"10px",fontFamily:"'Montserrat',sans-serif",fontSize:".85rem",fontWeight:800,
                letterSpacing:"1px",padding:"10px",cursor:"pointer",textTransform:"uppercase"}}>
              {applied===tmpl.id?"✓ Übernommen":"Übernehmen"}

  );

function QuoteRotator() {
  const [idx, setIdx] = React.useState(()=>Math.floor(Math.random()*ATHLETE_QUOTES.length));
  const [visible, setVisible] = React.useState(true);

  React.useEffect(()=>{
    const interval = setInterval(()=>{

function formatTime(secs) {
  const h = Math.floor(secs/3600);
  const m = Math.floor((secs%3600)/60);
  const s = secs%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function CountUp({value, duration=800, suffix=""}) {
  const [display, setDisplay] = React.useState(0);
  const startRef = React.useRef(null);
  const startValRef = React.useRef(0);

  React.useEffect(()=>{
    const target = parseFloat(value)||0;
    const start = startValRef.current;
    const startTime = performance.now();
    
    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      // Ease out cubic
      const eased = 1 - Math.pow(1-progress, 3);
      const current = start + (target - start) * eased;
      setDisplay(Number.isInteger(target) ? Math.round(current) : Math.round(current*10)/10);
      if(progress < 1) requestAnimationFrame(animate);
      else startValRef.current = target;
    }
    requestAnimationFrame(animate);
  }, [value]);

  return <span>{display}{suffix}</span>;
}

function WeeklyReviewModal({allDays, onClose}) {

  monday.setHours(0,0,0,0);

  const weekDays = Array.from({length:7},(_,i)=>{
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    return d;
  });

  const DAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  const MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

  const dateKey = d => d.toISOString().slice(0,10);
  
  const weekData = weekDays.map((d,i)=>({
    day: DAYS[i],
    date: d.getDate(),
    dk: dateKey(d),
    entry: allDays[dateKey(d)],
    isToday: dateKey(d)===dateKey(today),
    isFuture: d > today,
  }));

  const trained = weekData.filter(d=>d.entry?.type&&d.entry.type!=="rest"&&!d.isFuture).length;

        {/* Week grid */}
        <div style={{display:"flex",gap:6,marginBottom:20}}>
          {weekData.map(({day,date,entry,isToday,isFuture})=>{

    .filter(([,{exercises}])=>exercises.some(kw=>lower.includes(kw)))
    .map(([key])=>key);
}
