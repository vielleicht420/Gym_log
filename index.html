<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prüfungstrainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar">
    <h1><span class="logo-bubble">📚</span> Prüfungstrainer</h1>
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-view="home">Start</button>
      <button class="tab-btn" data-view="cards">Karteikarten</button>
      <button class="tab-btn" data-view="quiz">Quiz</button>
      <button class="tab-btn" data-view="progress">Fortschritt</button>
    </nav>
  </header>

  <main id="app"></main>

  <template id="tpl-home">
    <section class="view">
      <h2>Übersicht</h2>
      <div class="stat-row" id="home-stats"></div>
      <h3>Themen</h3>
      <div id="home-topics" class="topic-list"></div>
    </section>
  </template>

  <template id="tpl-cards">
    <section class="view">
      <div class="view-header">
        <h2>Karteikarten</h2>
        <select id="cards-topic-select"></select>
      </div>
      <p class="hint" id="cards-hint"></p>
      <div id="cards-stage"></div>
    </section>
  </template>

  <template id="tpl-quiz">
    <section class="view">
      <div class="view-header">
        <h2>Multiple-Choice-Quiz</h2>
        <select id="quiz-topic-select"></select>
      </div>
      <div id="quiz-stage"></div>
    </section>
  </template>

  <template id="tpl-progress">
    <section class="view">
      <h2>Fortschritt</h2>
      <div id="progress-stage"></div>
      <button class="btn btn-danger" id="reset-progress">Fortschritt zurücksetzen</button>
    </section>
  </template>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
