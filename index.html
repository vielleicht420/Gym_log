<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM LOG">
<meta name="theme-color" content="#080a0f">
<title>GYM LOG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080a0f}
input,textarea,select{font-size:max(16px,1rem)!important}
/* Hide scrollbar everywhere */
*::-webkit-scrollbar{display:none}
*{-ms-overflow-style:none;scrollbar-width:none}
#root{height:100%;height:100dvh}
#splash{position:fixed;inset:0;background:#080a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999}
.sp-logo{font-family:'Arial Black',Impact,sans-serif;font-size:2.4rem;font-weight:900;letter-spacing:6px;color:#fff;animation:gp 2s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:1}50%{opacity:.6}}
.sp-ring{width:44px;height:44px;border:3px solid #1a1f2a;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sp-msg{font-size:.6rem;color:#5a6480;letter-spacing:2px;text-transform:uppercase;font-family:Arial,sans-serif}
body.theme-blue{--acc:#60a5fa;--acc2:#3b82f6;--acc3:#93c5fd;--acc-txt:#080a0f}
body.theme-green{--acc:#34d399;--acc2:#10b981;--acc3:#6ee7b7;--acc-txt:#080a0f}
body.theme-purple{--acc:#a78bfa;--acc2:#8b5cf6;--acc3:#c4b5fd;--acc-txt:#ffffff}
body.theme-orange{--acc:#fb923c;--acc2:#f97316;--acc3:#fdba74;--acc-txt:#080a0f}
body.theme-pink{--acc:#f472b6;--acc2:#ec4899;--acc3:#f9a8d4;--acc-txt:#080a0f}
body.theme-yellow{--acc:#fbbf24;--acc2:#f59e0b;--acc3:#fcd34d;--acc-txt:#080a0f}
body.theme-red{--acc:#f87171;--acc2:#ef4444;--acc3:#fca5a5;--acc-txt:#ffffff}

@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
input,textarea,select{font-size:max(16px,1rem)!important;}
:root{
  --bg:#080a0f;
  --sur:#0e1117;
  --card:#141820;
  --card2:#1a1f2a;
  --bdr:#1f2535;
  --bdr2:#252d3d;
  --acc:#ffffff;
  --acc2:#e0e6f0;
  --acc3:#a8b4cc;
  --txt:#f0f2f8;
  --mut:#5a6480;
  --mut2:#3d4560;
  --ga:#7dd3fc;--ga-bg:#0c2a3d;
  --gb:#86efac;--gb-bg:#0c2a1a;
  --red:#f87171;--red-bg:#2d1010;
  --grn:#86efac;--grn-bg:#0c2a1a;
  --gold:#fbbf24;
  --blue:#7dd3fc;
}
body{background:var(--bg);color:var(--txt);font-family:'Nunito',sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y;}

/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse 100% 60% at 50% 0%,#0d1424 0%,var(--bg) 70%)}
.lc{background:var(--sur);border:1px solid var(--bdr);border-radius:28px;
  padding:40px 28px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:20px;
  box-shadow:0 32px 80px rgba(0,0,0,.6)}
.logo{font-family:'Montserrat',sans-serif;font-size:2.4rem;font-weight:900;letter-spacing:6px;
  color:var(--acc);text-align:center;line-height:1}
.logo-sub{font-size:.62rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--mut);text-align:center;margin-top:-12px;font-weight:600}
.ltabs{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.ltab{flex:1;padding:9px;text-align:center;font-size:.7rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;
  background:none;color:var(--mut);border-radius:10px;transition:all .2s;font-family:'Nunito',sans-serif}
.ltab.on{background:var(--acc);color:var(--acc-txt,#080a0f)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.fld input{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;font-size:max(16px,.92rem)!important;
  color:var(--txt);font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:600;
  padding:12px 15px;transition:border-color .15s;width:100%}
.fld input:focus{outline:none;border-color:var(--acc)}
.pbtn{background:var(--acc);color:#080a0f;border:none;border-radius:14px;
  font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:800;letter-spacing:2px;
  padding:14px;cursor:pointer;width:100%;transition:opacity .2s;text-transform:uppercase}
.pbtn:hover{opacity:.88}.pbtn:disabled{opacity:.3;cursor:not-allowed}
.merr{background:var(--red-bg);border:1px solid #5a1a1a;border-radius:12px;
  padding:10px 14px;font-size:.78rem;color:var(--red);text-align:center;font-weight:600}
.mok{background:var(--grn-bg);border:1px solid #1a5a38;border-radius:12px;
  padding:10px 14px;font-size:.78rem;color:var(--grn);text-align:center;font-weight:600}
.info-box{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 14px;font-size:.72rem;color:var(--mut);line-height:1.6;text-align:center;font-weight:600}
.info-box strong{color:var(--acc)}

/* SHELL */
.app{min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(8,10,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);padding:14px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:200}
.hlogo{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:900;letter-spacing:4px;color:var(--acc)}
.dot{width:6px;height:6px;background:var(--grn);border-radius:50%;animation:pulse 2.5s infinite;box-shadow:0 0 8px var(--grn)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.upill{margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--bdr);border-radius:24px;padding:5px 14px 5px 6px}
.uav{width:26px;height:26px;border-radius:50%;background:var(--acc);
  display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-size:.8rem;font-weight:900;color:#080a0f}
.uname{font-size:.74rem;font-weight:700;letter-spacing:.3px}
.logoutbtn{background:none;border:none;color:var(--mut);cursor:pointer;
  font-size:.6rem;letter-spacing:1px;text-transform:uppercase;
  font-family:'Nunito',sans-serif;font-weight:700;padding:2px 5px}
.logoutbtn:hover{color:var(--red)}

/* BOTTOM NAV */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  z-index:200;
  background:rgba(8,10,15,.85);
  backdrop-filter:blur(32px) saturate(1.8);
  -webkit-backdrop-filter:blur(32px) saturate(1.8);
  border-top:1px solid rgba(255,255,255,.07);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
  box-shadow:0 -4px 32px rgba(0,0,0,.5);
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
}
.bnav-inner{
  display:flex;align-items:center;
  position:relative;
  touch-action:pan-x;
}
.bnav-glass-pill{
  position:absolute;
  top:0;bottom:0;
  border-radius:20px;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  background:linear-gradient(160deg,rgba(255,255,255,.97) 0%,rgba(215,228,255,.9) 100%);
  box-shadow:
    0 2px 20px rgba(255,255,255,.18),
    0 1px 0 rgba(255,255,255,.98) inset,
    0 -1px 0 rgba(0,0,0,.1) inset,
    1px 0 0 rgba(255,255,255,.7) inset,
    -1px 0 0 rgba(255,255,255,.7) inset;
  border:1px solid rgba(255,255,255,.75);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:left .35s cubic-bezier(.34,1.2,.64,1), width .35s cubic-bezier(.34,1.2,.64,1);
  pointer-events:none;
}
.bnav-glass-pill::after{
  content:'';position:absolute;inset:-2px;border-radius:22px;
  box-shadow:0 0 0 1px rgba(140,200,255,.3),0 0 0 2.5px rgba(255,120,200,.15),0 0 24px rgba(255,255,255,.08);
  pointer-events:none;
}
.bnav-btn{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;
  color:var(--mut);font-family:'Nunito',sans-serif;font-size:.48rem;
  letter-spacing:.5px;text-transform:uppercase;font-weight:800;
  padding:10px 4px;border-radius:20px;
  transition:color .3s ease;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.bnav-btn svg{width:21px;height:21px;stroke-width:1.8;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.bnav-btn span{position:relative}
.bnav-btn.on{color:#080a0f}
.bnav-btn.on svg{transform:scale(1.15)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);z-index:300;display:flex;align-items:flex-end;
  justify-content:center;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--sur);border-radius:24px 24px 0 0;border:1px solid var(--bdr);
  border-bottom:none;padding:24px 20px 44px;width:100%;max-width:480px;
  animation:slideUp .25s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--bdr2);border-radius:2px;margin:0 auto 22px}
.modal-title{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:800;letter-spacing:1px;
  color:var(--txt);margin-bottom:4px;text-transform:uppercase}
.modal-sub{font-size:.62rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;font-weight:600}
.modal-opts{display:flex;flex-direction:column;gap:10px}
.modal-opt{display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:var(--card);border:1.5px solid var(--bdr);border-radius:16px;cursor:pointer;transition:all .15s}
.modal-opt:hover{border-color:var(--bdr2);background:var(--card2)}
.modal-opt.active{border-color:var(--acc);background:rgba(255,255,255,.04)}
.modal-opt-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-family:'Montserrat',sans-serif;font-size:.95rem;font-weight:800;flex-shrink:0}
.modal-opt-icon.A{background:var(--ga-bg);color:var(--ga)}
.modal-opt-icon.B{background:var(--gb-bg);color:var(--gb)}
.modal-opt-icon.R{background:var(--card2);color:var(--mut)}
.modal-opt-text{flex:1}
.modal-opt-name{font-size:.88rem;font-weight:700}
.modal-opt-desc{font-size:.68rem;color:var(--mut);margin-top:2px;font-weight:600}
.modal-opt.active .modal-opt-name{color:var(--acc)}
.modal-cancel{margin-top:14px;width:100%;background:none;border:1.5px solid var(--bdr);
  border-radius:14px;color:var(--mut);font-family:'Nunito',sans-serif;font-weight:700;
  font-size:.78rem;padding:11px;cursor:pointer;transition:all .15s;letter-spacing:1px;text-transform:uppercase}
.modal-cancel:hover{border-color:var(--mut2);color:var(--acc3)}

/* CALENDAR */
.cal-wrap{padding:18px 16px 110px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-month{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:1px;color:var(--txt)}
.cal-nav{background:var(--card);border:1px solid var(--bdr);color:var(--txt);border-radius:10px;
  padding:6px 14px;cursor:pointer;font-size:1.1rem;font-weight:700;transition:all .15s}
.cal-nav:hover{background:var(--card2);border-color:var(--bdr2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day-lbl{text-align:center;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut);padding:5px 0;font-weight:800}
.cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;border:1.5px solid transparent;
  transition:all .15s;gap:3px}
.cal-day:hover{background:var(--card)}
.cal-day.empty{cursor:default;pointer-events:none}
.cal-day.today{border-color:var(--acc)!important}
.cal-day.selected{background:var(--acc);border-color:var(--acc)}
.cal-day.selected .cal-dn{color:#080a0f}
.cal-dn{font-size:.82rem;font-weight:800;color:var(--txt);line-height:1}
.cal-dots{display:flex;gap:2px;justify-content:center}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-dot.A{background:var(--ga)}.cal-dot.B{background:var(--gb)}.cal-dot.rest{background:var(--mut)}
.cal-day.selected .cal-dot.A,.cal-day.selected .cal-dot.B,.cal-day.selected .cal-dot.rest{background:rgba(0,0,0,.3)}

/* TRAINING PAGE */
.page{padding:16px 16px 90px}
.day-banner{background:var(--card);border:1.5px solid var(--bdr);border-radius:20px;
  padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.day-banner-date{font-family:'Montserrat',sans-serif;font-size:1.5rem;font-weight:900;color:var(--acc);line-height:1}
.day-banner-info{display:flex;flex-direction:column;gap:2px;flex:1}
.day-banner-tag{font-size:.88rem;font-weight:800}
.day-banner-sub{font-size:.62rem;color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.day-banner-change{background:var(--card2);border:1px solid var(--bdr2);color:var(--acc3);border-radius:10px;
  padding:6px 12px;cursor:pointer;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;
  font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s;flex-shrink:0}
.day-banner-change:hover{border-color:var(--acc);color:var(--acc)}

.statsbar{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:14px 16px;margin-bottom:12px;display:flex;gap:18px;align-items:center}
.stat{display:flex;flex-direction:column;gap:2px}
.sv{font-family:'Montserrat',sans-serif;font-size:1.6rem;font-weight:900;color:var(--acc);line-height:1}
.sl{font-size:.52rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-weight:800}
.savebar{display:flex;justify-content:flex-end;margin-bottom:6px}
.savetxt{font-size:.58rem;letter-spacing:1px;font-weight:700}
.savetxt.ok{color:var(--grn)}.savetxt.ing{color:var(--mut)}
.pbar{height:3px;background:var(--bdr);border-radius:2px;margin-bottom:16px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc3));
  border-radius:2px;transition:width .4s cubic-bezier(.34,1.56,.64,1)}
.dayhdr{font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:900;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:2px;color:var(--txt)}
.daysub{font-size:.58rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:14px;font-weight:700}
.seclbl{font-size:.54rem;letter-spacing:2.5px;color:var(--mut);font-weight:800;
  text-transform:uppercase;margin:18px 0 9px;display:flex;align-items:center;justify-content:space-between}
.add-ex-btn{background:var(--card2);border:1px solid var(--bdr2);color:var(--acc3);border-radius:8px;
  padding:4px 10px;cursor:pointer;font-size:.58rem;letter-spacing:1px;text-transform:uppercase;
  font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s}
.add-ex-btn:hover{border-color:var(--acc);color:var(--acc)}

/* EXERCISE CARD */
.excard{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  margin-bottom:10px;overflow:hidden;transition:all .3s}
.excard.all-done{border-color:rgba(134,239,172,.3);background:rgba(12,42,26,.5)}
.excard.all-done .exname{color:var(--grn)}
.exhdr{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px 7px;gap:8px}
.exname{font-size:.86rem;font-weight:800;letter-spacing:.2px;flex:1;min-width:0}
.exname{font-size:.88rem;font-weight:800;letter-spacing:.2px}
.exhdr-right{display:flex;align-items:center;gap:6px}
.badge{font-size:.58rem;letter-spacing:.5px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.ba{background:rgba(125,211,252,.12);color:var(--ga);border:1px solid rgba(125,211,252,.2)}
.bb{background:rgba(134,239,172,.12);color:var(--gb);border:1px solid rgba(134,239,172,.2)}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--mut);
  transition:color .15s;display:flex;align-items:center;border-radius:6px}
.icon-btn:hover{color:var(--acc)}.icon-btn.del:hover{color:var(--red)}
.sgrid{display:flex;gap:7px;padding:0 14px 12px;flex-wrap:wrap}

/* SET BLOCK */
.sb{background:var(--sur);border:1.5px solid var(--bdr);border-radius:12px;
  padding:8px 6px;display:flex;flex-direction:column;gap:3px;min-width:62px;flex:1;max-width:90px;transition:all .3s}
.sb.done{border-color:rgba(134,239,172,.4);background:rgba(12,42,26,.6)}
.sb.done .slbl{color:var(--grn)}
.sb.done .si{background:rgba(12,42,26,.4);border-color:rgba(134,239,172,.3);color:var(--grn)}
.sb.done .ulbl{color:rgba(134,239,172,.5)}
.slbl{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);
  text-align:center;font-weight:800;transition:color .3s}
.si{background:var(--bg);border:1.5px solid var(--bdr);border-radius:8px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:max(16px,.78rem);font-weight:800;padding:5px 3px;
  text-align:center;width:100%;-moz-appearance:textfield;transition:all .25s}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none}
.si:focus{outline:none;border-color:rgba(255,255,255,.4)}
.si::placeholder{color:var(--mut2)}
.ulbl{font-size:.47rem;color:var(--mut);text-align:center;font-weight:700}
.sb-check{width:18px;height:18px;border-radius:50%;background:var(--grn);
  display:flex;align-items:center;justify-content:center;margin:2px auto 0;
  animation:popIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shimmerPulse{0%,100%{box-shadow:0 0 30px rgba(255,255,255,.1),0 0 60px rgba(255,255,255,.05)}50%{box-shadow:0 0 50px rgba(255,255,255,.2),0 0 100px rgba(255,255,255,.1)}}
.pr-badge{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:var(--gold);
  border-radius:8px;font-size:.52rem;font-weight:800;padding:2px 6px;text-align:center;margin-top:3px}

/* TIMER */
.timer-bar{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.timer-ring{position:relative;width:52px;height:52px;flex-shrink:0}
.timer-ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer-ring-track{fill:none;stroke:var(--bdr);stroke-width:3}
.timer-ring-fill{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:900;color:var(--acc)}
.timer-info{flex:1}.timer-title{font-size:.82rem;font-weight:800;margin-bottom:2px}
.timer-sub{font-size:.65rem;color:var(--mut);font-weight:600}
.timer-btns{display:flex;gap:6px}
.timer-btn{background:var(--card2);border:1px solid var(--bdr2);color:var(--acc3);border-radius:10px;
  padding:6px 12px;cursor:pointer;font-size:.68rem;font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s}
.timer-btn:hover{border-color:var(--acc);color:var(--acc)}
.timer-btn.skip{border-color:rgba(134,239,172,.3);color:var(--grn)}

/* EDIT MODAL */
.edit-exname{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:800;letter-spacing:1px;
  color:var(--acc);margin-bottom:18px;text-transform:uppercase}
.edit-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.edit-label{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:800;flex:1}
.edit-controls{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;overflow:hidden}
.edit-stepper{background:none;border:none;color:var(--txt);cursor:pointer;padding:9px 16px;font-size:1.1rem;font-weight:800;font-family:'Nunito',sans-serif}
.edit-stepper:hover{background:var(--card2)}.edit-stepper:disabled{color:var(--mut2);cursor:not-allowed}
.edit-val{min-width:44px;text-align:center;font-size:.95rem;font-weight:800;color:var(--txt);
  padding:9px 4px;border-left:1.5px solid var(--bdr);border-right:1.5px solid var(--bdr)}
.edit-reps-input{background:none;border:none;color:var(--txt);font-family:'Nunito',sans-serif;
  font-size:.9rem;font-weight:800;text-align:center;width:90px;padding:9px 6px;outline:none}
.edit-save{background:var(--acc);color:#080a0f;border:none;border-radius:14px;
  font-family:'Montserrat',sans-serif;font-size:.95rem;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;padding:13px;cursor:pointer;width:100%;margin-top:4px}
.edit-reset{background:none;border:1.5px solid var(--bdr);color:var(--mut);
  border-radius:14px;font-family:'Nunito',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;padding:10px;cursor:pointer;width:100%;margin-top:8px}
.add-ex-form{display:flex;flex-direction:column;gap:12px}
.add-ex-input{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:max(16px,.9rem);font-weight:700;padding:12px 15px;width:100%}
.add-ex-input:focus{outline:none;border-color:rgba(255,255,255,.3)}

/* STATS PAGE */
.stats-page{padding:16px 16px 110px}
.stats-section-title{font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:900;
  letter-spacing:3px;color:var(--mut);margin:22px 0 10px;text-transform:uppercase}
.streak-row{display:flex;gap:10px;margin-bottom:10px}
.streak-mini{flex:1;background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:14px 12px;display:flex;align-items:center;gap:10px}
.streak-icon{font-size:1.5rem;line-height:1}
.streak-info{display:flex;flex-direction:column;gap:2px}
.streak-val{font-family:'Montserrat',sans-serif;font-size:1.7rem;font-weight:900;color:var(--acc);line-height:1}
.streak-lbl{font-size:.54rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-weight:800}
.week-goal-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:16px;margin-bottom:10px}
.week-goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.week-goal-title{font-size:.84rem;font-weight:800}
.week-goal-count{font-family:'Montserrat',sans-serif;font-size:1.3rem;font-weight:900;color:var(--acc)}
.week-pips{display:flex;gap:5px;margin-bottom:7px}
.pip{height:5px;flex:1;border-radius:3px;background:var(--bdr2);transition:background .3s}
.pip.done{background:var(--acc)}
.week-goal-sub{font-size:.64rem;color:var(--mut);font-weight:700}
.week-goal-adj{display:flex;align-items:center;gap:8px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--bdr)}
.week-goal-adj-lbl{font-size:.64rem;color:var(--mut);flex:1;font-weight:700}
.goal-stepper{background:var(--card2);border:1px solid var(--bdr2);color:var(--txt);
  border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.9rem;font-weight:800}
.goal-val{font-size:.9rem;font-weight:800;min-width:24px;text-align:center}
.timer-settings-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:16px;margin-bottom:10px}
.timer-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.timer-preset{background:var(--card2);border:1px solid var(--bdr2);color:var(--mut);
  border-radius:10px;padding:7px 13px;cursor:pointer;font-size:.74rem;font-weight:800;
  font-family:'Nunito',sans-serif;transition:all .15s}
.timer-preset.active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:var(--acc)}
.graph-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;
  padding:16px;margin-bottom:10px}
.graph-title{font-size:.82rem;font-weight:800;margin-bottom:2px}
.graph-sub{font-size:.62rem;color:var(--mut);margin-bottom:10px;font-weight:600}
.graph-select{background:var(--sur);border:1.5px solid var(--bdr);color:var(--txt);
  border-radius:12px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:.78rem;
  font-weight:700;width:100%;margin-bottom:12px;cursor:pointer}
.no-data{font-size:.75rem;color:var(--mut);text-align:center;padding:20px 0;font-weight:600}
.bw-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;padding:16px;margin-bottom:10px}
.bw-input-row{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.bw-input{background:var(--sur);border:1.5px solid var(--bdr);border-radius:12px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:max(16px,.92rem);font-weight:700;padding:10px 13px;
  flex:1;-moz-appearance:textfield;transition:border-color .15s}
.bw-input::-webkit-outer-spin-button,.bw-input::-webkit-inner-spin-button{-webkit-appearance:none}
.bw-input:focus{outline:none;border-color:rgba(255,255,255,.3)}
.bw-save-btn{background:var(--acc);color:#080a0f;border:none;border-radius:12px;
  font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:1px;
  padding:10px 14px;cursor:pointer;white-space:nowrap}
.bw-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.bw-entry{display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;background:var(--sur);border-radius:12px;border:1px solid var(--bdr)}
.bw-entry-date{font-size:.7rem;color:var(--mut);font-weight:700}
.bw-entry-val{font-size:.9rem;font-weight:800}
.bw-del{background:none;border:none;color:var(--mut2);cursor:pointer;padding:2px 8px;font-size:.9rem;font-weight:700}
.bw-del:hover{color:var(--red)}

/* NOTES */
.notes{width:100%;background:var(--card);border:1.5px solid var(--bdr);border-radius:16px;color:var(--txt);
  font-family:'Nunito',sans-serif;font-size:.84rem;font-weight:700;padding:13px;
  resize:vertical;min-height:64px;margin-top:16px}
.notes:focus{outline:none;border-color:rgba(255,255,255,.2)}
.notes::placeholder{color:var(--mut2)}

/* REST / NO DAY */
.rest-wrap{padding:50px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rest-title{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:900;letter-spacing:4px;
  color:var(--mut);text-transform:uppercase}
.noday-wrap{padding:50px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.noday-title{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:900;letter-spacing:3px;
  color:var(--mut);text-transform:uppercase}
.noday-sub{font-size:.78rem;color:var(--mut);text-align:center;max-width:240px;
  line-height:1.6;font-weight:600}

/* CONFETTI */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* CUSTOM PLANS */
.plans-page{padding:16px 16px 110px;min-height:calc(100vh - 120px);display:flex;flex-direction:column}
.plan-card{background:linear-gradient(145deg,rgba(26,31,42,.95) 0%,rgba(20,24,32,.98) 100%);
  border:1px solid rgba(255,255,255,.07);border-radius:18px;margin-bottom:10px;
  overflow:hidden;transition:all .2s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.plan-card:active{transform:scale(.99)}
.plan-card-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px}
.plan-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:900;flex-shrink:0}
.plan-card-name{font-size:.9rem;font-weight:800;flex:1}
.plan-card-sub{font-size:.62rem;color:var(--mut);font-weight:600;margin-top:2px}
.plan-actions{display:flex;gap:6px}
.plan-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.62rem;font-weight:700;
  font-family:'Nunito',sans-serif;color:var(--acc3);transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.plan-btn:hover{border-color:rgba(255,255,255,.2);color:var(--acc)}
.plan-btn.del{color:var(--red);border-color:rgba(248,113,113,.15)}
.plan-btn.del:hover{border-color:var(--red)}
.add-plan-btn{width:100%;background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.1);
  border-radius:18px;padding:16px;cursor:pointer;color:var(--mut);font-family:'Nunito',sans-serif;
  font-size:.82rem;font-weight:700;text-align:center;transition:all .2s;margin-top:4px}
.add-plan-btn:hover{border-color:rgba(255,255,255,.2);color:var(--acc3);background:rgba(255,255,255,.06)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;transition:transform .15s;border:2px solid transparent}
.color-dot.sel{border-color:var(--acc);transform:scale(1.2)}
.color-dot:active{transform:scale(.9)}

/* LOADING */
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,#0d1424,var(--bg) 70%)}
.loading-logo{font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:900;
  letter-spacing:6px;color:var(--acc);text-transform:uppercase}
.loading-sub{font-size:.65rem;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-weight:800}

/* ONBOARDING */
.onboard-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;
  justify-content:center;animation:fadeIn .2s ease}
.onboard-modal{background:var(--sur);border-radius:24px 24px 0 0;border:1px solid rgba(255,255,255,.08);
  border-bottom:none;padding:28px 20px 44px;width:100%;max-width:480px;
  animation:slideUp .3s cubic-bezier(.34,1.1,.64,1)}
.onboard-title{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;color:var(--txt)}
.onboard-sub{font-size:.75rem;color:var(--mut);font-weight:600;line-height:1.5;margin-bottom:22px}
.onboard-tmpl{background:linear-gradient(145deg,rgba(26,31,42,.95),rgba(20,24,32,.98));
  border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px}
.onboard-tmpl:hover{border-color:rgba(255,255,255,.18);transform:scale(1.01)}
.onboard-tmpl:active{transform:scale(.99)}
.onboard-tmpl-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;flex-shrink:0}
.onboard-tmpl-name{font-size:.9rem;font-weight:800}
.onboard-tmpl-sub{font-size:.65rem;color:var(--mut);font-weight:600;margin-top:2px}
.onboard-or{display:flex;align-items:center;gap:10px;margin:14px 0}
.onboard-or-line{flex:1;height:1px;background:rgba(255,255,255,.07)}
.onboard-or-text{font-size:.62rem;color:var(--mut);font-weight:800;letter-spacing:1px;text-transform:uppercase}

/* PREV WEIGHT HINT */
.prev-hint{font-size:.48rem;color:rgba(255,255,255,.3);text-align:center;margin-top:2px;font-weight:700;letter-spacing:.5px}
.sb.done .prev-hint{color:rgba(134,239,172,.3)}

/* LIGHT MODE */
body.light{
  --bg:#f0f2f8;--sur:#ffffff;--card:#f8f9ff;--card2:#eef0fa;
  --bdr:#dde0f0;--bdr2:#ccd0e8;
  --acc:#1a1f2a;--acc2:#3b6bff;--acc3:#4466bb;--acc-txt:#ffffff;
  --txt:#0d1020;--mut:#7080a0;--mut2:#a0aac0;
  --ga:#0066aa;--ga-bg:#e0f0ff;--gb:#007744;--gb-bg:#e0f5ea;
  --red:#cc2222;--red-bg:#ffe8e8;--grn:#007744;--grn-bg:#e0f5ea;
  --gold:#996600;--gold-bg:#fff5d0;
  --bdr-glass:rgba(0,0,0,.1);
}

/* Base cards */
body.light .excard,body.light .day-banner,body.light .statsbar,
body.light .timer-bar,body.light .week-goal-card,body.light .timer-settings-card,
body.light .graph-card,body.light .bw-card,body.light .streak-mini,
body.light .plan-card,body.light .lc,body.light .review-card,
body.light .history-entry,body.light .tmpl-card{
  background:#ffffff!important;
  border-color:rgba(0,0,0,.08)!important;
  box-shadow:0 2px 12px rgba(0,0,0,.07)!important;
}

/* Modal */
body.light .modal{background:#f8f9ff!important;border-color:rgba(0,0,0,.08)!important}
body.light .modal-opt{background:#f0f2fa!important;border-color:rgba(0,0,0,.08)!important}
body.light .modal-opt.active{background:#e8f0ff!important;border-color:var(--acc)!important}

/* Header & nav */
body.light header{background:rgba(240,242,248,.92)!important;border-bottom-color:rgba(0,0,0,.07)!important;padding-top:env(safe-area-inset-top,0px)!important}
body.light .bnav{background:rgba(235,237,248,.95)!important;border-top-color:rgba(0,0,0,.07)!important}

/* Pill stays dark in light mode */
body.light .bnav-glass-pill{
  background:linear-gradient(160deg,#1a1f2a 0%,#2d3548 100%)!important;
  border-color:rgba(0,0,0,.2)!important;
  box-shadow:0 2px 12px rgba(0,0,0,.25)!important;
}
body.light .bnav-btn{color:rgba(0,0,0,.4)!important}
body.light .bnav-btn.on{color:#fff!important}

/* Set blocks */
body.light .sb{
  background:#f0f2fa!important;
  border-color:rgba(0,0,0,.08)!important;
}
body.light .sb.done{
  background:#e0f5ea!important;
  border-color:rgba(0,120,70,.25)!important;
}
body.light .sb.done .slbl{color:#007744!important}
body.light .sb.done .si{background:#d0f0e0!important;border-color:rgba(0,120,70,.2)!important;color:#005533!important}
body.light .sb.done .ulbl{color:#007744!important}
body.light .sb-check{background:#007744!important}
body.light .sb-check svg{stroke:#fff!important}

/* Inputs */
body.light .si{background:#ffffff!important;border-color:rgba(0,0,0,.12)!important;color:#0d1020!important}
body.light .si::placeholder{color:#a0aac0!important}
body.light .si:focus{border-color:rgba(0,0,0,.35)!important}
body.light .fld input{background:#f5f7ff!important;border-color:rgba(0,0,0,.1)!important;color:#0d1020!important}
body.light .notes{background:#f5f7ff!important;border-color:rgba(0,0,0,.08)!important;color:#0d1020!important}
body.light .bw-input{background:#f5f7ff!important;border-color:rgba(0,0,0,.1)!important;color:#0d1020!important}
body.light .add-ex-input{background:#f5f7ff!important;border-color:rgba(0,0,0,.1)!important;color:#0d1020!important}
body.light .graph-select{background:#f5f7ff!important;border-color:rgba(0,0,0,.1)!important;color:#0d1020!important}

/* Exercise card done state */
body.light .excard.all-done{
  background:#e8f8f0!important;
  border-color:rgba(0,120,70,.2)!important;
}
body.light .excard.all-done .exname{color:#007744!important}

/* PR badge */
body.light .pr-badge{
  background:#fff5d0!important;
  border-color:rgba(180,140,0,.3)!important;
  color:#996600!important;
}

/* Badges / achievements */
body.light .achieve-card{
  background:#f5f7ff!important;
  border-color:rgba(0,0,0,.08)!important;
  box-shadow:0 2px 8px rgba(0,0,0,.06)!important;
}
body.light .achieve-card.earned{
  background:linear-gradient(145deg,#fffbe8,#fff5cc)!important;
  border-color:rgba(180,140,0,.25)!important;
}
body.light .achieve-card.locked{opacity:.5!important}
body.light .achieve-name{color:#0d1020!important}
body.light .achieve-desc{color:#7080a0!important}
body.light .achieve-card.earned .achieve-name{color:#996600!important}

/* Calendar */
body.light .cal-day:hover{background:#eef0fa!important}
body.light .cal-day.today{border-color:#1a1f2a!important}
body.light .cal-day.selected{background:#1a1f2a!important}
body.light .cal-day.selected .cal-dn{color:#ffffff!important}
body.light .cal-day.selected .cal-dot{opacity:.6!important}
body.light .cal-dn{color:#0d1020!important}
body.light .cal-day-lbl{color:#7080a0!important}

/* Badges (exercise) */
body.light .ba{background:#e0f0ff!important;color:#005599!important;border-color:rgba(0,85,153,.15)!important}
body.light .bb{background:#e0f5ea!important;color:#005533!important;border-color:rgba(0,85,51,.15)!important}

/* Week pips */
body.light .pip{background:#dde0f0!important}
body.light .pip.done{background:#1a1f2a!important}

/* History entries */
body.light .history-entry{background:#f8f9ff!important;border-color:rgba(0,0,0,.07)!important}
body.light .history-date{color:#7080a0!important}
body.light .history-title{color:#0d1020!important}
body.light .history-stat{color:#7080a0!important}

/* Timer ring */
body.light .timer-ring-fill{stroke:#1a1f2a!important}
body.light .timer-num{color:#1a1f2a!important}

/* Prev hint */
body.light .prev-hint{color:rgba(0,0,0,.25)!important}
body.light .sb.done .prev-hint{color:rgba(0,100,60,.3)!important}

/* bw list */
body.light .bw-entry{background:#f0f2fa!important;border-color:rgba(0,0,0,.06)!important}

/* Seclbl add button */
body.light .add-ex-btn{background:#eef0fa!important;border-color:rgba(0,0,0,.1)!important;color:#4466bb!important}

/* Day banner change btn */
body.light .day-banner-change{background:#eef0fa!important;border-color:rgba(0,0,0,.1)!important;color:#7080a0!important}

/* Plan cards in plans page */
body.light .plan-card{background:#f8f9ff!important}
body.light .plan-btn{background:#eef0fa!important;border-color:rgba(0,0,0,.1)!important;color:#4466bb!important}
body.light .add-plan-btn{background:#f0f2fa!important;border-color:rgba(0,0,0,.1)!important;color:#7080a0!important}

/* Stats section title */
body.light .stats-section-title{color:#a0aac0!important}

/* Stats sub-tabs */
.stats-tab-active{color:#080a0f}
.stats-tab-inactive{color:var(--mut)}
body.light .stats-tab-active{color:#ffffff!important}
body.light .stats-tab-inactive{color:rgba(0,0,0,.45)!important}

/* Google Maps button - keep dark bg, white text in light mode */
body.light .maps-btn{color:#ffffff!important}

/* Stats sub-tabs: keep dark background, use white text */
body.light .stats-tabs-btn-active{color:#ffffff!important}
body.light .stats-tabs-btn-inactive{color:rgba(0,0,0,.4)!important}

/* Loading */
body.light .loading{background:radial-gradient(ellipse 80% 50% at 50% 0%,#dde5ff,var(--bg) 70%)}

/* pfill in light mode */
body.light .pfill{background:linear-gradient(90deg,#1a1f2a,#4466bb)!important}
body.light .cal-confirm-btn{color:#ffffff!important}
/* Active section tab - dark bg needs white text in light mode */
body.light button[style*="var(--acc)"][style*="#080a0f"]{color:#ffffff!important}
/* Template übernehmen button */
body.light .tmpl-card button{color:#ffffff!important}
/* Any button with var(--acc) background gets white text in light mode */
body.light .pbtn{color:#ffffff!important}
body.light button.pbtn{color:#ffffff!important}

/* Avatar (T) - white text on dark bg in light mode */
body.light .uav{background:#1a1f2a!important;color:#ffffff!important}
body.light .gym-ok-btn{color:#ffffff!important}
/* Light mode: hide orbs completely */
body.light .orb-layer{display:none!important}
body.light .noday-cta-btn{color:#ffffff!important}
/* Light mode: big weekday gradient text */
body.light [style*="WebkitTextFillColor:transparent"]{
  background:linear-gradient(160deg,#1a1f2a 0%,rgba(0,0,0,.2) 80%)!important;
  -webkit-background-clip:text!important;background-clip:text!important;
  -webkit-text-fill-color:transparent!important;
}
/* Light mode: TAG PLANEN button */
body.light .pbtn{background:var(--acc)!important;color:#ffffff!important}
/* Light mode: noday page text */
body.light .noday-wrap *{color:var(--txt)!important;-webkit-text-fill-color:var(--txt)!important}
/* Light mode: motivational quote */
body.light .noday-wrap div[style*="italic"]{color:var(--mut)!important}
/* Light mode: day banner */
body.light .day-banner{background:#ffffff!important}
/* Login screen light mode */
body.light .ltab.on{color:#ffffff!important}
body.light .logo{color:#0d1020!important;-webkit-text-fill-color:#0d1020!important}
body.light .logo-sub{color:#7080a0!important}
body.light .lc{background:#ffffff!important;box-shadow:0 8px 40px rgba(0,0,0,.12)!important}
body.light .lw{background:linear-gradient(135deg,#e8eaf6,#f0f2f8)!important}
body.light .fld label{color:#7080a0!important}

/* Light mode: inline style overrides using rgba(255,255,255,...) - make them use dark equivalents */
body.light .plans-page div[style*="rgba(255,255,255,.06)"],
body.light .plans-page div[style*="rgba(255,255,255,.05)"],
body.light .plans-page div[style*="rgba(255,255,255,.04)"],
body.light .plans-page div[style*="rgba(255,255,255,.03)"] {
  background:rgba(0,0,0,.04)!important;
}
body.light .plans-page div[style*="rgba(255,255,255,.07)"],
body.light .plans-page div[style*="rgba(255,255,255,.08)"] {
  border-color:rgba(0,0,0,.1)!important;
}
/* Plan header text in light mode */
body.light .plans-page { color: #0d1020 !important; }

/* Abschnitt tab buttons in light mode */
body.light button[style*="rgba(255,255,255,.06)"] {
  background:rgba(0,0,0,.06)!important;
  color:#7080a0!important;
}
/* Weiter button */
body.light button[style*="rgba(255,255,255,.04)"] {
  background:rgba(0,0,0,.04)!important;
  border-color:rgba(0,0,0,.1)!important;
  color:#7080a0!important;
}
/* Exercise pills in expanded plan */
body.light .plans-page div[style*="rgba(255,255,255,.05)"] {
  background:#eef0fa!important;
  border-color:rgba(0,0,0,.1)!important;
  color:#0d1020!important;
}
/* Section label text */
body.light .seclbl { color: #0d1020 !important; }
body.light .dayhdr { color: #0d1020 !important; }
body.light .daysub { color: #7080a0 !important; }
/* Stats page text */
body.light .stats-page { color: #0d1020 !important; }
/* Modal text */
body.light .modal { color: #0d1020 !important; }
body.light .modal-title { color: #0d1020 !important; }
/* Settings modal buttons */
body.light .modal button[style*="var(--card2)"] {
  background:#eef0fa!important;
  color:#4466bb!important;
}
/* Set block inputs in light mode - new design */
body.light .sb input[style*="color:var(--txt)"] {
  color:#0d1020!important;
}
/* Abschnitt done buttons green text stays */
body.light button[style*="#3fd4a0"] { color:#007744!important; }
body.light button[style*="rgba(63,212,160"] {
  background:rgba(0,120,70,.1)!important;
  border-color:rgba(0,120,70,.2)!important;
  color:#007744!important;
}
/* Settings modal dark/light toggle */
body.light .modal button[style*="rgba(255,255,255,.06)"] {
  background:#eef0fa!important;
}

/* Plan exercise tags in light mode */
body.light .tmpl-tag{background:#eef0fa!important;border-color:rgba(0,0,0,.1)!important;color:#4466bb!important}
body.light .plan-card .tmpl-tag{background:#eef0fa!important;border-color:rgba(0,0,0,.1)!important;color:#4466bb!important}
body.light .plan-ex-pill{background:#eef0fa!important;border-color:rgba(0,0,0,.1)!important;color:#4466bb!important}
body.light .plan-ex-pill span{color:#7080a0!important}

/* OK/Save buttons with dark bg - white text */
body.light .bw-save-btn{color:#ffffff!important}
body.light .edit-save{color:#ffffff!important;background:#1a1f2a!important}
body.light .pbtn{color:#ffffff!important;background:#1a1f2a!important}
body.light .add-plan-btn-save{color:#ffffff!important}

/* Confetti stays bright */
body.light .confetti-piece{opacity:.9}

/* ACHIEVEMENTS */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.achieve-card{background:linear-gradient(145deg,rgba(26,31,42,.95) 0%,rgba(20,24,32,.98) 100%);
  border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  transition:all .2s}
.achieve-card.earned{border-color:rgba(251,191,36,.3);background:linear-gradient(145deg,rgba(42,34,10,.95),rgba(30,24,8,.98))}
.achieve-card.locked{opacity:.4;filter:grayscale(.8)}
.achieve-icon{font-size:1.8rem;line-height:1}
.achieve-name{font-size:.58rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--txt)}
.achieve-desc{font-size:.52rem;color:var(--mut);font-weight:600;line-height:1.3}
.achieve-card.earned .achieve-name{color:var(--gold)}

/* HISTORY */
.history-entry{background:linear-gradient(145deg,rgba(26,31,42,.95),rgba(20,24,32,.98));
  border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;
  margin-bottom:8px;cursor:pointer;transition:all .15s}
.history-entry:active{transform:scale(.99)}
.history-date{font-size:.65rem;color:var(--mut);font-weight:700;margin-bottom:4px}
.history-title{font-size:.88rem;font-weight:800;margin-bottom:3px}
.history-meta{display:flex;gap:12px}
.history-stat{font-size:.62rem;color:var(--mut);font-weight:600}
.history-stat span{color:var(--acc);font-weight:800}

/* WEEKLY REVIEW */
.review-card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:18px;margin-bottom:12px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.review-title{font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.review-sub{font-size:.65rem;color:var(--mut);font-weight:600;margin-bottom:16px}
.review-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.review-stat-val{font-family:'Montserrat',sans-serif;font-size:1.5rem;font-weight:900;color:var(--acc);line-height:1}
.review-stat-lbl{font-size:.54rem;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* PLAN TEMPLATES */
.tmpl-card{background:linear-gradient(145deg,rgba(26,31,42,.95),rgba(20,24,32,.98));
  border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer;transition:all .15s}
.tmpl-card:active{transform:scale(.99)}
.tmpl-card-hdr{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tmpl-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:1.3rem;flex-shrink:0}
.tmpl-name{font-size:.9rem;font-weight:800}
.tmpl-sub{font-size:.65rem;color:var(--mut);font-weight:600;margin-top:2px}
.tmpl-tags{display:flex;gap:5px;flex-wrap:wrap}
.tmpl-tag{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-radius:6px;padding:3px 8px;font-size:.58rem;font-weight:700;color:var(--acc3)}

/* ── LIQUID GLASS ── */
.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 100%);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
}
.glass-card{
  background:linear-gradient(145deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.01) 100%);
  backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 4px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.2);
}
.glass-btn{
  background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 100%);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 2px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1);
}
.glass-btn:active{transform:scale(.97)}

/* Override cards to use glass */
.excard{
  background:linear-gradient(145deg,rgba(26,31,42,.95) 0%,rgba(20,24,32,.98) 100%);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
}
.excard.all-done{
  background:linear-gradient(145deg,rgba(12,42,26,.7) 0%,rgba(8,28,18,.8) 100%);
  border:1px solid rgba(134,239,172,.2);
  box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 20px rgba(134,239,172,.06),inset 0 1px 0 rgba(134,239,172,.1);
}
.day-banner{
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 100%);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 4px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
}
.statsbar{
  background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.01) 100%);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 2px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
}
.timer-bar{
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 100%);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
}
.week-goal-card,.timer-settings-card,.graph-card,.bw-card,.streak-mini{
  background:linear-gradient(145deg,rgba(26,31,42,.9) 0%,rgba(20,24,32,.95) 100%);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 4px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
}
header{
  background:rgba(8,10,15,.7)!important;
  backdrop-filter:blur(32px) saturate(2)!important;
  -webkit-backdrop-filter:blur(32px) saturate(2)!important;
  border-bottom:1px solid rgba(255,255,255,.06)!important;
  box-shadow:0 1px 0 rgba(255,255,255,.04),0 4px 24px rgba(0,0,0,.5);
  padding-top:env(safe-area-inset-top,0px)!important;
}
.bnav{
  background:rgba(8,10,15,.7)!important;
  backdrop-filter:blur(32px) saturate(2)!important;
  -webkit-backdrop-filter:blur(32px) saturate(2)!important;
  border-top:1px solid rgba(255,255,255,.06)!important;
  box-shadow:0 -4px 24px rgba(0,0,0,.5);
  padding-bottom:env(safe-area-inset-bottom,0px)!important;
}
.modal{
  background:linear-gradient(180deg,rgba(18,22,32,.97) 0%,rgba(12,15,22,.99) 100%)!important;
  backdrop-filter:blur(40px) saturate(2)!important;
  -webkit-backdrop-filter:blur(40px) saturate(2)!important;
  border:1px solid rgba(255,255,255,.08)!important;
  box-shadow:0 -8px 64px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03);
}
.sb{
  background:linear-gradient(145deg,rgba(14,17,23,.9) 0%,rgba(10,13,18,.95) 100%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04);
}
.sb.done{
  background:linear-gradient(145deg,rgba(12,42,26,.8) 0%,rgba(8,28,18,.85) 100%);
  border:1px solid rgba(134,239,172,.25);
  box-shadow:0 2px 12px rgba(0,0,0,.3),0 0 12px rgba(134,239,172,.08),inset 0 1px 0 rgba(134,239,172,.08);
}

/* ── ANIMATIONS ── */
@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.92)}
  to{opacity:1;transform:scale(1)}
}
@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 0 24px rgba(255,255,255,.06)}
}
@keyframes slideInRight{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:translateX(0)}
}

.page>*{animation:fadeSlideUp .35s cubic-bezier(.25,.46,.45,.94) both}
.page>*:nth-child(1){animation-delay:.05s}
.page>*:nth-child(2){animation-delay:.1s}
.page>*:nth-child(3){animation-delay:.15s}
.page>*:nth-child(4){animation-delay:.2s}
.page>*:nth-child(5){animation-delay:.25s}
.page>*:nth-child(6){animation-delay:.3s}

.excard{animation:fadeSlideUp .3s cubic-bezier(.25,.46,.45,.94) both;transition:transform .15s,box-shadow .15s,border-color .3s,background .3s}
.excard:active{transform:scale(.99)}

.sb{transition:all .3s cubic-bezier(.25,.46,.45,.94)}
.sb.done{animation:glowPulse 2s ease-in-out infinite}

.streak-mini{animation:scaleIn .3s cubic-bezier(.34,1.56,.64,1) both}
.streak-mini:nth-child(1){animation-delay:.1s}
.streak-mini:nth-child(2){animation-delay:.18s}

.pfill{transition:width .6s cubic-bezier(.34,1.56,.64,1)!important}

.bnav-btn{transition:color .2s,transform .15s}
.bnav-btn.on{transform:scale(1.08)}
.bnav-btn:active{transform:scale(.92)}

.pbtn{transition:opacity .2s,transform .15s}
.pbtn:active{transform:scale(.97)}

.cal-day{transition:all .15s cubic-bezier(.25,.46,.45,.94)}
.cal-day:active{transform:scale(.9)}
.cal-day.selected{box-shadow:0 0 20px rgba(255,255,255,.15),0 4px 12px rgba(0,0,0,.4)}

.lc{animation:scaleIn .4s cubic-bezier(.34,1.56,.64,1)}

/* Shimmer on loading */
.loading-logo{
  background:linear-gradient(90deg,#fff 0%,#a8b4cc 50%,#fff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:shimmer 2.5s linear infinite;
}

/* Glow on active nav item */
.bnav-btn.on svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.4))}

/* Glass input fields */
.si:focus{
  border-color:rgba(255,255,255,.3)!important;
  box-shadow:0 0 0 3px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.04);
}
.fld input:focus{
  border-color:rgba(255,255,255,.35)!important;
  box-shadow:0 0 0 4px rgba(255,255,255,.04);
}

/* Accent button glow */
.pbtn{box-shadow:0 4px 20px rgba(255,255,255,.1),0 1px 0 rgba(255,255,255,.3) inset}
.pbtn:hover{box-shadow:0 6px 28px rgba(255,255,255,.15),0 1px 0 rgba(255,255,255,.3) inset}

/* Progress bar glow */
.pfill{box-shadow:0 0 12px rgba(255,255,255,.2)}

/* Timer ring glow */
.timer-ring-fill{filter:drop-shadow(0 0 4px rgba(255,255,255,.3))}

/* Dot glow */
.dot{box-shadow:0 0 8px rgba(134,239,172,.6),0 0 16px rgba(134,239,172,.3)}

/* Modal opts */
.modal-opt{transition:all .15s}
.modal-opt:active{transform:scale(.98)}
.modal-opt.active{box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.05)}

/* Smooth page transitions */
.stats-page>*{animation:fadeSlideUp .3s cubic-bezier(.25,.46,.45,.94) both}
.stats-page>*:nth-child(1){animation-delay:.05s}
.stats-page>*:nth-child(2){animation-delay:.1s}
.stats-page>*:nth-child(3){animation-delay:.15s}
.stats-page>*:nth-child(4){animation-delay:.2s}
.stats-page>*:nth-child(5){animation-delay:.25s}


/* ── LEBENDIGKEIT ────────────────────────────────────────────── */

/* Floating dots background on empty training page */
@keyframes float1{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.05)}}
@keyframes orbFloat1{
  0%{transform:translate(0,0) scale(1)}
  33%{transform:translate(18vw,15vh) scale(1.08)}
  66%{transform:translate(-12vw,26vh) scale(.94)}
  100%{transform:translate(0,0) scale(1)}
}
@keyframes orbFloat2{
  0%{transform:translate(0,0) scale(1)}
  40%{transform:translate(-20vw,18vh) scale(1.1)}
  70%{transform:translate(-9vw,28vh) scale(.92)}
  100%{transform:translate(0,0) scale(1)}
}
@keyframes orbFloat3{
  0%{transform:translate(0,0) scale(1)}
  35%{transform:translate(16vw,-18vh) scale(1.07)}
  70%{transform:translate(8vw,-28vh) scale(.93)}
  100%{transform:translate(0,0) scale(1)}
}
@keyframes float2{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(.95)}}
@keyframes float3{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes pulseGlow{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes shimmerMove{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 var(--acc)33}50%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* Pulse on the green dot in header */
.dot{animation:pulseGlow 2.5s ease-in-out infinite!important}

/* Savebar breathes */
.savetxt.ok{animation:breathe 3s ease-in-out infinite}

/* ExCard hover feel */
.excard{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s!important}
.excard:active{transform:scale(.98)!important}

/* Set block done pop */
.sb.done{animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both,glowPulse 2.5s ease-in-out infinite!important}

/* Nav buttons spring */
.bnav-btn:active{transform:scale(.88)!important;transition:transform .1s!important}
.bnav-btn.on{animation:popIn .25s cubic-bezier(.34,1.56,.64,1) both}

/* Plan cards slide in */
.plans-page>*{animation:slideUp .35s cubic-bezier(.25,.46,.45,.94) both}
.plans-page>*:nth-child(1){animation-delay:.05s}
.plans-page>*:nth-child(2){animation-delay:.1s}
.plans-page>*:nth-child(3){animation-delay:.15s}
.plans-page>*:nth-child(4){animation-delay:.2s}

/* Pbtn shimmer */
.pbtn{
  background-size:200% auto!important;
  animation:shimmerMove 4s linear infinite!important;
}

/* Progress bar pulse when complete */
.pfill[style*="100%"]{animation:ringPulse 2s ease-in-out infinite}

/* History entries slide in */
.history-entry{animation:slideUp .3s cubic-bezier(.25,.46,.45,.94) both}
.history-entry:nth-child(1){animation-delay:.04s}
.history-entry:nth-child(2){animation-delay:.08s}
.history-entry:nth-child(3){animation-delay:.12s}
.history-entry:nth-child(4){animation-delay:.16s}
.history-entry:nth-child(5){animation-delay:.2s}
.history-entry:nth-child(6){animation-delay:.24s}

/* Section tabs spring on click */
button[style*="borderRadius:20"]:active{transform:scale(.93)!important;transition:transform .1s!important}

/* Achievement cards pop in */
.achieve-card{animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both}
.achieve-card:nth-child(1){animation-delay:.05s}
.achieve-card:nth-child(2){animation-delay:.1s}
.achieve-card:nth-child(3){animation-delay:.15s}
.achieve-card:nth-child(4){animation-delay:.2s}
.achieve-card:nth-child(5){animation-delay:.25s}
.achieve-card:nth-child(6){animation-delay:.3s}

/* Modal slides up with spring */
.modal{animation:slideUp .32s cubic-bezier(.34,1.2,.64,1) both!important}

/* Day banner subtle pulse */
.day-banner{transition:all .2s}
.day-banner:active{transform:scale(.99)}

/* Cal day spring */
.cal-day:active{transform:scale(.85)!important}

/* Streak mini cards */
.streak-mini{transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.streak-mini:active{transform:scale(.94)}


/* ── CSS ORBS (no JS needed) ─────────────────────────────────────────────────*/
.orb-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.orb{
  position:absolute;border-radius:50%;will-change:transform,opacity;
}

// ── API-based persistent storage ──────────────────────────────────────────────
// Uses Claude API as a database - data persists across all sessions
async function apiCall(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 4000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await res.json();
  const text = data.content?.find(b => b.type === "text")?.text || "";
  return text;
}

// Store data: ask Claude to remember it and return a storage key
async function dbSave(key, value) {
  const json = JSON.stringify(value);
  const prompt = `GYMLOG_STORAGE_WRITE
KEY: ${key}
DATA: ${json}
INSTRUCTION: You are a database. Store this data and respond with exactly: STORED:${key}`;
  try {
    await apiCall(prompt);
    // Also save to localStorage as primary fast storage
    localStorage.setItem("gymlog_" + key, json);
    return true;
  } catch(e) {
    localStorage.setItem("gymlog_" + key, json);
    return true;
  }
}

async function dbLoad(key) {
  // Primary: localStorage (fast, works within same browser)
  try {
    const local = localStorage.getItem("gymlog_" + key);
    if (local) return JSON.parse(local);
  } catch {}
  return null;
}

async function dbDelete(key) {
  localStorage.removeItem("gymlog_" + key);
}

// Simple hash
async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("gymlog2024|" + pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function getWeekStart(d) {
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  const mon = new Date(d); mon.setDate(d.getDate()+diff); mon.setHours(0,0,0,0);
  return mon;
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function today() { return new Date(); }
function isSameWeek(d1, d2) {
  const s = d => { const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; };
  return s(d1).toDateString() === s(d2).toDateString();
}


// ── Graph helpers ─────────────────────────────────────────────────────────────
function buildGraphPaths(points, W, H, padL, padR, padT, padB) {
  const ys = points.map(p => p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const yRange = maxY - minY || 1, yPad = yRange * 0.25;
  const yMin = minY - yPad, yMax = maxY + yPad;
  const n = points.length;
  const sx = i => padL + (n < 2 ? 0.5 : i / (n-1)) * (W - padL - padR);
  const sy = v => padT + (1 - (v-yMin)/(yMax-yMin)) * (H - padT - padB);
  function line(pts) {
    let d = `M${sx(0).toFixed(1)},${sy(pts[0].y).toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const x0=sx(i),y0=sy(pts[i].y),x1=sx(i+1),y1=sy(pts[i+1].y),cpx=(x0+x1)/2;
      d+=` C${cpx.toFixed(1)},${y0.toFixed(1)} ${cpx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
    }
    return d;
  }
  function area(pts){ return `${line(pts)} L${sx(n-1).toFixed(1)},${(H-padB).toFixed(1)} L${padL},${(H-padB).toFixed(1)} Z`; }
  const tickVals = Array.from({length:4},(_,i)=>Math.round(yMin+(i/3)*(yMax-yMin)));
  const step = Math.max(1,Math.floor((n-1)/4));
  const xIdxs = [];
  for(let i=0;i<n;i+=step) xIdxs.push(i);
  if(xIdxs[xIdxs.length-1]!==n-1) xIdxs.push(n-1);
  return {sx,sy,line,area,tickVals,xIdxs};
}

function Confetti({onDone}) {
  const [phase,setPhase]=useState("in");
  useEffect(()=>{
    const t1=setTimeout(()=>setPhase("hold"),80);
    const t2=setTimeout(()=>setPhase("out"),1800);
    const t3=setTimeout(onDone,2200);
    return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
  },[]);

  const C = 2 * Math.PI * 40; // circumference for r=40

  return (
    <div style={{position:"fixed",inset:0,zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",
      pointerEvents:"none",
      background:phase==="out"?"rgba(0,0,0,0)":"rgba(0,0,0,.55)",
      backdropFilter:phase==="out"?"none":"blur(8px)",
      WebkitBackdropFilter:phase==="out"?"none":"blur(8px)",
      transition:"background .5s ease, backdrop-filter .5s ease"}}>
      <div style={{
        textAlign:"center",
        opacity:phase==="out"?0:phase==="hold"?1:0,
        transform:phase==="hold"?"scale(1) translateY(0)":phase==="in"?"scale(.7) translateY(16px)":"scale(1.05) translateY(-8px)",
        transition:"opacity .4s ease, transform .5s cubic-bezier(.34,1.56,.64,1)",
      }}>
        {/* Animated SVG circle + checkmark */}
        <div style={{position:"relative",width:100,height:100,margin:"0 auto 20px"}}>
          <svg width="100" height="100" viewBox="0 0 100 100" style={{transform:"rotate(-90deg)"}}>
            {/* Background circle */}
            <circle cx="50" cy="50" r="40" fill="none"
              stroke="rgba(134,239,172,.15)" strokeWidth="5"/>
            {/* Animated green circle */}
            <circle cx="50" cy="50" r="40" fill="none"
              stroke="#3fd4a0" strokeWidth="5" strokeLinecap="round"
              strokeDasharray={C}
              strokeDashoffset={phase==="hold"?0:C}
              style={{transition:"stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)",
                filter:"drop-shadow(0 0 8px rgba(63,212,160,.5))"}}/>
          </svg>
          {/* Checkmark */}
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none"
            style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)"}}>
            <polyline points="8,22 18,32 36,12"
              stroke="#3fd4a0" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"
              fill="none"
              strokeDasharray="50"
              strokeDashoffset={phase==="hold"?0:50}
              style={{transition:"stroke-dashoffset .5s cubic-bezier(.4,0,.2,1) .6s",
                filter:"drop-shadow(0 0 6px rgba(63,212,160,.6))"}}/>
          </svg>
          {/* Glow ring */}
          <div style={{position:"absolute",inset:-8,borderRadius:"50%",
            background:"radial-gradient(circle,rgba(63,212,160,.08) 0%,transparent 70%)",
            animation:phase==="hold"?"shimmerPulse 2s ease-in-out infinite":"none"}}/>
        </div>

        <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.2rem",fontWeight:900,
          letterSpacing:"2px",textTransform:"uppercase",color:"#fff",
          textShadow:"0 0 24px rgba(63,212,160,.3)",marginBottom:"6px"}}>
          Training abgeschlossen
        </div>
        <div style={{fontSize:".7rem",color:"rgba(255,255,255,.45)",fontWeight:600,letterSpacing:"1px"}}>
          Gut gemacht!
        </div>
      </div>
    </div>
  );
}

function RestTimer({onDismiss, duration=90}) {
  const [left,setLeft]=useState(duration);
  const [running,setRunning]=useState(true);
  const ref=useRef(null);
  const C=2*Math.PI*22;
  useEffect(()=>{
    if(!running) return;
    ref.current=setInterval(()=>setLeft(l=>{if(l<=1){clearInterval(ref.current);onDismiss();return 0;}return l-1;}),1000);
    return()=>clearInterval(ref.current);
  },[running]);
  const pct=left/duration,mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
  return (
    <div className="timer-bar">
      <div className="timer-ring">
        <svg viewBox="0 0 52 52"><circle className="timer-ring-track" cx="26" cy="26" r="22"/><circle className="timer-ring-fill" cx="26" cy="26" r="22" strokeDasharray={C} strokeDashoffset={C*(1-pct)}/></svg>
        <div className="timer-num">{mm}:{ss}</div>
      </div>
      <div className="timer-info"><div className="timer-title">Pause</div><div className="timer-sub">{running?"Erholung...":"Pausiert"}</div></div>
      <div className="timer-btns">
        <button className="timer-btn" onClick={()=>{clearInterval(ref.current);setRunning(r=>!r);}}>{running?"||":">"}</button>
        <button className="timer-btn skip" onClick={onDismiss}>Weiter</button>
      </div>
    </div>
  );
}

  return (

      <div className="slbl">Satz {idx+1}</div>
      {!bodyweight&&<>
        <input className="si" type="number" placeholder="kg" step="0.5" value={data.w??""} onChange={e=>onChange("w",e.target.value)}/>
        {prevWeight&&!data.w&&<div className="prev-hint">{prevWeight}kg</div>}
        <div className="ulbl">Gewicht</div>
      </>}
      <input className="si" type="number" placeholder="Wdh" step="1" value={data.r??""} onChange={e=>onChange("r",e.target.value)}/>
      <div className="ulbl">Wdh.</div>
      {isDone&&<div className="sb-check"><svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="#111" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1,4.5 3.5,7 8,1.5"/></svg></div>}
      {isDone&&isPR&&<div className="pr-badge">PR</div>}
    </div>
  );
}

function ExCard({ex, exData={}, overrides={}, onUpdate, onEditSave, onDelete, onSetComplete, prs, prevExData={}}) {
  const [showEdit,setShowEdit]=useState(false);
  const [localBW,setLocalBW]=useState(!!overrides.bodyweight);
  // Sync when overrides change from parent
  React.useEffect(()=>{ setLocalBW(!!overrides.bodyweight); },[overrides.bodyweight]);
  const isBW = localBW;
  const effSets=overrides.sets??ex.sets, effReps=overrides.reps??ex.reps;
  const isUserAdded=ex.id?.startsWith("cx_");
  const allDone=Array.from({length:effSets},(_,i)=>{const s=exData[i]??{};return isBW?!!(s.r&&parseFloat(s.r)>0):!!(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0);}).every(Boolean);

  function handleChange(i,f,v) {
    const updated={...exData,[i]:{...exData[i],[f]:v}};
    onUpdate(updated);
    const s=updated[i];
    const bw=isBW;
    const done=bw?(s.r&&parseFloat(s.r)>0):(s.w&&s.r&&parseFloat(s.w)>0&&parseFloat(s.r)>0);
    if(done) onSetComplete(ex.id,parseFloat(s.w)||parseFloat(s.r)||0);
  }

  return (
    <>
      <div className={`excard${allDone?" all-done":""}`}>
        <div className="exhdr">
          <div className="exname">{ex.name}</div>
          <div className="exhdr-right">
            <div className={`badge b${ex.badge}`}>{effSets}x * {effReps}{(overrides.sets||overrides.reps)?<span style={{marginLeft:"3px",opacity:.6}}>e</span>:""}</div>

            <button className="icon-btn" onClick={()=>setShowEdit(true)}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            {isUserAdded&&<button className="icon-btn del" onClick={onDelete}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4h6v2"/></svg></button>}
          </div>
        </div>
        {/* Bodyweight toggle */}
        <div style={{padding:"0 14px 8px",display:"flex",alignItems:"center",gap:"8px"}}>
          <button onClick={()=>{ const newBW=!isBW; setLocalBW(newBW); onEditSave({...overrides,bodyweight:newBW}); }}
            style={{display:"flex",alignItems:"center",gap:"6px",
              background:isBW?"rgba(var(--acc-rgb,255,255,255),.12)":"rgba(255,255,255,.04)",
              border:isBW?"1.5px solid var(--acc)":"1.5px solid rgba(255,255,255,.1)",
              borderRadius:20,padding:"5px 12px 5px 8px",cursor:"pointer",transition:"all .2s",
              fontFamily:"'Nunito',sans-serif",fontSize:".62rem",fontWeight:800,
              color:isBW?"var(--acc)":"var(--mut)",letterSpacing:".3px"}}>
            <div style={{width:16,height:16,borderRadius:"50%",
              background:isBW?"var(--acc)":"rgba(255,255,255,.1)",
              display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s",flexShrink:0}}>
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
                stroke={isBW?"#080a0f":"rgba(255,255,255,.4)"}
                strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="5" r="3"/>
                <path d="M6.5 8a6 6 0 0 0-1 3.5C5.5 15 8 18 12 20c4-2 6.5-5 6.5-8.5A6 6 0 0 0 17.5 8"/>
              </svg>
            </div>
            Körpergewicht
          </button>
          {isBW&&<span style={{fontSize:".58rem",color:"var(--mut)",fontWeight:600}}>Nur Wdh. nötig · Zusatzgewicht optional</span>}
        </div>
        <div className="sgrid">
          {Array.from({length:effSets},(_,i)=>{const s=exData[i]??{},w=parseFloat(s.w)||0,isPR=w>0&&prs[ex.id]===w;return <SetBlock key={i} idx={i} data={s} isPR={isPR} bodyweight={isBW} onChange={(f,v)=>handleChange(i,f,v)} onComplete={()=>onSetComplete(ex.id,parseFloat(s.w)||0)}/>;  })}
        </div>
      </div>
      {showEdit&&<EditModal ex={ex} overrides={overrides} onSave={v=>{onEditSave(v);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </>
  );
}

function TrainingPage({planIdx, dayData={}, customExercises={}, onUpdate, onUpdateCustom, onChangeType, prs, onNewPR, timerDuration=90, allDays={}, currentDk=''}) {
  const [showTimer,setShowTimer]=useState(false);
  const [addingToSection,setAddingToSection]=useState(null);
  const [activeSec,setActiveSec]=useState(0);
  const [showConfetti,setShowConfetti]=useState(false);
  const prevDoneRef=useRef(0);
  const confettiShownRef=useRef(false); // only show once per session
  const tab=DEFAULT_PLAN[planIdx];
  const planType=planIdx===0?"A":"B";
  // Find most recent previous session with same plan type
  const prevSessionData = Object.entries(allDays)
    .filter(([dk,di])=>dk<currentDk&&di?.type===planType)
    .sort(([a],[b])=>b.localeCompare(a))[0]?.[1] ?? null;
  const overrides=dayData?.overrides??{};
  let total=0,done=0;
  tab.sections.forEach((s,si)=>{const allEx=[...s.exercises,...(customExercises[`${planIdx}_${si}`]??[])];allEx.forEach((ex,ei)=>{const ov=overrides[`${si}_${ei}`]??{},effSets=ov.sets??ex.sets;total+=effSets;const ed=dayData?.sections?.[si]?.[ei]??{};for(let i=0;i<effSets;i++){const sd=ed[i]??{};if(sd.w&&sd.r&&parseFloat(sd.w)>0&&parseFloat(sd.r)>0) done++;}});});
  useEffect(()=>{
    if(total>0&&done===total&&prevDoneRef.current<total&&!confettiShownRef.current){
      confettiShownRef.current=true;
      setShowConfetti(true);
    }
    prevDoneRef.current=done;
  },[done,total]);
  function upEx(si,ei,val){onUpdate({...dayData,sections:{...dayData?.sections,[si]:{...dayData?.sections?.[si],[ei]:val}}});}
  function saveOverride(si,ei,val){const k=`${si}_${ei}`,newOv={...overrides};if(!val.sets&&!val.reps&&!val.bodyweight) delete newOv[k]; else newOv[k]=val;onUpdate({...dayData,overrides:newOv});}
  function handleSetComplete(exId,weight){setShowTimer(true);if(weight>0) onNewPR(exId,weight);}
  function addCustomEx(si,ex){const key=`${planIdx}_${si}`,prev=customExercises[key]??[];onUpdateCustom({...customExercises,[key]:[...prev,ex]});setAddingToSection(null);}
  function deleteCustomEx(si,idx){const key=`${planIdx}_${si}`,prev=[...(customExercises[key]??[])];onUpdateCustom({...customExercises,[key]:prev.filter((_,i)=>i!==idx)});}

  return (
    <div className="page">
      {showConfetti&&<Confetti onDone={()=>setShowConfetti(false)}/>}
      <div className="statsbar">
        <div className="stat"><div className="sv">{done}</div><div className="sl">Erledigt</div></div>
        <div className="stat"><div className="sv">{total}</div><div className="sl">Gesamt</div></div>
        {done===total&&total>0&&(
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:"6px",
            background:"rgba(63,212,160,.1)",border:"1px solid rgba(63,212,160,.25)",
            borderRadius:"10px",padding:"5px 10px"}}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#3fd4a0" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="2,6.5 5,9.5 11,3.5"/>
            </svg>
            <span style={{fontSize:".6rem",fontWeight:800,color:"#3fd4a0",letterSpacing:"1px",textTransform:"uppercase"}}>Abgeschlossen</span>
          </div>
        )}
        {!(done===total&&total>0)&&<button className="day-banner-change" style={{marginLeft:"auto"}} onClick={onChangeType}>Ändern</button>}
      </div>
      <div className="pbar"><div className="pfill" style={{width:total?(done/total*100)+"%":"0%"}}/></div>
      {showTimer&&<RestTimer onDismiss={()=>setShowTimer(false)} duration={timerDuration}/>}
      <div className="dayhdr">{tab.title}</div>
      <div className="daysub">{tab.subtitle}</div>
      {/* Abschnitt-Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        {tab.sections.map((s,i)=>{
          const cl2=customExercises[`${planIdx}_${i}`]??[];
          const ae2=[...s.exercises,...cl2];
          let d2=0,t2=0;
          ae2.forEach((ex,ei)=>{const ov2=overrides[`${i}_${ei}`]??{};const es2=ov2.sets??ex.sets;const ed2=dayData?.sections?.[i]?.[ei]??{};t2+=es2;for(let j=0;j<es2;j++){const s2=ed2[j]??{};if(s2.w&&s2.r&&parseFloat(s2.w)>0&&parseFloat(s2.r)>0)d2++;}});
          const ok2=t2>0&&d2===t2;
          return <button key={i} onClick={()=>setActiveSec(i)} style={{padding:"7px 16px",borderRadius:20,border:"none",cursor:"pointer",background:activeSec===i?"var(--acc)":ok2?"rgba(63,212,160,.15)":"rgba(255,255,255,.06)",color:activeSec===i?"var(--acc-txt,#080a0f)":ok2?"#3fd4a0":"var(--mut)",fontSize:".62rem",fontWeight:800,letterSpacing:".5px",textTransform:"uppercase",fontFamily:"'Nunito',sans-serif",transition:"all .2s"}}>{ok2?"✓ ":""}{s.label}</button>;
        })}
      </div>
      {tab.sections.map((sec,si)=>{
        if(si!==activeSec) return null;
        const customList=customExercises[`${planIdx}_${si}`]??[];
        const allEx=[...sec.exercises,...customList];
        return (
          <div key={si} style={{animation:"fadeSlideUp .25s ease both"}}>
            <div className="seclbl">{sec.label}<button className="add-ex-btn" onClick={()=>setAddingToSection(si)}>+ Ubung</button></div>
            {allEx.map((ex,ei)=><ExCard key={ex.id||ei} ex={ex} exData={dayData?.sections?.[si]?.[ei]??{}} overrides={overrides[`${si}_${ei}`]??{}} prs={prs} prevExData={prevSessionData?.sections?.[si]?.[ei]??{}} onUpdate={v=>upEx(si,ei,v)} onEditSave={v=>saveOverride(si,ei,v)} onDelete={()=>deleteCustomEx(si,ei-sec.exercises.length)} onSetComplete={handleSetComplete} onNewPR={onNewPR}/>)}
            {activeSec<tab.sections.length-1&&<button onClick={()=>setActiveSec(activeSec+1)} style={{width:"100%",background:"rgba(255,255,255,.04)",border:"1.5px solid rgba(255,255,255,.08)",borderRadius:16,padding:"13px",cursor:"pointer",color:"var(--mut)",fontFamily:"'Nunito',sans-serif",fontSize:".78rem",fontWeight:800,marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>Weiter: {tab.sections[activeSec+1].label} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><polyline points="12,5 19,12 12,19"/></svg></button>}
          </div>
        );
      })}
      <textarea className="notes" placeholder="Notizen zum Training..." value={dayData?.notes??""} onChange={e=>onUpdate({...dayData,notes:e.target.value})} style={{marginTop:16}}/>
      {addingToSection!==null&&<AddExerciseModal onAdd={ex=>addCustomEx(addingToSection,ex)} onClose={()=>setAddingToSection(null)}/>}
    </div>
  );
}
