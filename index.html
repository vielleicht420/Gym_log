    const mq=window.matchMedia("(prefers-color-scheme: light)");
    function handleChange(e){
      const saved=user?localStorage.getItem("gymlog_dark_"+user):localStorage.getItem("gymlog_dark_guest");
      if(saved===null||saved===undefined) setDarkMode(!e.matches);
    }
    mq.addEventListener("change",handleChange);
    return()=>mq.removeEventListener("change",handleChange);
  },[user]);

  useEffect(()=>{
    try{
      const session=JSON.parse(localStorage.getItem("gymlog_session")||"null");
      if(session?.username){
        const u=session.username;
        const auth=JSON.parse(localStorage.getItem("gymlog_auth_"+u)||"null");
        if(auth){
          setUser(u);
          setAllDays(JSON.parse(localStorage.getItem("gymlog_days_"+u)||"{}"));
          setPrs(JSON.parse(localStorage.getItem("gymlog_prs_"+u)||"{}"));
          setCustomEx(JSON.parse(localStorage.getItem("gymlog_cex_"+u)||"{}"));
          setWeekGoal(JSON.parse(localStorage.getItem("gymlog_wgoal_"+u)||"3"));
          setBodyWeights(JSON.parse(localStorage.getItem("gymlog_bw_"+u)||"[]"));
          setTimerDuration(JSON.parse(localStorage.getItem("gymlog_timer_"+u)||"90"));
          setCustomPlans(JSON.parse(localStorage.getItem("gymlog_cplans_"+u)||"[]"));
          setHiddenDefaults(JSON.parse(localStorage.getItem("gymlog_hdef_"+u)||"[]"));
          setGymName(localStorage.getItem("gymlog_gym_"+u)||"");
          setTheme(localStorage.getItem("gymlog_theme_"+u)||"default");
          setProfilePic(localStorage.getItem("gymlog_pic_"+u)||null);
          const savedDark=localStorage.getItem("gymlog_dark_"+u);
          const guestDark=localStorage.getItem("gymlog_dark_guest");
          if(savedDark!==null){setDarkMode(JSON.parse(savedDark));}
          else if(guestDark!==null){setDarkMode(JSON.parse(guestDark));localStorage.setItem("gymlog_dark_"+u,guestDark);localStorage.removeItem("gymlog_dark_guest");}
          else{setDarkMode(!window.matchMedia("(prefers-color-scheme: light)").matches);}
          setStatus("app");return;
        }
      }
    }catch(e){}
    setStatus("login");
  },[]);

  function handleLogin(u,days,prData,cex,wg,bw,td){
    localStorage.setItem("gymlog_session",JSON.stringify({username:u}));
    setUser(u);setAllDays(days);setPrs(prData);setCustomEx(cex);
    setWeekGoal(wg);setBodyWeights(bw);setTimerDuration(td);
    setStatus("app");
    const isNew=Object.keys(days||{}).length===0&&Object.keys(cex||{}).length===0;
    if(isNew) setShowWelcomeBanner(true);
  }
  function handleLogout(){
    localStorage.removeItem("gymlog_session");
    setUser(null);setAllDays({});setPrs({});setCustomEx({});
    setWeekGoal(3);setBodyWeights([]);setTimerDuration(90);setCustomPlans([]);setHiddenDefaults([]);setDarkMode(true);setTheme("default");setProfilePic(null);setStatus("login");
  }
  function save(key,val){localStorage.setItem("gymlog_"+key,JSON.stringify(val));}
  function debounce(fn){setSaveStatus("ing");if(saveTimer.current) clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>{fn();setSaveStatus("ok");},600);}
  function saveDays(next){setAllDays(next);debounce(()=>save("days_"+user,next));}
  function savePrs(next){setPrs(next);save("prs_"+user,next);}
  function saveCustomEx(next){setCustomEx(next);save("cex_"+user,next);}
  function saveWeekGoal(v){setWeekGoal(v);save("wgoal_"+user,v);}
  function saveBW(next){setBodyWeights(next);save("bw_"+user,next);}
  function saveTimerDuration(v){setTimerDuration(v);save("timer_"+user,v);}
  function saveCustomPlans(next){setCustomPlans(next);localStorage.setItem("gymlog_cplans_"+user,JSON.stringify(next));save("cplans_"+user,next);}
  function saveHiddenDefaults(next){setHiddenDefaults(next);localStorage.setItem("gymlog_hdef_"+user,JSON.stringify(next));}
  function saveGymName(v){setGymName(v);localStorage.setItem("gymlog_gym_"+user,v);}
  function saveTheme(t){setTheme(t);localStorage.setItem("gymlog_theme_"+user,t);}
  function saveProfilePic(pic){setProfilePic(pic);if(pic) localStorage.setItem("gymlog_pic_"+user,pic); else localStorage.removeItem("gymlog_pic_"+user);}
  function toggleDarkMode(){
    const next=!darkMode;setDarkMode(next);
    const key=user?"gymlog_dark_"+user:"gymlog_dark_guest";
    localStorage.setItem(key,JSON.stringify(next));
  }
  function handleOnboardTemplate(tmpl){
    const newPlans=tmpl.plans.map(p=>({...p,id:"tmpl_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)}));
    saveCustomPlans([...customPlans,...newPlans]);setShowOnboarding(false);
    setTimeout(()=>setShowPicker(true),200);
  }
  function handleOnboardCreateOwn(){setShowOnboarding(false);setView("plans");}
  function handleNewPR(exId,weight){if(!prs[exId]||weight>prs[exId]) savePrs({...prs,[exId]:weight});}

  const dk=dateKey(selectedDate);
  const dayInfo=allDays[dk];
  const planIdx=dayInfo?.type==="A"?0:dayInfo?.type==="B"?1:null;
  const customPlanData=dayInfo?.type?.startsWith("custom_")?customPlans.find(p=>"custom_"+p.id===dayInfo.type):null;
  const isToday=dk===dateKey(today());

  function setDayType(type){saveDays({...allDays,[dk]:{...(allDays[dk]??{}),type}});setShowPicker(false);}
  function updateDayData(data){saveDays({...allDays,[dk]:{...(allDays[dk]??{}),...data}});}

  if(status==="boot") return <div className="loading"><div className="loading-logo">GYM LOG</div><div className="loading-bars"><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/></div><div className="loading-sub">Laden...</div></div>;
  if(status==="login") return <Login onLogin={handleLogin}/>;

  return (
    <>
      <div className="app" ref={el=>{
        if(el){
          document.body.classList.toggle("light",!darkMode);
          THEMES.forEach(t=>document.body.classList.remove("theme-"+t.id));
          if(theme!=="default") document.body.classList.add("theme-"+theme);
          let m1=document.querySelector("meta[name=\"apple-mobile-web-app-capable\"]");
          if(!m1){m1=document.createElement("meta");m1.name="apple-mobile-web-app-capable";document.head.appendChild(m1);}
          m1.content="yes";
        }
      }}>
        {/* Ambient orbs - shown on empty screens */}
        {((view==="log"&&!dayInfo?.type)||(view==="plans"&&customPlans.length===0))&&(
          <div className="orb-layer">
            <div className="orb orb-1"/>
            <div className="orb orb-2"/>
            <div className="orb orb-3"/>
            <div className="orb orb-4"/>
          </div>
        )}
        {egg.show&&<EasterEggModal onClose={()=>egg.setShow(false)}/>}
        {showOnboarding&&<OnboardingModal onSelectTemplate={handleOnboardTemplate} onCreateOwn={handleOnboardCreateOwn} onCancel={()=>setShowOnboarding(false)}/>}
        {showWelcomeBanner&&(
          <div style={{position:"fixed",inset:0,zIndex:800,background:"rgba(0,0,0,.6)",backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",padding:"0 0 100px"}}
            onClick={()=>setShowWelcomeBanner(false)}>
            <div style={{width:"100%",background:"var(--sur)",borderRadius:"24px 24px 0 0",padding:"28px 24px 32px",boxShadow:"0 -8px 40px rgba(0,0,0,.5)"}}
              onClick={e=>e.stopPropagation()}>
              <div style={{width:40,height:4,background:"rgba(255,255,255,.15)",borderRadius:2,margin:"0 auto 24px"}}/>
              <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.4rem",fontWeight:900,letterSpacing:"1px",marginBottom:"8px"}}>Willkommen! 👋</div>
              <div style={{fontSize:".82rem",color:"var(--mut)",lineHeight:1.6,marginBottom:"24px",fontWeight:600}}>
                Tippe auf <strong style={{color:"var(--acc)"}}>+ Planen</strong> um deinen ersten Trainingstag einzurichten — oder schau dir erst die Pläne an.
              </div>
              <div style={{display:"flex",gap:"10px"}}>
                <button onClick={()=>{setShowWelcomeBanner(false);setView("plans");}}
                  style={{flex:1,background:"var(--acc)",color:"var(--acc-txt,#080a0f)",border:"none",borderRadius:"14px",padding:"13px",cursor:"pointer",fontFamily:"'Montserrat',sans-serif",fontSize:".85rem",fontWeight:900,letterSpacing:"1px"}}>
                  PLÄNE ANSEHEN
                </button>
                <button onClick={()=>setShowWelcomeBanner(false)}
                  style={{flex:1,background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"14px",padding:"13px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",fontSize:".85rem",fontWeight:800,color:"var(--mut)"}}>
                  Später
                </button>
              </div>
            </div>
          </div>
        )}
        <header>
          <div className="hlogo">GYM LOG</div>
          <div className="dot"/>
          <button onClick={()=>setShowSettings(true)} style={{background:"none",border:"1px solid rgba(255,255,255,.1)",borderRadius:"10px",padding:"6px 8px",cursor:"pointer",color:"var(--mut)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div className="upill">
            <div className="uav" onClick={()=>setShowSettings(true)} style={{cursor:"pointer",overflow:"hidden"}}>
              {profilePic?<img src={profilePic} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>:user[0].toUpperCase()}
            </div>
            <div className="uname">{user}</div>
            <button className="logoutbtn" onClick={handleLogout}>Logout</button>
          </div>
        </header>

        {view==="cal"?(
          <CalendarView allDays={allDays} selectedDate={selectedDate} onSelectDate={d=>{setSelectedDate(d);setView("log");}} customPlans={customPlans} onDeleteDay={dk=>{const next={...allDays};delete next[dk];saveDays(next);}}/>
        ):view==="stats"?(
          <StatsPage allDays={allDays} prs={prs} bodyWeights={bodyWeights} onSaveBW={saveBW} weekGoal={weekGoal} onSetWeekGoal={saveWeekGoal} timerDuration={timerDuration} onSetTimerDuration={saveTimerDuration} customPlans={customPlans} onSavePlans={saveCustomPlans}/>
        ):view==="gym"?(
          <GymPage gymName={gymName} onSaveGym={saveGymName}/>
        ):view==="plans"?(
          <PlansPage customPlans={customPlans} onSavePlans={saveCustomPlans} hiddenDefaults={hiddenDefaults} onToggleDefault={saveHiddenDefaults}/>
        ):(
          <>
            <div style={{padding:"12px 14px 0"}}>
              <div className="day-banner">
                <div>
                  <div className="day-banner-date" style={{color:"var(--acc)"}}>{isToday?"Heute":selectedDate.toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</div>
                  <div style={{fontSize:".63rem",color:"var(--mut)",marginTop:"2px"}}>{selectedDate.toLocaleDateString("de-DE",{weekday:"long"})}</div>
                </div>
                <div className="day-banner-info">
                  {dayInfo?.type==="A"&&<><div className="day-banner-tag" style={{color:"var(--ga)"}}>TAG A</div><div className="day-banner-sub">Brust & Rucken</div></>}
                  {dayInfo?.type==="B"&&<><div className="day-banner-tag" style={{color:"var(--gb)"}}>TAG B</div><div className="day-banner-sub">Schulter & Arme</div></>}
                  {dayInfo?.type==="rest"&&<div className="day-banner-tag" style={{color:"var(--mut)"}}>Ruhetag</div>}
                  {dayInfo?.type?.startsWith("custom_")&&customPlanData&&<><div className="day-banner-tag" style={{color:customPlanData.color||"var(--acc)"}}>{customPlanData.name.toUpperCase()}</div><div className="day-banner-sub">Eigener Plan</div></>}
                  {!dayInfo?.type&&<div className="day-banner-sub">Kein Training geplant</div>}
                </div>
                <button className="day-banner-change" onClick={()=>{
                  if(!dayInfo?.type&&customPlans.length===0) setShowOnboarding(true);
                  else setShowPicker(true);
                }}>{dayInfo?.type?"Andern":"+ Planen"}</button>
              </div>
              <div className="savebar">
                <span className={`savetxt ${saveStatus}`} style={{color:saveStatus==="ok"?"var(--acc)":"var(--mut)"}}>{saveStatus==="ing"?"Speichert...":"✓ Gespeichert"}</span>
              </div>
            </div>
            {planIdx!==null?(
              <TrainingPage planIdx={planIdx} dayData={dayInfo} customExercises={customEx} onUpdate={updateDayData} onUpdateCustom={saveCustomEx} onChangeType={()=>setShowPicker(true)} prs={prs} onNewPR={handleNewPR} timerDuration={timerDuration} allDays={allDays} currentDk={dk}/>
            ):customPlanData?(
              <CustomTrainingPage plan={customPlanData} dayData={dayInfo} onUpdate={updateDayData} onChangeType={()=>setShowPicker(true)} prs={prs} onNewPR={handleNewPR} timerDuration={timerDuration}/>
            ):dayInfo?.type==="rest"?(
              <div className="rest-wrap">
                <div style={{fontFamily:"'Montserrat',sans-serif",fontSize:"1.4rem",fontWeight:900,color:"var(--mut)",letterSpacing:"2px",marginBottom:"4px"}}>REST</div>
                <div className="rest-title">Ruhetag</div>
                <div style={{fontSize:".78rem",color:"var(--mut)",textAlign:"center"}}>Morgen wieder Gas geben!</div>
                <button className="day-banner-change" style={{marginTop:"8px"}} onClick={()=>setShowPicker(true)}>Andern</button>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                flex:1,padding:"24px 24px 100px",textAlign:"center",position:"relative"}}>


                {/* Day name - huge */}
                <div style={{position:"relative",marginBottom:8,width:"100%"}}>
                  <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:900,
                    fontSize:"clamp(3rem,18vw,5rem)",letterSpacing:"-2px",lineHeight:.85,
                    background:"linear-gradient(160deg,var(--acc) 0%,rgba(255,255,255,.12) 80%)",
                    WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
                    backgroundClip:"text",userSelect:"none"}}>
                    {new Date().toLocaleDateString("de-DE",{weekday:"long"}).toUpperCase()}
                  </div>
                  {/* Blur glow behind text */}
                  <div style={{position:"absolute",inset:0,
                    background:"radial-gradient(ellipse 60% 40% at 50% 60%,var(--acc)08,transparent)",
                    pointerEvents:"none",zIndex:-1}}/>
                </div>

                {/* Date */}
                <div style={{fontSize:".65rem",color:"var(--mut)",fontWeight:700,
                  letterSpacing:"3px",textTransform:"uppercase",marginBottom:28}}>
                  {new Date().toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})}
                </div>

                {/* Divider */}
                <div style={{width:32,height:2,borderRadius:1,background:"rgba(255,255,255,.1)",marginBottom:28}}/>

                {/* Rotating athlete quotes */}
                <QuoteRotator/>

                {/* CTA Button */}
                <button onClick={()=>{
                  if(customPlans.length===0) setShowOnboarding(true);
                  else setShowPicker(true);
                }} style={{
                  background:"var(--acc)",color:"var(--acc-txt,#080a0f)",border:"none",
                  borderRadius:18,padding:"16px 0",cursor:"pointer",
                  fontFamily:"'Montserrat',sans-serif",fontSize:".95rem",fontWeight:900,
                  letterSpacing:"2px",textTransform:"uppercase",
                  boxShadow:"0 0 40px var(--acc)33,0 8px 24px rgba(0,0,0,.15)",
                  width:"100%",maxWidth:300,marginBottom:14,
                  transition:"transform .15s,box-shadow .15s"}}>
                  + TAG PLANEN
                </button>
                <div style={{fontSize:".62rem",color:"rgba(255,255,255,.2)",fontWeight:600,letterSpacing:"1px"}}>
                  oder als Ruhetag markieren
                </div>
              </div>
            )}
          </>
        )}

        <SwipeNav view={view} setView={setView}/>

        {showPicker&&<DayPickerModal date={selectedDate} current={dayInfo?.type} onSelect={setDayType} onClose={()=>setShowPicker(false)} customPlans={customPlans} hiddenDefaults={hiddenDefaults}/>}
        {showSettings&&<SettingsModal
          onClose={()=>setShowSettings(false)}
          currentTheme={theme}
          onThemeChange={t=>saveTheme(t)}
          profilePic={profilePic}
          onProfilePicSave={saveProfilePic}
          darkMode={darkMode}
          onToggleDark={v=>{if(v!==darkMode) toggleDarkMode();}}
        />}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script></body></html>
